<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="北医系统解剖学正式复习题库入口" />
  <meta http-equiv="refresh" content="0;url=./movement-system.html" />
  <title>北医系统解剖学 · 正式题库</title>
  <style>
    :root{--ink:#142235;--muted:#64748b;--blue:#2563eb;--line:#d8e1eb}
    *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:linear-gradient(135deg,#eef3f8,#f8fbff);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Helvetica Neue",Arial,sans-serif}
    .card{width:min(560px,calc(100% - 32px));padding:36px 30px;text-align:center;background:#fff;border:1px solid var(--line);border-radius:24px;box-shadow:0 20px 60px rgba(28,58,91,.12)}
    .mark{width:48px;height:48px;margin:0 auto 16px;display:grid;place-items:center;border-radius:16px;background:linear-gradient(135deg,#245be8,#7aa8ff);color:#fff;font-weight:800;font-size:22px}
    h1{margin:0;font-size:30px;letter-spacing:-.05em}p{margin:12px 0 22px;color:var(--muted);line-height:1.7}.button{display:inline-block;padding:12px 18px;border-radius:12px;background:var(--blue);color:#fff;text-decoration:none;font-weight:800}
  </style>
</head>
<body>
  <main class="card">
    <div class="mark">解</div>
    <h1>正在进入第一篇运动系统正式题库</h1>
    <p>演示题已移除，页面将自动打开正式题库。若没有自动跳转，请点击下方按钮。</p>
    <a class="button" href="./movement-system.html">进入正式题库</a>
  </main>
  <script>window.location.replace('./movement-system.html');</script>
</body>
</html>
