<!doctype html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="北医系统解剖学个人复习站，运动系统演示题库、即时解析和错题本"><title>北医系统解剖学 · 复习站</title><style>
:root{--bg:#eef3f8;--card:#fff;--ink:#142235;--muted:#64748b;--line:#d8e1eb;--blue:#2563eb;--soft:#e8f0ff;--green:#087f5b;--red:#bd3b3b;--shadow:0 18px 48px #1c3a5b19;--r:20px}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 20% -10%,#fff,#eef3f8 48%,#e8eff6);color:var(--ink);font:16px/1.55 -apple-system,BlinkMacSystemFont,"SF Pro Display","PingFang SC","Helvetica Neue",Arial,sans-serif}button{font:inherit}a{color:inherit;text-decoration:none}.wrap{max-width:1160px;margin:auto;padding:0 22px}.top{height:68px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #d8e1ebcc;background:#ffffffc2;backdrop-filter:blur(18px);position:sticky;top:0;z-index:3}.brand{display:flex;align-items:center;gap:10px;font-weight:800}.mark{width:34px;height:34px;border-radius:11px;display:grid;place-items:center;background:linear-gradient(135deg,#245be8,#7aa8ff);color:#fff}.brand small{display:block;color:var(--muted);font-size:10px;letter-spacing:.08em;text-transform:uppercase}.hero{padding:58px 0 40px;display:grid;grid-template-columns:1.2fr .8fr;gap:38px;align-items:end}.eyebrow{color:var(--blue);font-size:12px;font-weight:800;letter-spacing:.12em;text-transform:uppercase}.hero h1{font-size:clamp(42px,6vw,72px);line-height:1.03;letter-spacing:-.07em;margin:14px 0 18px}.hero h1 span{display:block;color:#55708f}.hero p{color:var(--muted);font-size:17px;max-width:680px;margin:0}.note,.panel{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}.note{padding:20px}.note b{font-size:24px;letter-spacing:-.04em}.note p{font-size:13px;margin:4px 0 12px}.bar{height:8px;background:#edf1f6;border-radius:99px;overflow:hidden}.bar i{display:block;height:100%;background:linear-gradient(90deg,#3b82f6,#1d4ed8);border-radius:99px}.layout{display:grid;grid-template-columns:240px 1fr;gap:20px;align-items:start;padding-bottom:70px}.side{padding:18px;position:sticky;top:88px}.side h2{font-size:13px;color:var(--muted);margin:0 0 12px}.chapter{display:flex;width:100%;justify-content:space-between;border:1px solid transparent;background:transparent;border-radius:13px;padding:11px 10px;margin-bottom:6px;cursor:pointer;text-align:left}.chapter:hover,.chapter.on{background:var(--soft);border-color:#c8d8ff;color:#1748b8}.chapter span{color:var(--muted);font-size:12px}.stats{display:grid;grid-template-columns:1fr 1fr;gap:9px;border-top:1px solid var(--line);margin-top:17px;padding-top:17px}.stat{background:#f7f9fc;border-radius:13px;padding:10px}.stat b{display:block;font-size:20px}.stat span{font-size:11px;color:var(--muted)}.clear{border:0;background:transparent;padding:10px 0;color:var(--red);cursor:pointer;font-weight:700;font-size:12px}.tabs{display:flex;gap:8px;margin-bottom:14px}.tab{border:1px solid var(--line);background:#ffffffc2;color:var(--muted);border-radius:999px;padding:9px 15px;font-weight:800;cursor:pointer;font-size:13px}.tab.on{background:var(--ink);border-color:var(--ink);color:#fff}.quiz{padding:26px}.head{display:flex;justify-content:space-between;gap:16px;align-items:start}.tag{display:inline-block;background:var(--soft);color:#1748b8;border-radius:99px;padding:5px 10px;font-size:12px;font-weight:800}.progress-label{color:var(--muted);font-size:12px}.question{font-size:24px;line-height:1.35;letter-spacing:-.03em;margin:18px 0}.options{display:grid;gap:10px}.option{width:100%;display:flex;gap:12px;text-align:left;border:1px solid var(--line);background:#fff;border-radius:14px;padding:14px;cursor:pointer}.option:hover{border-color:#8bb1ff;background:#f8fbff}.option .key{width:27px;height:27px;border-radius:9px;background:#f0f3f7;display:grid;place-items:center;font-weight:800;font-size:13px;flex:0 0 auto}.option.selected{border-color:#6d9aff;background:#f3f7ff}.option.selected .key{background:var(--blue);color:#fff}.option.good{border-color:#57bd97;background:#e7f8f1}.option.good .key{background:var(--green);color:#fff}.option.bad{border-color:#ea8d8d;background:#fff0f0}.option.bad .key{background:var(--red);color:#fff}.option:disabled{cursor:default}.feedback{margin-top:17px;padding:15px 16px;border-radius:14px}.feedback.good{background:#e7f8f1;color:var(--green)}.feedback.bad{background:#fff0f0;color:var(--red)}.feedback b{display:block;margin-bottom:4px}.feedback p{margin:0;color:var(--ink);font-size:14px}.feedback small{display:block;color:var(--muted);margin-top:6px}.actions{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:22px}.primary,.secondary{border:0;border-radius:11px;padding:11px 17px;font-weight:800;cursor:pointer}.primary{background:var(--blue);color:#fff}.primary:disabled{opacity:.45;cursor:not-allowed}.secondary{background:#edf2f8;color:var(--ink)}.wrong{display:grid;gap:12px}.wrongitem{border:1px solid var(--line);border-radius:14px;padding:15px}.wrongitem h3{font-size:16px;margin:0 0 5px}.wrongitem p{font-size:13px;color:var(--muted);margin:0}.wrongitem footer{display:flex;justify-content:space-between;align-items:center;margin-top:12px;color:var(--muted);font-size:12px}.link{border:0;background:transparent;color:var(--blue);font-weight:800;cursor:pointer}.result{text-align:center;padding:25px}.result .score{font-size:64px;font-weight:900;color:var(--blue);letter-spacing:-.08em}.result h2{margin:0}.result p{color:var(--muted)}.empty{text-align:center;padding:40px;color:var(--muted);border:1px dashed var(--line);border-radius:16px}.foot{border-top:1px solid var(--line);padding:22px 0 35px;color:var(--muted);font-size:12px;display:flex;justify-content:space-between;gap:15px}@media(max-width:800px){.hero{grid-template-columns:1fr}.layout{grid-template-columns:1fr}.side{position:static}.chapterlist{display:grid;grid-template-columns:1fr 1fr;gap:6px}.chapter{margin:0}}@media(max-width:560px){.wrap{padding:0 15px}.top{height:60px}.brand small{display:none}.hero{padding-top:42px}.hero h1{font-size:45px}.hero p{font-size:16px}.quiz{padding:20px 15px}.question{font-size:21px}.actions{flex-direction:column-reverse;align-items:stretch}.actions button{width:100%}.foot{display:block}.foot span{display:block}.foot span+span{margin-top:7px}}
</style></head><body><header class="top"><div class="wrap" style="width:100%;display:flex;align-items:center;justify-content:space-between"><a class="brand" href="./index.html"><span class="mark">解</span><span>北医系统解剖学<small>Review Station · v0.1</small></span></a><a href="./index.html" style="font-size:13px;color:#64748b">返回作品集</a></div></header><main class="wrap"><section class="hero"><div><div class="eyebrow">Anatomy review station</div><h1>把系统解剖学，<span>拆成可以复习的题。</span></h1><p>第一版先从运动系统开始：单选题、即时解析、进度记录和错题本都在浏览器本地运行，不需要登录。</p><p style="font-size:12px;margin-top:12px">当前题目为交互演示题，正式题库请按教材版本核对后再导入。本页面不是北京大学医学部官方平台。</p></div><div class="note"><b id="daily">0 / 10</b><p>今日练习进度</p><div class="bar"><i id="dailybar" style="width:0%"></i></div></div></section><section class="layout"><aside class="panel side"><h2>选择章节</h2><div id="chapters" class="chapterlist"></div><div class="stats"><div class="stat"><b id="answered">0</b><span>累计答题</span></div><div class="stat"><b id="rate">0%</b><span>正确率</span></div><div class="stat"><b id="wrongCount">0</b><span>错题</span></div><div class="stat"><b id="streak">0</b><span>连续学习</span></div></div><button class="clear" id="clear">清除本机记录</button></aside><div><div class="tabs"><button class="tab on" data-view="quiz">开始练习</button><button class="tab" data-view="wrong">错题本 <span id="badge"></span></button></div><section id="quiz" class="panel quiz"></section><section id="wrong" class="panel quiz" style="display:none"></section></div></section></main><footer class="wrap foot"><span>北医系统解剖学 · 个人复习工具</span><span>题库、来源和答案请以你的教材版本为准</span></footer><script>
const qs=[
{id:'bone1',c:'骨骼',d:'基础',q:'下列哪一项最符合运动系统的基本组成？',o:['骨、骨连接和骨骼肌','心脏、血管和血液','脑、脊髓和周围神经','胃、小肠和大肠'],a:0,e:'运动系统通常由骨、骨连接和骨骼肌组成，三者共同完成支持、保护和运动等功能。'},
{id:'bone2',c:'骨骼',d:'基础',q:'肱骨位于人体的哪个部位？',o:['前臂','上臂','大腿','小腿'],a:1,e:'肱骨是上肢的长骨，位于肩关节与肘关节之间。'},
{id:'joint1',c:'关节',d:'基础',q:'覆盖关节面、帮助减少摩擦的结构是？',o:['关节囊','关节软骨','韧带','滑膜'],a:1,e:'关节软骨覆盖相对的关节面，可减少摩擦并分散压力。'},
{id:'joint2',c:'关节',d:'中等',q:'肩关节活动范围较大，主要与哪一特点有关？',o:['关节面形状允许多轴运动','关节完全没有关节囊','关节面没有软骨','关节被完全固定'],a:0,e:'肩关节属于球窝关节，关节形态允许多轴运动。'},
{id:'muscle1',c:'肌',d:'基础',q:'骨骼肌通常通过什么结构把力量传递到骨？',o:['肌腹','肌腱','滑膜','骨髓'],a:1,e:'肌腱位于肌肉两端，主要负责把肌肉收缩产生的力量传递到骨。'},
{id:'muscle2',c:'肌',d:'中等',q:'分析一块肌肉的作用时，首先应明确什么？',o:['颜色','跨越的关节和附着点','血型','皮肤温度'],a:1,e:'肌肉跨越哪些关节以及起止点在哪里，是分析其运动作用的重要基础。'},
{id:'review1',c:'综合',d:'基础',q:'哪种整理方式最有助于建立结构与功能的联系？',o:['只背孤立名词','把位置、连接、作用放在同一张卡片中','只看图片','只记录题号'],a:1,e:'把位置、连接关系和作用放在一起，更容易形成结构—功能联系。'},
{id:'review2',c:'综合',d:'基础',q:'错题本最适合记录哪些内容？',o:['只记录题号','题干、自己的选择、正确答案和错因','只记录分数','只记录颜色'],a:1,e:'错题本的价值在于定位错误原因，因此应保留自己的选择、正确答案和简短错因。'}];
const key='bmuAnatomy:v1', today=()=>new Date().toISOString().slice(0,10);let saved=JSON.parse(localStorage.getItem(key)||'null')||{answered:0,correct:0,wrong:[],history:[],streak:0,last:''};let s={chapter:'全部',queue:qs,index:0,selected:null,done:false,score:0};const $=id=>document.getElementById(id);const chapters=['全部',...new Set(qs.map(x=>x.c))];function save(){localStorage.setItem(key,JSON.stringify(saved));stats()}function stats(){let r=saved.answered?Math.round(saved.correct/saved.answered*100):0;$("answered").textContent=saved.answered;$("rate").textContent=r+'%';$("wrongCount").textContent=saved.wrong.length;$("streak").textContent=saved.streak;$("badge").textContent=saved.wrong.length?' · '+saved.wrong.length:'';let n=saved.history.filter(x=>x.date===today()).length;$("daily").textContent=Math.min(n,10)+' / 10';$("dailybar").style.width=Math.min(n,10)*10+'%'}function renderChapters(){$("chapters").innerHTML=chapters.map(c=>'<button class="chapter '+(s.chapter===c?'on':'')+'" data-c="'+c+'"><b>'+c+'</b><span>'+ (c==='全部'?qs.length:qs.filter(x=>x.c===c).length)+' 题</span></button>').join('');document.querySelectorAll('[data-c]').forEach(b=>b.onclick=()=>{s.chapter=b.dataset.c;start()})}function start(){s.queue=s.chapter==='全部'?qs:qs.filter(x=>x.c===s.chapter);s.index=0;s.selected=null;s.done=false;s.score=0;renderChapters();showQuiz()}function showQuiz(){let q=s.queue[s.index];$("wrong").style.display='none';$("quiz").style.display='block';document.querySelectorAll('.tab').forEach(t=>t.classList.toggle('on',t.dataset.view==='quiz'));if(!q){$("quiz").innerHTML='<div class="empty">这一章节暂时没有题目。</div>';return}let pct=Math.round(s.index/s.queue.length*100);$("quiz").innerHTML='<div class="head"><div><span class="tag">'+q.c+' · '+q.d+'</span><div class="progress-label">第 '+(s.index+1)+' / '+s.queue.length+' 题</div></div><span class="progress-label">本轮正确 '+s.score+' 题</span></div><div class="bar" style="margin:16px 0 22px"><i style="width:'+pct+'%"></i></div><h2 class="question">'+q.q+'</h2><div class="options">'+q.o.map((x,i)=>'<button class="option" data-i="'+i+'"><span class="key">'+String.fromCharCode(65+i)+'</span><span>'+x+'</span></button>').join('')+'</div><div id="feedback"></div><div class="actions"><span style="font-size:12px;color:#64748b">演示题 · 需要核对来源</span><button class="primary" id="go" disabled>提交答案</button></div>';document.querySelectorAll('[data-i]').forEach(b=>b.onclick=()=>{if(s.done)return;s.selected=+b.dataset.i;document.querySelectorAll('[data-i]').forEach(x=>x.classList.toggle('selected',x===b));$("go").disabled=false});$("go").onclick=action}function action(){if(!s.done){if(s.selected===null)return;answer()}else if(s.index===s.queue.length-1){result()}else{s.index++;s.selected=null;s.done=false;showQuiz()}}function answer(){let q=s.queue[s.index],ok=s.selected===q.a;s.done=true;if(ok)s.score++;saved.answered++;if(ok)saved.correct++;if(!ok&&!saved.wrong.includes(q.id))saved.wrong.push(q.id);saved.history=[{id:q.id,date:today(),ok:ok},...saved.history].slice(0,100);if(saved.last!==today()){saved.streak++;saved.last=today()}save();document.querySelectorAll('[data-i]').forEach((b,i)=>{b.disabled=true;if(i===q.a)b.classList.add('good');if(i===s.selected&&i!==q.a)b.classList.add('bad')});$("feedback").innerHTML='<div class="feedback '+(ok?'good':'bad')+'"><b>'+(ok?'回答正确':'需要复盘')+'</b><p>'+q.e+'</p><small>正确答案：'+String.fromCharCode(65+q.a)+' · '+q.o[q.a]+'</small></div>';$('go').textContent=s.index===s.queue.length-1?'查看结果':'下一题';$('go').disabled=false}function result(){$('quiz').innerHTML='<div class="result"><div class="eyebrow">Session complete</div><div class="score">'+Math.round(s.score/s.queue.length*100)+'%</div><h2>本轮复习完成</h2><p>答对 '+s.score+' / '+s.queue.length+' 题。把错题再做一遍。</p><button class="primary" id="retry">再来一轮</button> <button class="secondary" id="seeWrong">查看错题本</button></div>';$('retry').onclick=start;$('seeWrong').onclick=()=>showWrong()}function showWrong(){document.querySelectorAll('.tab').forEach(t=>t.classList.toggle('on',t.dataset.view==='wrong'));$('quiz').style.display='none';$('wrong').style.display='block';let list=qs.filter(q=>saved.wrong.includes(q.id));$('wrong').innerHTML='<div class="head"><div><span class="tag">Wrong questions</span><h2 style="margin:10px 0 0">错题本</h2></div><span class="progress-label">'+list.length+' 道待复盘</span></div><div style="height:1px;background:#d8e1eb;margin:18px 0"></div>'+(list.length?'<div class="wrong">'+list.map(q=>'<article class="wrongitem"><h3>'+q.q+'</h3><p>'+q.e+'</p><footer><span>'+q.c+'</span><button class="link" data-redo="'+q.id+'">重做</button></footer></article>').join('')+'</div>':'<div class="empty">还没有错题。完成一轮练习后，答错的题会自动出现在这里。</div>');document.querySelectorAll('[data-redo]').forEach(b=>b.onclick=()=>{let q=qs.find(x=>x.id===b.dataset.redo);s.chapter=q.c;s.queue=[q];s.index=0;s.selected=null;s.done=false;s.score=0;showQuiz();renderChapters()})}document.querySelectorAll('.tab').forEach(t=>t.onclick=()=>t.dataset.view==='quiz'?showQuiz():showWrong());$('clear').onclick=()=>{if(confirm('确定清除本机练习记录吗？')){saved={answered:0,correct:0,wrong:[],history:[],streak:0,last:''};save();start()}};start();stats();
</script></body></html>
