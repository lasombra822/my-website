<title>北医生物化学 · 复习站</title>
<style>
:root{--bg:#f4f7f4;--panel:#fff;--ink:#14251d;--muted:#68756e;--line:#d8e3dc;--green:#15803d;--green2:#0d5e2d;--soft:#e8f6ec;--red:#b83a3a;--redsoft:#fff0f0;--shadow:0 18px 50px rgba(27,72,45,.1);--radius:20px;--sans:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text","PingFang SC","Helvetica Neue",Arial,sans-serif}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:radial-gradient(circle at 15% -10%,#fff 0,#f4f7f4 45%,#eaf2ec 100%);color:var(--ink);font-family:var(--sans);line-height:1.55}a{color:inherit;text-decoration:none}button{font:inherit}.wrap{max-width:1160px;margin:auto;padding:0 22px}.top{height:68px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #dfe8e1;background:rgba(255,255,255,.8);backdrop-filter:blur(18px);position:sticky;top:0;z-index:4}.brand{display:flex;align-items:center;gap:10px;font-weight:800}.mark{width:34px;height:34px;display:grid;place-items:center;border-radius:11px;color:#fff;background:linear-gradient(135deg,#15803d,#79bd86);box-shadow:0 8px 18px rgba(21,128,61,.25)}.brand small{display:block;color:var(--muted);font-size:10px;font-weight:600;letter-spacing:.08em;text-transform:uppercase}.nav{display:flex;gap:8px}.nav a{padding:8px 11px;color:var(--muted);font-size:13px;border-radius:10px}.nav a:hover{background:var(--soft);color:var(--green2)}.hero{padding:64px 0 40px;display:grid;grid-template-columns:1.2fr .8fr;gap:36px;align-items:end}.eyebrow{font-size:12px;color:var(--green);font-weight:800;letter-spacing:.13em;text-transform:uppercase}.hero h1{font-size:clamp(42px,6vw,74px);line-height:1.05;letter-spacing:-.07em;margin:15px 0 18px}.hero h1 span{display:block;color:#537261}.hero-copy{max-width:640px;color:var(--muted);font-size:17px;margin:0}.note{padding:20px;background:var(--panel);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow)}.note strong{display:block;font-size:24px}.note p{margin:5px 0 0;color:var(--muted);font-size:13px}.disclaimer{margin:15px 0 0;color:#78857d;font-size:12px}.layout{display:grid;grid-template-columns:245px 1fr;gap:20px;padding-bottom:76px}.side,.panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}.side{padding:18px;height:max-content;position:sticky;top:87px}.side h2{margin:0 0 12px;color:var(--muted);font-size:13px}.chapters{display:grid;gap:7px}.chapter{display:flex;justify-content:space-between;gap:6px;width:100%;padding:12px;border:1px solid transparent;border-radius:13px;background:transparent;color:var(--ink);text-align:left;cursor:pointer}.chapter:hover,.chapter.active{background:var(--soft);border-color:#bde0c7;color:var(--green2)}.chapter span{font-size:11px;color:var(--muted)}.divider{height:1px;background:var(--line);margin:18px 0}.stats{display:grid;grid-template-columns:1fr 1fr;gap:8px}.stat{padding:10px;border-radius:12px;background:#f7faf7}.stat strong{display:block;font-size:21px}.stat small{color:var(--muted);font-size:11px}.clear{margin-top:15px;border:0;background:transparent;color:var(--muted);font-size:12px;cursor:pointer}.clear:hover{color:var(--red)}.tabs{display:flex;gap:8px;padding:18px 20px 0}.tab{border:1px solid var(--line);border-radius:999px;padding:8px 14px;background:#fff;color:var(--muted);font-weight:700;font-size:13px;cursor:pointer}.tab.active{background:var(--ink);border-color:var(--ink);color:#fff}.quiz{padding:24px}.head{display:flex;justify-content:space-between;gap:16px}.tag{padding:6px 10px;border-radius:999px;background:var(--soft);color:var(--green2);font-size:12px;font-weight:800}.muted{color:var(--muted);font-size:12px}.progress{height:8px;background:#edf3ee;border-radius:99px;overflow:hidden;margin:16px 0 23px}.progress i{display:block;height:100%;background:linear-gradient(90deg,#44a85b,#15803d);border-radius:99px;transition:width .25s}.question{font-size:23px;line-height:1.35;letter-spacing:-.035em;margin:8px 0 20px}.options{display:grid;gap:10px}.option{display:flex;gap:11px;align-items:flex-start;width:100%;padding:14px;border:1px solid var(--line);background:#fff;border-radius:14px;color:var(--ink);text-align:left;cursor:pointer}.option:hover{border-color:#83c18f;background:#fbfffb}.option .key{display:grid;place-items:center;width:26px;height:26px;flex:0 0 auto;border-radius:8px;background:#f0f4f0;color:#56705d;font-size:12px;font-weight:800}.option.selected{border-color:#68af76;background:#f2fbf3}.option.selected .key{background:var(--green);color:#fff}.option.correct{border-color:#60bd7c;background:var(--soft)}.option.correct .key{background:var(--green);color:#fff}.option.wrong{border-color:#e79898;background:var(--redsoft)}.option.wrong .key{background:var(--red);color:#fff}.option:disabled{cursor:default}.feedback{margin-top:16px;padding:15px 16px;border-radius:14px}.feedback.ok{background:var(--soft);color:var(--green2)}.feedback.no{background:var(--redsoft);color:var(--red)}.feedback strong{display:block;margin-bottom:4px}.feedback p{margin:0;color:var(--ink);font-size:14px}.feedback small{display:block;margin-top:7px;color:var(--muted)}.actions{display:flex;justify-content:space-between;gap:12px;align-items:center;margin-top:22px}.primary,.secondary{border:0;border-radius:11px;padding:11px 16px;font-weight:800;cursor:pointer}.primary{background:var(--green);color:#fff;box-shadow:0 8px 18px rgba(21,128,61,.2)}.primary:disabled{opacity:.45;cursor:not-allowed}.secondary{background:#edf3ee;color:var(--ink)}.empty{text-align:center;padding:42px 20px;color:var(--muted);border:1px dashed var(--line);border-radius:15px}.wrong-list{display:grid;gap:11px}.wrong-item{border:1px solid var(--line);border-radius:14px;padding:15px}.wrong-item h3{font-size:16px;margin:0 0 6px}.wrong-item p{margin:0;color:var(--muted);font-size:13px}.wrong-meta{display:flex;justify-content:space-between;gap:8px;margin-top:12px;color:var(--muted);font-size:11px}.redo{border:0;background:transparent;color:var(--green);font-weight:800;cursor:pointer}.result{text-align:center;padding:30px 10px}.score{font-size:64px;font-weight:900;color:var(--green);letter-spacing:-.08em}.result h2{margin:0}.result p{color:var(--muted)}.footer{border-top:1px solid var(--line);padding:22px 0 35px;color:var(--muted);font-size:12px;display:flex;justify-content:space-between;gap:16px}@media(max-width:800px){.hero{grid-template-columns:1fr;padding-top:45px}.layout{grid-template-columns:1fr}.side{position:static}.chapters{grid-template-columns:1fr 1fr}.stats{grid-template-columns:repeat(4,1fr)}}@media(max-width:560px){.wrap{padding:0 15px}.brand small{display:none}.nav a{font-size:11px;padding:7px}.hero h1{font-size:46px}.hero-copy{font-size:16px}.chapters{grid-template-columns:1fr 1fr}.quiz{padding:20px 15px}.question{font-size:21px}.actions{flex-direction:column-reverse;align-items:stretch}.actions button{width:100%}.footer{display:block}.footer span{display:block}.footer span+span{margin-top:7px}}
</style>
</head>
<body>
<header class="top"><div class="wrap" style="width:100%;display:flex;align-items:center;justify-content:space-between"><a class="brand" href="./index.html"><span class="mark">生</span><span>北医生物化学<small>Review Station · v0.1</small></span></a><nav class="nav"><a href="./anatomy.html">系统解剖学</a><a href="./index.html">返回作品集</a></nav></div></header>
<main class="wrap"><section class="hero"><div><div class="eyebrow">Biochemistry review station</div><h1>把生物化学，<span>拆成可以复习的题。</span></h1><p class="hero-copy">第一版从蛋白质、酶、糖代谢和生物氧化开始：单选题、即时解析、进度记录和错题本都在浏览器本地运行，不需要登录。</p><p class="disclaimer">当前题目是交互演示题，正式题库请按教材版本、课程要求和来源核对后再导入。本页面不是北京大学医学部官方平台。</p></div><div class="note"><strong id="today">0 / 10</strong><p>今日练习进度</p><div class="progress" style="margin:13px 0 0"><i id="todayBar" style="width:0%"></i></div></div></section>
<section class="layout"><aside class="side"><h2>选择章节</h2><div class="chapters" id="chapters"></div><div class="divider"></div><h2>本地记录</h2><div class="stats"><div class="stat"><strong id="answered">0</strong><small>累计答题</small></div><div class="stat"><strong id="rate">0%</strong><small>正确率</small></div><div class="stat"><strong id="wrongNum">0</strong><small>错题</small></div><div class="stat"><strong id="sessions">0</strong><small>学习次数</small></div></div><button class="clear" id="clear">清除本机记录</button></aside><section class="panel"><div class="tabs"><button class="tab active" id="quizTab">开始练习</button><button class="tab" id="wrongTab">错题本 <span id="badge"></span></button></div><div id="quiz" class="quiz"></div><div id="wrong" class="quiz" hidden></div></section></section></main>
<footer class="wrap footer"><span>北医生物化学 · 个人复习工具</span><span>题库、来源和答案请以你的教材版本为准</span></footer>
<script>
const qs=[
{id:'bio-001',chapter:'蛋白质',level:'基础',stem:'蛋白质一级结构主要指什么？',opts:['氨基酸的排列顺序','多肽链的螺旋和折叠方式','多条肽链的空间组合','蛋白质与底物的结合方式'],ans:0,explain:'蛋白质一级结构是多肽链中氨基酸残基按一定顺序排列形成的线性序列，通常由肽键连接。',point:'蛋白质结构层次'},
{id:'bio-002',chapter:'蛋白质',level:'中等',stem:'当溶液 pH 低于某蛋白质的等电点时，该蛋白质整体更可能带有什么电荷？',opts:['正电荷','负电荷','不带任何电荷','电荷一定不变'],ans:0,explain:'在 pH 低于等电点时，蛋白质接受质子的程度增加，整体更倾向于带正电荷。',point:'等电点与电荷'},
{id:'bio-003',chapter:'酶',level:'基础',stem:'酶催化反应的主要作用是？',opts:['降低反应的活化能','改变反应的平衡常数','让所有反应都变成不可逆','提高产物的最终能量'],ans:0,explain:'酶通过稳定过渡态等方式降低反应活化能，从而加快达到平衡的速度，但不改变反应平衡常数。',point:'酶的催化作用'},
{id:'bio-004',chapter:'糖代谢',level:'基础',stem:'糖酵解在细胞内主要发生在哪里？',opts:['细胞质基质','线粒体基质','细胞核','溶酶体'],ans:0,explain:'糖酵解是葡萄糖分解为丙酮酸的一系列反应，主要在细胞质基质中进行。',point:'糖酵解定位'},
{id:'bio-005',chapter:'糖代谢',level:'中等',stem:'在有氧条件下，糖酵解产生的丙酮酸通常进一步转变为？',opts:['乙酰辅酶 A','乳酸','尿素','胆固醇'],ans:0,explain:'有氧条件下，丙酮酸进入线粒体并经丙酮酸脱氢酶复合体转变为乙酰辅酶 A，随后进入三羧酸循环。',point:'丙酮酸去路'},
{id:'bio-006',chapter:'生物氧化',level:'基础',stem:'NADH 在细胞代谢中的典型作用是？',opts:['携带高能电子并参与能量生成','直接构成核糖体','储存遗传信息','催化所有肽键形成'],ans:0,explain:'NADH 可将高能电子传递给呼吸链，电子传递形成的质子梯度可用于合成 ATP。',point:'电子载体'},
{id:'bio-007',chapter:'生物氧化',level:'中等',stem:'真核细胞三羧酸循环的主要场所是？',opts:['线粒体基质','细胞质基质','细胞核内','高尔基体腔内'],ans:0,explain:'真核细胞中，三羧酸循环的主要反应在线粒体基质内进行。',point:'三羧酸循环定位'},
{id:'bio-008',chapter:'综合',level:'基础',stem:'复习代谢通路时，哪种整理方式最有助于理解各反应之间的关系？',opts:['同时记录反应物、产物、关键酶和细胞定位','只背每条通路的中文名称','只记住某个反应的颜色','只记录题号不记录错因'],ans:0,explain:'把反应物、产物、关键酶和细胞定位放在同一张图或卡片中，更容易建立代谢通路的整体框架。',point:'代谢通路复习'}
];
const chapters=['全部'].concat(Array.from(new Set(qs.map(q=>q.chapter))));
const key='bmuBiochemistry:v1';
let saved=JSON.parse(localStorage.getItem(key)||'null')||{answered:0,correct:0,wrong:[],history:[]};
let state={chapter:'全部',queue:[],index:0,choice:null,done:false,score:0};
const $=id=>document.getElementById(id); const today=()=>new Date().toISOString().slice(0,10);
function persist(){localStorage.setItem(key,JSON.stringify(saved));updateStats()}
function updateStats(){const r=saved.answered?Math.round(saved.correct/saved.answered*100):0;$("answered").textContent=saved.answered;$("rate").textContent=r+'%';$("wrongNum").textContent=saved.wrong.length;$("badge").textContent=saved.wrong.length?' · '+saved.wrong.length:'';const d=Math.min(saved.history.filter(x=>x.date===today()).length,10);$("today").textContent=d+' / 10';$("todayBar").style.width=d*10+'%';$("sessions").textContent=new Set(saved.history.map(x=>x.date)).size}
function renderChapters(){$("chapters").innerHTML=chapters.map(c=>'<button class="chapter '+(state.chapter===c?'active':'')+'" data-chapter="'+c+'"><b>'+c+'</b><span>'+ (c==='全部'?qs.length:qs.filter(q=>q.chapter===c).length) +' 题</span></button>').join('');document.querySelectorAll('[data-chapter]').forEach(b=>b.onclick=()=>start(b.dataset.chapter))}
function start(ch){state.chapter=ch||state.chapter;state.queue=state.chapter==='全部'?qs:qs.filter(q=>q.chapter===state.chapter);state.index=0;state.choice=null;state.done=false;state.score=0;showQuiz();renderChapters();renderQuestion()}
function renderQuestion(){const q=state.queue[state.index];if(!q){$("quiz").innerHTML='<div class="empty">这一章节暂时没有题目。</div>';return}const pct=Math.round(state.index/state.queue.length*100);$("quiz").innerHTML='<div class="head"><div><span class="tag">'+q.chapter+' · '+q.level+'</span><div class="muted" style="margin-top:9px">第 '+(state.index+1)+' / '+state.queue.length+' 题</div></div><span class="muted">本轮正确 '+state.score+' 题</span></div><div class="progress"><i style="width:'+pct+'%"></i></div><h2 class="question">'+q.stem+'</h2><div class="options">'+q.opts.map((o,i)=>'<button class="option" data-opt="'+i+'"><span class="key">'+String.fromCharCode(65+i)+'</span><span>'+o+'</span></button>').join('')+'</div><div id="feedback"></div><div class="actions"><span class="muted">知识点：'+q.point+'</span><button class="primary" id="action" disabled>提交答案</button></div>';document.querySelectorAll('[data-opt]').forEach(b=>b.onclick=()=>{if(state.done)return;state.choice=Number(b.dataset.opt);document.querySelectorAll('[data-opt]').forEach(x=>x.classList.toggle('selected',x===b));$("action").disabled=false});$("action").onclick=act}
function act(){if(!state.done){if(state.choice===null)return;answer()}else if(state.index===state.queue.length-1){result()}else{state.index++;state.choice=null;state.done=false;renderQuestion()}}
function answer(){const q=state.queue[state.index];state.done=true;const ok=state.choice===q.ans;if(ok)state.score++;saved.answered++;if(ok)saved.correct++;if(!ok&&!saved.wrong.includes(q.id))saved.wrong.push(q.id);saved.history=[{id:q.id,date:today(),ok:ok},...saved.history].slice(0,200);persist();document.querySelectorAll('[data-opt]').forEach((b,i)=>{b.disabled=true;if(i===q.ans)b.classList.add('correct');if(i===state.choice&&i!==q.ans)b.classList.add('wrong')});$("feedback").innerHTML='<div class="feedback '+(ok?'ok':'no')+'"><strong>'+(ok?'回答正确':'需要复盘')+'</strong><p>'+q.explain+'</p><small>正确答案：'+String.fromCharCode(65+q.ans)+' · '+q.opts[q.ans]+'</small></div>';$("action").textContent=state.index===state.queue.length-1?'查看结果':'下一题';$("action").disabled=false}
function result(){const rate=Math.round(state.score/state.queue.length*100);$("quiz").innerHTML='<div class="result"><div class="eyebrow">Session complete</div><div class="score">'+rate+'%</div><h2>本轮复习完成</h2><p>答对 '+state.score+' / '+state.queue.length+' 题。把错题再做一遍，效果会更好。</p><button class="primary" id="retry">再来一轮</button></div>';$('retry').onclick=()=>start(state.chapter)}
function showQuiz(){$("quiz").hidden=false;$("wrong").hidden=true;$("quizTab").classList.add('active');$("wrongTab").classList.remove('active')}
function showWrong(){$("quiz").hidden=true;$("wrong").hidden=false;$("quizTab").classList.remove('active');$("wrongTab").classList.add('active');const list=qs.filter(q=>saved.wrong.includes(q.id));$("wrong").innerHTML='<div class="head"><div><span class="tag">Wrong questions</span><h2 style="margin:12px 0 0">错题本</h2></div><span class="muted">'+list.length+' 道待复盘</span></div><div class="divider"></div>'+(list.length?'<div class="wrong-list">'+list.map(q=>'<article class="wrong-item"><h3>'+q.stem+'</h3><p>'+q.explain+'</p><div class="wrong-meta"><span>'+q.chapter+' · '+q.point+'</span><button class="redo" data-redo="'+q.id+'">重做</button></div></article>').join('')+'</div>':'<div class="empty">还没有错题。完成一轮练习后，答错的题会自动出现在这里。</div>');document.querySelectorAll('[data-redo]').forEach(b=>b.onclick=()=>{const q=qs.find(x=>x.id===b.dataset.redo);state.chapter=q.chapter;state.queue=[q];state.index=0;state.choice=null;state.done=false;state.score=0;showQuiz();renderChapters();renderQuestion()})}
$("quizTab").onclick=showQuiz;$("wrongTab").onclick=showWrong;$("clear").onclick=()=>{if(confirm('确定清除本机练习记录吗？')){saved={answered:0,correct:0,wrong:[],history:[]};persist();start()}};start();updateStats();
</script>
</body>
</html>
