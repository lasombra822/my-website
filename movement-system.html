<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="北医系统解剖学第一篇运动系统完整题库：A1、A2、问答题和病例分析，含答案与解析"><title>运动系统完整题库 · 北医系统解剖学</title><style>*{box-sizing:border-box}body{margin:0;background:#f4f7fb;color:#152238;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Helvetica Neue",Arial,sans-serif;line-height:1.6}.wrap{max-width:1180px;margin:auto;padding:0 20px}.top{position:sticky;top:0;z-index:3;background:rgba(255,255,255,.9);backdrop-filter:blur(18px);border-bottom:1px solid #dce5ef}.top .wrap{height:68px;display:flex;align-items:center;justify-content:space-between}.brand{font-weight:800}.brand small{display:block;color:#64748b;font-size:11px;font-weight:500}.back{color:#2563eb;text-decoration:none;font-size:14px}.hero{padding:46px 0 24px}.eyebrow{color:#2563eb;font-size:12px;font-weight:800;letter-spacing:.12em;text-transform:uppercase}.hero h1{font-size:clamp(34px,5vw,64px);letter-spacing:-.06em;line-height:1.08;margin:12px 0}.hero p{max-width:820px;color:#64748b;margin:0}.notice{margin-top:14px;padding:12px 15px;background:#fff8e8;border:1px solid #f0d897;border-radius:14px;color:#7b5b00;font-size:13px}.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin:18px 0}.select,.search,.filter{border:1px solid #d7e1eb;background:#fff;border-radius:12px;padding:10px 12px;font:inherit;color:#203047}.search{min-width:240px;flex:1}.filter{cursor:pointer}.filter.active{background:#17263d;color:#fff;border-color:#17263d}.count{margin-left:auto;color:#64748b;font-size:13px;align-self:center}.grid{display:grid;gap:14px;padding-bottom:70px}.item{background:#fff;border:1px solid #dce5ef;border-radius:18px;padding:20px;box-shadow:0 10px 30px rgba(36,61,90,.06)}.meta{display:flex;gap:8px;align-items:center;flex-wrap:wrap;color:#64748b;font-size:12px}.pill{background:#eaf1ff;color:#1d4ed8;border-radius:999px;padding:4px 9px;font-weight:800}.pill.written{background:#eaf8f2;color:#087f5b}.pill.case{background:#fff0f0;color:#bd3b3b}.item h2{font-size:18px;line-height:1.45;margin:10px 0 13px}.options{display:grid;gap:8px}.opt{border:1px solid #d7e1eb;background:#fff;border-radius:12px;padding:10px 12px;text-align:left;cursor:pointer;display:flex;gap:10px;font:inherit;color:#1f2f45}.opt:hover{border-color:#86aef9;background:#f7faff}.opt .letter{font-weight:800;color:#64748b;width:22px}.opt.correct{border-color:#51b991;background:#eaf8f2}.opt.wrong{border-color:#df8d8d;background:#fff0f0}.feedback{margin-top:13px;padding:13px 14px;border-radius:13px;background:#f3f7fb;display:none;font-size:14px}.feedback.show{display:block}.feedback strong{display:block;margin-bottom:5px}.answer{margin-top:12px;border-top:1px solid #e7edf3;padding-top:12px}.answer summary{cursor:pointer;font-weight:800;color:#1d4ed8}.answer p{margin:10px 0 0;color:#334155;font-size:14px}.source{color:#94a3b8;font-size:12px;margin-top:9px}.empty{padding:48px;text-align:center;color:#64748b;background:#fff;border:1px dashed #cbd5e1;border-radius:18px}.footer{border-top:1px solid #dce5ef;padding:22px 0 40px;color:#64748b;font-size:12px}@media(max-width:650px){.count{width:100%;margin-left:0}.hero{padding-top:30px}.item{padding:16px}.search{min-width:0;width:100%}}</style></head><body><header class="top"><div class="wrap"><div class="brand">北医系统解剖学 · 运动系统<small>完整题库与解析</small></div><a class="back" href="./anatomy.html">返回解剖学复习站</a></div></header><main class="wrap"><section class="hero"><div class="eyebrow">Movement system · source-grounded</div><h1>第一篇运动系统</h1><p>已整理骨学、关节学、肌学的 A1、A2 型单选题、问答题和病例分析题。单选题点击选项查看即时解析；问答与病例题展开后查看答案和解析。</p><div class="notice">题目、参考答案和解析依据用户提供的《人体解剖学应试指南（OCR）》第一篇“运动系统”整理。个别 OCR 或原书答案存在歧义时，页面保留原书参考答案并在解析中提示，复习时请以任课教师和指定教材为准。</div></section><section class="toolbar"><input id="search" class="search" placeholder="搜索题干、答案或知识点"><select id="chapter" class="select"></select><button class="filter active" data-type="全部">全部</button><button class="filter" data-type="A1">A1</button><button class="filter" data-type="A2">A2</button><button class="filter" data-type="问答">问答</button><button class="filter" data-type="病例分析">病例分析</button><span id="count" class="count"></span></section><section id="grid" class="grid"></section></main><footer class="wrap footer">题库来源：人体解剖学应试指南（第3版）· 第一篇运动系统 · 个人复习工具</footer><script>const DATA=[{"id": "骨学-A1-1", "chapter": "骨学", "type": "A1", "number": 1, "stem": "相邻椎骨的椎上切迹和椎下切迹共同围成的结构是", "options": ["椎孔", "横突", "钩突", "椎间孔", "椎间盘"], "answer": 3, "explanation": "相邻椎骨的切迹在椎弓根上下方相对，围成椎间孔，脊神经和血管由此通过。", "keyPoint": "椎间孔"}, {"id": "骨学-A1-2", "chapter": "骨学", "type": "A1", "number": 2, "stem": "属于运动中能够改变肌肉牵拉方向的籽骨是", "options": ["股骨", "髌骨", "肋骨", "骶骨", "腕骨"], "answer": 1, "explanation": "髌骨位于股四头肌腱内，能改变肌腱牵拉方向并保护膝关节前方。", "keyPoint": "籽骨"}, {"id": "骨学-A1-3", "chapter": "骨学", "type": "A1", "number": 3, "stem": "通过横突孔的结构是", "options": ["椎动脉", "颈内动脉", "颈外动脉", "基底动脉", "锁骨下动脉"], "answer": 0, "explanation": "颈椎横突孔内主要有椎动脉、椎静脉及交感神经丛通过。", "keyPoint": "颈椎"}, {"id": "骨学-A1-4", "chapter": "骨学", "type": "A1", "number": 4, "stem": "胸骨角平对", "options": ["第1肋", "第2肋", "第3肋", "第4肋", "第5肋"], "answer": 1, "explanation": "胸骨柄与胸骨体连接处为胸骨角，两侧与第2肋软骨相连，是计数肋骨的标志。", "keyPoint": "胸骨"}, {"id": "骨学-A1-5", "chapter": "骨学", "type": "A1", "number": 5, "stem": "颈静脉切迹位于", "options": ["胸骨", "颅后窝", "锁骨", "颈椎", "第1肋"], "answer": 0, "explanation": "颈静脉切迹位于胸骨柄上缘的中部。", "keyPoint": "胸骨柄"}, {"id": "骨学-A1-6", "chapter": "骨学", "type": "A1", "number": 6, "stem": "肋软骨前端参与形成肋弓的是", "options": ["第6～10对", "第7～10对", "第8～10对", "第9～12对", "第7～12对"], "answer": 2, "explanation": "第8～10对肋软骨依次与上位肋软骨相连，形成肋弓。", "keyPoint": "肋弓"}, {"id": "骨学-A1-7", "chapter": "骨学", "type": "A1", "number": 7, "stem": "开口于蝶筛隐窝的是", "options": ["蝶窦", "筛窦", "额窦", "蝶腭孔", "上颌窦"], "answer": 0, "explanation": "蝶窦开口于蝶筛隐窝；额窦、上颌窦和前、中筛窦多开口于中鼻道。", "keyPoint": "鼻旁窦"}, {"id": "骨学-A1-8", "chapter": "骨学", "type": "A1", "number": 8, "stem": "与脑膜中动脉沟相连续的结构是", "options": ["圆孔", "棘孔", "卵圆孔", "茎乳孔", "破裂孔"], "answer": 1, "explanation": "脑膜中动脉经棘孔进入颅中窝，并在颅骨内面形成相应的动脉沟。", "keyPoint": "颅底孔"}, {"id": "骨学-A1-9", "chapter": "骨学", "type": "A1", "number": 9, "stem": "锁骨骨折多发生在", "options": ["中、内1/3交界处", "中、外1/3交界处", "内侧1/3", "外侧1/3", "肩峰端"], "answer": 1, "explanation": "锁骨中、外1/3交界处较薄弱，是骨折常见部位。", "keyPoint": "锁骨"}, {"id": "骨学-A1-10", "chapter": "骨学", "type": "A1", "number": 10, "stem": "肩胛骨下角平对", "options": ["第6肋", "第7肋", "第8肋", "第9肋", "第10肋"], "answer": 1, "explanation": "肩胛骨下角在上肢下垂时约平第7肋或第7肋间隙。", "keyPoint": "肩胛骨"}, {"id": "骨学-A1-11", "chapter": "骨学", "type": "A1", "number": 11, "stem": "成人骨髓穿刺最常用的部位是", "options": ["胸骨柄", "髂前上棘", "椎弓", "骶正中嵴", "肋骨"], "answer": 1, "explanation": "髂前上棘骨质较薄且松质骨丰富，临床常用于骨髓穿刺。", "keyPoint": "骨髓穿刺"}, {"id": "骨学-A1-12", "chapter": "骨学", "type": "A1", "number": 12, "stem": "正行于肱骨后方中部的神经是", "options": ["腋神经", "正中神经", "桡神经", "尺神经", "肌皮神经"], "answer": 2, "explanation": "桡神经沿肱骨桡神经沟行于肱骨体后方中部，骨折时易受损。", "keyPoint": "肱骨"}, {"id": "骨学-A1-13", "chapter": "骨学", "type": "A1", "number": 13, "stem": "股骨颈与股骨体长轴之间向内的夹角（颈干角）约为", "options": ["95～105°", "105～115°", "115～125°", "125～130°", "130～135°"], "answer": 3, "explanation": "成人股骨颈干角约125°～130°，使下肢承重和髋关节活动更有效。", "keyPoint": "股骨"}, {"id": "骨学-A1-14", "chapter": "骨学", "type": "A1", "number": 14, "stem": "女性肱骨轴与前臂轴延长线相交形成的携角约为", "options": ["0～5°", "5～10°", "10～15°", "15～20°", "20～25°"], "answer": 2, "explanation": "携角是肱骨与前臂轴线形成的外翻角，女性通常约10°～15°。", "keyPoint": "肘部"}, {"id": "骨学-A2-1", "chapter": "骨学", "type": "A2", "number": 1, "stem": "男性，28岁，因头部外伤出血，医生用手指压迫颈动脉结节止血。相关结构是", "options": ["棘突", "齿突", "椎体钩", "上关节突", "颈动脉结节"], "answer": 4, "explanation": "颈动脉结节是第6颈椎横突前结节，颈总动脉可在此处被压向椎体止血。", "keyPoint": "颈动脉结节"}, {"id": "骨学-A2-2", "chapter": "骨学", "type": "A2", "number": 2, "stem": "女性，45岁，行骶管麻醉，常作为操作标志的结构是", "options": ["骶岬", "骶正中嵴", "骶管裂孔", "骶角", "骶后孔"], "answer": 3, "explanation": "骶角位于骶管裂孔两侧，可在体表触及，用于定位骶管裂孔。", "keyPoint": "骶管麻醉"}, {"id": "骨学-A2-3", "chapter": "骨学", "type": "A2", "number": 3, "stem": "女性，13岁，头前部外伤后脑脊液鼻漏、嗅觉减退，最可能损伤的结构是", "options": ["额鳞", "筛板", "颞鳞", "蝶鞍", "鼻骨"], "answer": 1, "explanation": "筛板有嗅丝通过，骨折可使嗅觉受损并形成脑脊液鼻漏。", "keyPoint": "筛骨"}, {"id": "骨学-A2-4", "chapter": "骨学", "type": "A2", "number": 4, "stem": "男性，24岁，头部撞击后出现Battle征，最可能损伤的结构是", "options": ["额骨", "蝶骨大翼", "颞骨岩部", "鞍结节", "枕外隆凸"], "answer": 2, "explanation": "Battle征提示颅底骨折，颞骨岩部骨折可造成乳突区皮下淤血。", "keyPoint": "颅底骨折"}, {"id": "骨学-A2-5", "chapter": "骨学", "type": "A2", "number": 5, "stem": "女性因面部疼痛行卵圆孔穿刺麻醉，术后面部歪斜并出现下部感觉障碍，最可能损伤", "options": ["上颌神经", "下颌神经", "脑膜中动脉", "眼动脉", "颈内动脉"], "answer": 1, "explanation": "卵圆孔是下颌神经出颅的通道，损伤可导致咀嚼运动及面下部感觉异常。", "keyPoint": "卵圆孔"}, {"id": "骨学-A2-6", "chapter": "骨学", "type": "A2", "number": 6, "stem": "男性，15岁，头侧部被击伤，CT提示硬膜外血肿，最可能受伤的血管是", "options": ["浅颞动脉", "板障脉", "面深动脉", "脑膜中动脉", "大脑中动脉"], "answer": 3, "explanation": "翼点内面有脑膜中动脉前支经过，骨折可撕裂该血管形成硬膜外血肿。", "keyPoint": "翼点"}, {"id": "骨学-A2-7", "chapter": "骨学", "type": "A2", "number": 7, "stem": "男性，30岁，头侧部撞击后脑脊液耳漏、听力下降，最可能损伤", "options": ["额骨眶部", "蝶骨大翼", "颞骨岩部", "顶骨结节", "枕外隆凸"], "answer": 2, "explanation": "颞骨岩部含内耳及内耳道，骨折可累及面神经、前庭蜗神经和听觉结构。", "keyPoint": "颞骨岩部"}, {"id": "骨学-A2-8", "chapter": "骨学", "type": "A2", "number": 8, "stem": "男性，5岁，行下颌孔阻滞麻醉治疗下颌乳磨牙，阻滞的神经是", "options": ["面神经", "舌神经", "舌下神经", "上牙槽神经", "下牙槽神经"], "answer": 4, "explanation": "下牙槽神经经下颌孔进入下颌管，是下颌牙齿麻醉的主要靶神经。", "keyPoint": "下颌管"}, {"id": "骨学-A2-9", "chapter": "骨学", "type": "A2", "number": 9, "stem": "男性，22岁，腰穿抽取脑脊液，双侧髂嵴最高点连线约平对", "options": ["第2腰椎棘突", "第3腰椎棘突", "第4腰椎棘突", "第5腰椎棘突", "骶骨"], "answer": 2, "explanation": "髂嵴最高点连线通常平第4腰椎棘突，可作为腰穿定位标志。", "keyPoint": "腰穿定位"}, {"id": "骨学-A2-10", "chapter": "骨学", "type": "A2", "number": 10, "stem": "女性，67岁，骨质疏松后股骨颈骨折，供应股骨颈的动脉主要是", "options": ["闭孔动脉", "滋养动脉", "干骺端动脉", "旋股内侧动脉", "旋股外侧动脉"], "answer": 3, "explanation": "成人股骨头和股骨颈血供主要来自旋股内、外侧动脉的分支，其中旋股内侧动脉更重要。", "keyPoint": "股骨颈血供"}, {"id": "关节学-A1-1", "chapter": "关节学", "type": "A1", "number": 1, "stem": "属于相邻两椎骨间的连结方式是", "options": ["透明软骨结合", "韧带连结", "骨性结合", "纤维连结", "纤维软骨结合"], "answer": 4, "explanation": "相邻椎体之间以椎间盘相连，椎间盘属于纤维软骨结合。", "keyPoint": "椎间盘"}, {"id": "关节学-A1-2", "chapter": "关节学", "type": "A1", "number": 2, "stem": "椎间盘最厚的位置是", "options": ["颈部", "胸部", "腰部", "骶部", "尾部"], "answer": 2, "explanation": "腰椎承受躯干重量最大，椎间盘通常在腰部最厚。", "keyPoint": "椎间盘"}, {"id": "关节学-A1-3", "chapter": "关节学", "type": "A1", "number": 3, "stem": "属于椎弓间的连结是", "options": ["股骨头韧带", "黄韧带", "膝交叉韧带", "棘间韧带", "覆膜"], "answer": 3, "explanation": "相邻椎弓板之间以黄韧带相连，棘间韧带和棘上韧带也属于椎弓间韧带。", "keyPoint": "椎弓间韧带"}, {"id": "关节学-A1-4", "chapter": "关节学", "type": "A1", "number": 4, "stem": "脊柱中旋转运动度最大的部分是", "options": ["颈椎", "胸椎", "腰椎", "骶骨", "尾骨"], "answer": 0, "explanation": "胸椎旋转受肋骨限制，腰椎关节面偏矢状；颈椎旋转范围相对最大。", "keyPoint": "脊柱运动"}, {"id": "关节学-A1-5", "chapter": "关节学", "type": "A1", "number": 5, "stem": "脊柱中屈伸运动度最大的部分是", "options": ["颈椎", "胸椎", "腰椎", "骶骨", "尾骨"], "answer": 2, "explanation": "腰椎关节面适于屈伸，腰段屈伸运动范围较大。", "keyPoint": "脊柱运动"}, {"id": "关节学-A1-6", "chapter": "关节学", "type": "A1", "number": 6, "stem": "位于椎管前壁的韧带是", "options": ["前纵韧带", "后纵韧带", "项韧带", "黄韧带", "棘上韧带"], "answer": 1, "explanation": "后纵韧带贴附椎体和椎间盘后面，构成椎管前壁的一部分。", "keyPoint": "椎管"}, {"id": "关节学-A1-7", "chapter": "关节学", "type": "A1", "number": 7, "stem": "脊柱后伸时最紧张的韧带是", "options": ["前纵韧带", "后纵韧带", "棘间韧带", "棘上韧带", "项韧带"], "answer": 0, "explanation": "脊柱后伸会牵张位于椎体前面的前纵韧带。", "keyPoint": "脊柱运动"}, {"id": "关节学-A1-8", "chapter": "关节学", "type": "A1", "number": 8, "stem": "具有纤维软骨关节盘的关节是", "options": ["寰枕关节", "颞下颌关节", "肩关节", "桡尺近侧关节", "髋关节"], "answer": 1, "explanation": "颞下颌关节内有纤维软骨关节盘，将关节腔分为上下两部。", "keyPoint": "颞下颌关节"}, {"id": "关节学-A1-9", "chapter": "关节学", "type": "A1", "number": 9, "stem": "具有囊内韧带的关节是", "options": ["寰枢关节", "颞下颌关节", "肘关节", "髋关节", "桡腕关节"], "answer": 3, "explanation": "髋关节内有股骨头韧带；膝关节也有前、后交叉韧带。", "keyPoint": "髋关节"}, {"id": "关节学-A1-10", "chapter": "关节学", "type": "A1", "number": 10, "stem": "形成肋弓结构的肋软骨是", "options": ["第2～7对", "第7～8对", "第8～10对", "第8～12对", "每对肋骨前端"], "answer": 2, "explanation": "第8～10对肋软骨依次连接形成肋弓。", "keyPoint": "肋弓"}, {"id": "关节学-A1-11", , "stem": "腱纤维未编入肩关节囊的肌是", "options": ["冈上肌", "冈下肌", "大圆肌", "小圆肌", "肩胛下肌"], "answer": 2, "explanation": "大圆肌不属于肩袖，腱纤维不编入肩关节囊；冈上、冈下、小圆和肩胛下肌构成肩袖。", "keyPoint": "肩袖"}, {"id": "肌学-A1-13", "chapter": "肌学", "type": "A1", "number": 13, "stem": "能够屈肘关节的肌是", "options": ["三角肌", "背阔肌", "肱三头肌", "肱肌", "喙肱肌"], "answer": 3, "explanation": "肱肌是强有力的屈肘肌，作用不受前臂旋前旋后影响。", "keyPoint": "屈肘肌"}, {"id": "肌学-A1-14", "chapter": "肌学", "type": "A1", "number": 14, "stem": "肱三头肌的长头起自", "options": ["肩胛骨盂上结节", "肩胛骨盂下结节", "桡神经沟下方骨面", "桡神经沟上方骨面", "肩胛骨喙突"], "answer": 1, "explanation": "肱三头肌长头起于肩胛骨盂下结节，跨越肩关节和肘关节。", "keyPoint": "肱三头肌"}, {"id": "肌学-A1-15", "chapter": "肌学", "type": "A1", "number": 15, "stem": "肱桡肌止于", "options": ["腕豆骨", "掌腱膜", "桡骨茎突", "第2掌骨底", "桡骨远端掌面"], "answer": 2, "explanation": "肱桡肌止于桡骨茎突附近，主要屈肘并帮助前臂回到中立位。", "keyPoint": "前臂肌"}, {"id": "肌学-A1-16", "chapter": "肌学", "type": "A1", "number": 16, "stem": "旋前圆肌的作用是", "options": ["紧张掌腱膜", "屈腕", "屈肘", "腕关节内收", "前臂旋前"], "answer": 2, "explanation": "按本书参考答案，旋前圆肌可辅助屈肘；其主要作用还包括前臂旋前。", "keyPoint": "前臂肌"}, {"id": "肌学-A1-17", "chapter": "肌学", "type": "A1", "number": 17, "stem": "指深屈肌的起点位于", "options": ["桡骨及骨间膜前面", "尺骨及骨间膜前面", "肱骨外上髁", "肱骨内上髁", "尺骨远端前面"], "answer": 1, "explanation": "指深屈肌起于尺骨前面上部和骨间膜，肌腱止于远节指骨底。", "keyPoint": "前臂肌"}, {"id": "肌学-A1-18", "chapter": "肌学", "type": "A1", "number": 18, "stem": "肌腱止于第2～5指中节指骨底的肌肉是", "options": ["指深屈肌", "指浅屈肌", "肱桡肌", "掌长肌", "尺侧腕屈肌"], "answer": 1, "explanation": "指浅屈肌肌腱在中节指骨底分叉，指深屈肌腱继续至远节指骨。", "keyPoint": "手指屈肌"}, {"id": "肌学-A1-19", "chapter": "肌学", "type": "A1", "number": 19, "stem": "指深屈肌的肌腱止于", "options": ["掌腱膜", "豌豆骨", "第2掌骨底", "中节指骨底", "远节指骨体两侧"], "answer": 4, "explanation": "指深屈肌腱穿过指浅屈肌腱分叉，止于远节指骨底。", "keyPoint": "手指屈肌"}, {"id": "肌学-A1-20", "chapter": "肌学", "type": "A1", "number": 20, "stem": "拇长屈肌的起点位于", "options": ["肱骨外上髁", "尺骨及骨间膜前面", "桡骨及骨间膜前面", "肱骨内上髁", "尺骨远端前面"], "answer": 2, "explanation": "拇长屈肌起于桡骨前面中部和骨间膜，止于拇指远节指骨底。", "keyPoint": "拇长屈肌"}, {"id": "肌学-A1-21", "chapter": "肌学", "type": "A1", "number": 21, "stem": "屈手指近侧指骨间关节的是", "options": ["指浅屈肌", "指深屈肌", "蚓状肌", "指深屈肌和指浅屈肌", "骨间肌"], "answer": 0, "explanation": "指浅屈肌止于中节指骨底，主要屈曲近侧指骨间关节。", "keyPoint": "手指屈曲"}, {"id": "肌学-A1-22", "chapter": "肌学", "type": "A1", "number": 22, "stem": "构成三边孔上界的骨骼肌是", "options": ["小圆肌和冈上肌", "小圆肌和肩胛下肌", "大圆肌和肱三头肌长头", "小圆肌和肱三头肌长头", "大圆肌和背阔肌"], "answer": 1, "explanation": "按本书题解，三边孔上界由小圆肌和肩胛下肌相关肌缘构成；实际辨认还需结合三边孔的四壁。", "keyPoint": "三边孔"}, {"id": "肌学-A1-23", "chapter": "肌学", "type": "A1", "number": 23, "stem": "既可屈髋关节又可屈膝关节的肌是", "options": ["缝匠肌", "股二头肌", "股直肌", "髂腰肌", "半腱肌"], "answer": 0, "explanation": "缝匠肌跨髋、膝两关节，可屈髋并屈膝，同时使大腿外展、外旋。", "keyPoint": "缝匠肌"}, {"id": "肌学-A1-24", "chapter": "肌学", "type": "A1", "number": 24, "stem": "不能屈髋关节的肌是", "options": ["髂腰肌和阔筋膜张肌", "髂腰肌和股直肌", "髂腰肌和耻骨肌", "股直肌和股薄肌", "股二头肌和股外侧肌"], "answer": 4, "explanation": "股二头肌和股外侧肌不是髋关节屈肌；髂腰肌、股直肌和耻骨肌均可屈髋。", "keyPoint": "髋关节肌"}, {"id": "肌学-A1-25", "chapter": "肌学", "type": "A1", "number": 25, "stem": "伸髋关节并可使其旋外的肌是", "options": ["臀大肌", "臀中肌和臀小肌", "股二头肌", "半腱肌和半膜肌", "梨状肌"], "answer": 0, "explanation": "臀大肌是强力伸髋肌，并可使髋关节旋外。", "keyPoint": "臀大肌"}, {"id": "肌学-A1-26", "chapter": "肌学", "type": "A1", "number": 26, "stem": "可伸髋关节、屈膝关节的肌是", "options": ["股薄肌", "缝匠肌", "股四头肌", "股二头肌", "髂腰肌"], "answer": 3, "explanation": "股二头肌跨髋和膝关节，可伸髋并屈膝。", "keyPoint": "大腿后群"}, {"id": "肌学-A1-27", "chapter": "肌学", "type": "A1", "number": 27, "stem": "可使髋关节旋内的肌是", "options": ["长收肌", "梨状肌", "臀中肌", "臀大肌", "大收肌"], "answer": 2, "explanation": "臀中肌前部肌束可使髋关节旋内并参与外展。", "keyPoint": "臀中肌"}, {"id": "肌学-A1-28", "chapter": "肌学", "type": "A1", "number": 28, "stem": "可使髋关节旋外的肌是", "options": ["股二头肌", "臀小肌", "阔筋膜张肌", "半膜肌", "半腱肌"], "answer": 1, "explanation": "按本书参考答案，臀小肌列入该题选项；临床判断应结合肌束部位和具体运动。", "keyPoint": "髋关节肌"}, {"id": "肌学-A1-29", "chapter": "肌学", "type": "A1", "number": 29, "stem": "止于股骨大转子的肌是", "options": ["臀大肌", "臀中肌", "股方肌", "闭孔内肌", "闭孔外肌"], "answer": 1, "explanation": "臀中肌止于股骨大转子外侧面，是髋关节外展和稳定骨盆的重要肌肉。", "keyPoint": "臀中肌"}, {"id": "肌学-A1-30", "chapter": "肌学", "type": "A1", "number": 30, "stem": "参与屈膝关节的肌是", "options": ["股四头肌", "比目鱼肌", "胫骨后肌", "腓肠肌", "大收肌"], "answer": 3, "explanation": "腓肠肌跨过膝关节后方，可辅助屈膝；其主要作用是跖屈踝关节。", "keyPoint": "腓肠肌"}, {"id": "肌学-A1-31", "chapter": "肌学", "type": "A1", "number": 31, "stem": "构成股三角内侧界的骨骼肌是", "options": ["腹股沟韧带", "长收肌外侧缘", "长收肌内侧缘", "缝匠肌外侧缘", "缝匠肌内侧缘"], "answer": 2, "explanation": "股三角上界为腹股沟韧带，外侧界为缝匠肌内侧缘，内侧界为长收肌内侧缘。", "keyPoint": "股三角"}, {"id": "肌学-A1-32", "chapter": "肌学", "type": "A1", "number": 32, "stem": "收肌管内通过的结构有", "options": ["大隐静脉", "股血管", "小隐静脉", "股深动脉", "闭孔神经"], "answer": 1, "explanation": "收肌管内有股动脉、股静脉和隐神经等，股血管由此通向腘窝。", "keyPoint": "收肌管"}, {"id": "肌学-A2-1", "chapter": "肌学", "type": "A2", "number": 1, "stem": "男性，32岁，颈部外伤出现“翼肩”，最可能瘫痪的骨骼肌是", "options": ["背阔肌", "肩胛提肌", "菱形肌", "斜方肌", "肩胛下肌"], "answer": 3, "explanation": "斜方肌受副神经支配，损伤可使肩胛骨内侧缘和下角突出，出现翼肩。", "keyPoint": "斜方肌"}, {"id": "肌学-A2-2", "chapter": "肌学", "type": "A2", "number": 2, "stem": "男性，42岁，因车祸需行肌瓣修复大面积缺损区，最常选取的骨骼肌是", "options": ["背阔肌", "肩胛提肌", "菱形肌", "斜方肌", "臀大肌"], "answer": 0, "explanation": "背阔肌面积大、血供和血管蒂明确，常用于肌皮瓣移植。", "keyPoint": "背阔肌"}, {"id": "肌学-A2-3", "chapter": "肌学", "type": "A2", "number": 3, "stem": "女性，45岁，乳腺癌术后出现肩胛骨内侧缘和下角突出形成翼状肩，可能瘫痪的肌肉是", "options": ["背阔肌", "肩胛提肌", "前锯肌", "斜方肌", "肩胛下肌"], "answer": 2, "explanation": "前锯肌瘫痪时肩胛骨失去胸壁贴附，长胸神经损伤是常见原因。", "keyPoint": "前锯肌"}, {"id": "肌学-A2-4", "chapter": "肌学", "type": "A2", "number": 4, "stem": "女性，26岁，肱骨上部骨折出现“方肩”，可能发生萎缩的肌肉是", "options": ["冈上肌", "三角肌", "冈下肌", "小圆肌", "大圆肌"], "answer": 1, "explanation": "腋神经损伤或三角肌萎缩可使肩部圆隆消失，形成方肩。", "keyPoint": "三角肌"}, {"id": "肌学-A2-5", "chapter": "肌学", "type": "A2", "number": 5, "stem": "女性，50岁，肩关节不能上举、梳头困难，与症状最相关的骨骼肌是", "options": ["三角肌和冈上肌", "三角肌和冈下肌", "冈下肌和胸大肌", "冈上肌和大圆肌", "大圆肌和肩胛下肌"], "answer": 0, "explanation": "肩关节外展起始依赖冈上肌，继续外展主要依赖三角肌。", "keyPoint": "肩关节外展"}, {"id": "肌学-A2-6", "chapter": "肌学", "type": "A2", "number": 6, "stem": "女性，3岁，计划免疫行肌内注射，最常选用的注射部位是", "options": ["胸大肌", "背阔肌", "臀大肌", "三角肌", "股四头肌"], "answer": 3, "explanation": "儿童常选三角肌进行肌内注射，避开大血管和神经。", "keyPoint": "肌内注射"}, {"id": "肌学-A2-7", "chapter": "肌学", "type": "A2", "number": 7, "stem": "男性，43岁，狗咬伤后行狂犬病疫苗注射，最常用的骨骼肌是", "options": ["肩胛下肌下部", "肱二头肌长头", "三角肌下部", "股四头肌", "大腿内收肌群"], "answer": 2, "explanation": "成人疫苗常在三角肌中部进行肌内注射。", "keyPoint": "三角肌"}, {"id": "肌学-A2-8", "chapter": "肌学", "type": "A2", "number": 8, "stem": "女性，25岁，腕管综合征，不在腕管内穿行的结构是", "options": ["正中神经", "掌长肌腱", "指浅屈肌腱", "指深屈肌腱", "拇长屈肌腱"], "answer": 1, "explanation": "掌长肌腱位于腕管浅面，不通过腕管；腕管内有正中神经及屈肌腱。", "keyPoint": "腕管"}, {"id": "肌学-A2-9", "chapter": "肌学", "type": "A2", "number": 9, "stem": "男性，35岁，肱骨外上髁骨折并桡神经深支损伤，可能瘫痪的肌是", "options": ["肱肌", "肱桡肌", "肱三头肌", "桡侧腕长伸肌", "桡侧腕短伸肌"], "answer": 4, "explanation": "桡神经深支（骨间后神经）支配前臂伸肌群，桡侧腕短伸肌可受累。", "keyPoint": "桡神经"}, {"id": "肌学-A2-10", "chapter": "肌学", "type": "A2", "number": 10, "stem": "男性，23岁，左手腕内侧刀伤后手指不能相互靠拢，可能瘫痪的骨骼肌是", "options": ["指伸肌", "掌长肌", "拇收肌", "蚓状肌", "骨间肌"], "answer": 4, "explanation": "手指相互靠拢主要依赖掌侧骨间肌，尺神经损伤可导致其瘫痪。", "keyPoint": "手内在肌"}, {"id": "肌学-A2-11", "chapter": "肌学", "type": "A2", "number": 11, "stem": "男性，8岁，行肌内注射，最常选用的注射部位是", "options": ["斜方肌", "背阔肌", "臀大肌", "肱三头肌", "胸大肌"], "answer": 2, "explanation": "臀大肌肌肉厚大，是常用肌内注射部位，但应避开坐骨神经。", "keyPoint": "肌内注射"}, {"id": "肌学-A2-12", "chapter": "肌学", "type": "A2", "number": 12, "stem": "男性，18岁，叩击髌韧带观察深反射，形成髌韧带的肌是", "options": ["股四头肌", "比目鱼肌", "胫骨后肌", "腓肠肌", "大收肌"], "answer": 0, "explanation": "髌韧带是股四头肌腱包绕髌骨后的延续，膝反射反映股神经通路。", "keyPoint": "股四头肌"}, {"id": "肌学-A2-13", "chapter": "肌学", "type": "A2", "number": 13, "stem": "女性，55岁，盆腔手术造成闭孔神经损伤，不会出现瘫痪的骨骼肌是", "options": ["股薄肌", "缝匠肌", "耻骨肌", "长收肌", "大收肌"], "answer": 1, "explanation": "缝匠肌由股神经支配，不属于闭孔神经支配的大腿内收肌群。", "keyPoint": "闭孔神经"}, {"id": "肌学-A2-14", "chapter": "肌学", "type": "A2", "number": 14, "stem": "男性，72岁，坐骨部外伤需转移肌瓣修补缺损，最常选取的骨骼肌是", "options": ["髂腰肌", "股薄肌", "缝匠肌", "半腱肌", "半膜肌"], "answer": 3, "explanation": "半腱肌位于大腿后群，血供和肌腹长度适合肌瓣转移。", "keyPoint": "大腿后群"}, {"id": "肌学-A2-15", "chapter": "肌学", "type": "A2", "number": 15, "stem": "男性，45岁，踝管狭窄，不在踝管内穿行的结构是", "options": ["跟腱", "胫神经", "胫后动脉", "胫骨后肌腱", "拇长屈肌腱"], "answer": 0, "explanation": "跟腱位于踝关节后方但不通过内踝后方的踝管；踝管内有屈肌腱、胫后血管和胫神经。", "keyPoint": "踝管"}, {"id": "肌学-A2-16", "chapter": "肌学", "type": "A2", "number": 16, "stem": "男性，25岁，跳跃后不能屈踝关节，最可能损伤的结构是", "options": ["比目鱼肌", "腘肌", "跟腱", "半腱肌", "耻骨肌"], "answer": 2, "explanation": "跟腱连接小腿三头肌与跟骨，断裂会显著影响踝关节跖屈。", "keyPoint": "跟腱"}, {"id": "肌学-A2-17", "chapter": "肌学", "type": "A2", "number": 17, "stem": "女性，13岁，小腿骨折后足内翻障碍，可能瘫痪的肌是", "options": ["腓肠肌", "胫骨前肌", "腓骨长肌", "腓骨短肌", "比目鱼肌"], "answer": 1, "explanation": "胫骨前肌可使足背屈和内翻，损伤会导致足内翻减弱。", "keyPoint": "小腿前群"}, {"id": "肌学-A2-18", "chapter": "肌学", "type": "A2", "number": 18, "stem": "男性，32岁，腓骨上段骨折后出现足外翻障碍，可能瘫痪的肌是", "options": ["半腱肌和半膜肌", "腓肠肌和比目鱼肌", "趾长屈肌和趾长伸肌", "胫骨前肌和胫骨后肌", "腓骨长肌和腓骨短肌"], "answer": 4, "explanation": "腓骨长、短肌位于小腿外侧群，主要完成足外翻，腓骨上段损伤可累及其神经支配。", "keyPoint": "小腿外侧群"}, {"id": "骨学-问答-1", "chapter": "骨学", "type": "问答", "number": 1, "stem": "简述运动系统的组成及其功能", "answerText": "运动系统由骨、骨连接和骨骼肌组成。骨和骨连接构成支架并承担支持、保护和杠杆作用；骨骼肌在神经支配下收缩，以关节为支点牵拉骨产生运动。", "explanation": "答题抓住“骨—骨连接—骨骼肌”及支持、保护、运动三项功能。"}, {"id": "骨学-问答-2", "chapter": "骨学", "type": "问答", "number": 2, "stem": "简述全身骨的形态学分类及各类骨的特点和分布", "answerText": "骨按形态分为长骨、短骨、扁骨和不规则骨。长骨有骨干和两端，主要位于四肢；短骨近立方形，多见于腕、跗部；扁骨薄而宽，常构成颅盖、胸廓和骨盆壁；不规则骨形态复杂，如椎骨。", "explanation": "分类题要同时写出形态和代表性分布。"}, {"id": "骨学-问答-3", "chapter": "骨学", "type": "问答", "number": 3, "stem": "简述骨的构造及其功能", "answerText": "骨由骨质、骨膜和骨髓组成，并有血管、淋巴管和神经。骨密质坚固，骨松质以骨小梁承重；骨膜参与营养、感觉和修复；红骨髓造血，黄骨髓以脂肪为主。", "explanation": "围绕“骨质—骨膜—骨髓”说明结构和功能。"}, {"id": "骨学-问答-4", "chapter": "骨学", "type": "问答", "number": 4, "stem": "简述vertebrae的一般形态", "answerText": "椎骨由前方椎体和后方椎弓组成，二者围成椎孔。椎弓发出棘突、横突、上关节突和下关节突；椎弓根上下切迹与邻椎形成椎间孔。", "explanation": "写清椎体、椎弓、椎孔、突起和椎间孔。"}, {"id": "骨学-问答-5", "chapter": "骨学", "type": "问答", "number": 5, "stem": "简述颈椎、胸椎、腰椎的主要形态学特点", "answerText": "颈椎有横突孔、椎体小、椎孔大；胸椎体和横突有肋凹、棘突长向后下；腰椎椎体大、棘突宽而板状、关节面偏矢状。", "explanation": "用“椎体、椎孔、突起、附属结构”比较三段椎骨。"}, {"id": "骨学-问答-6", "chapter": "骨学", "type": "问答", "number": 6, "stem": "简述胸骨角的位置及临床意义", "answerText": "胸骨角位于胸骨柄与胸骨体连接处，向前微凸，平对第4胸椎体下缘，两侧与第2肋软骨相连。它是计数肋骨、定位纵隔分界和胸内结构的重要标志。", "explanation": "位置、平面和临床定位意义都要写。"}, {"id": "骨学-问答-7", "chapter": "骨学", "type": "问答", "number": 7, "stem": "简述躯干骨的重要体表标志", "answerText": "常用标志包括第7颈椎棘突、胸骨角、剑突、肋弓、骶骨岬和骶角，以及腰椎棘突。它们用于体表定位、计数肋骨和进行穿刺操作。", "explanation": "举出代表性标志并说明用途即可。"}, {"id": "骨学-问答-8", "chapter": "骨学", "type": "问答", "number": 8, "stem": "简述与颅中窝和颅后窝相关的重要孔、裂和沟", "answerText": "颅中窝主要有视神经管、眶上裂、圆孔、卵圆孔、棘孔、破裂孔和颈动脉沟；颅后窝有枕骨大孔、舌下神经管、内耳门、颈静脉孔和乙状窦沟。", "explanation": "按颅窝分组，并写出一两项通过结构。"}, {"id": "骨学-问答-9", "chapter": "骨学", "type": "问答", "number": 9, "stem": "简述颅底外面可见的重要孔、裂及其位置", "answerText": "颅底外面可见颈动脉管外口、茎乳孔、颈静脉孔、舌下神经管外口、枕骨大孔、乳突和茎突等。应结合颅骨分区说明其相对位置。", "explanation": "重点是外面观，避免与颅底内面孔混写。"}, {"id": "骨学-问答-10", "chapter": "骨学", "type": "问答", "number": 10, "stem": "简述颞下窝的位置、各壁构成及交通", "answerText": "颞下窝位于颧弓下方、上颌骨体和蝶骨翼突后方。其上方通颞窝，前方邻上颌骨，内侧经翼上颌裂通翼腭窝，并经眶下裂通眶。", "explanation": "按位置、边界和交通逐项作答。"}, {"id": "骨学-问答-11", "chapter": "骨学", "type": "问答", "number": 11, "stem": "简述翼腭窝的位置及交通", "answerText": "翼腭窝位于上颌骨体、蝶骨翼突和腭骨之间。向前经眶下裂通眶，向内经蝶腭孔通鼻腔，向后经圆孔通颅中窝，向下经翼腭管通口腔。", "explanation": "写出四个方向的主要交通。"}, {"id": "骨学-问答-12", "chapter": "骨学", "type": "问答", "number": 12, "stem": "简述眶各壁的构成及交通", "answerText": "眶有上、下、内侧和外侧壁。上壁邻颅前窝，内侧壁与筛窦和鼻腔相邻，下壁经眶下裂通翼腭窝，后部有视神经管和眶上、下裂等交通。", "explanation": "按四壁和主要裂孔组织答案。"}, {"id": "骨学-问答-13", "chapter": "骨学", "type": "问答", "number": 13, "stem": "简述眶的交通", "answerText": "视神经管向后内通颅中窝；眶上裂通颅中窝，眶下裂通颞下窝和翼腭窝；鼻泪管向下通下鼻道，眶内侧壁与筛窦、鼻腔相邻。", "explanation": "按通向颅腔、面部和鼻腔的方向整理眶的交通。"}, {"id": "骨学-问答-14", "chapter": "骨学", "type": "问答", "number": 14, "stem": "简述骨性鼻腔外侧壁上的重要结构", "answerText": "外侧壁有上、中、下鼻甲及相应鼻道；中鼻道有额窦、上颌窦和前、中筛窦开口，上鼻道有后筛窦开口，蝶筛隐窝有蝶窦开口，鼻泪管开口于下鼻道。", "explanation": "鼻甲—鼻道—窦口是答题主线。"}, {"id": "骨学-问答-15", "chapter": "骨学", "type": "问答", "number": 15, "stem": "简述paranasal sinuses的位置和开口", "answerText": "额窦、上颌窦和前中筛窦开口于中鼻道；后筛窦开口于上鼻道；蝶窦开口于蝶筛隐窝。各窦位于相应骨内并与鼻腔相通。", "explanation": "按窦名、所在骨和开口位置作答。"}, {"id": "骨学-问答-16", "chapter": "骨学", "type": "问答", "number": 16, "stem": "简述各cranial fontanelles的位置及闭合时间", "answerText": "前囟位于矢状缝与冠状缝交界，呈菱形，约1～2岁闭合；后囟位于矢状缝与人字缝交界，呈三角形，出生后不久闭合；蝶囟和乳突囟也在出生后较早闭合。", "explanation": "写出前、后囟的位置和时间，再补充侧囟。"}, {"id": "骨学-问答-17", "chapter": "骨学", "type": "问答", "number": 17, "stem": "简述能摸到的颅骨重要骨性标志", "answerText": "可触及眉弓、眶上缘、鼻根、颧弓、乳突、茎突、枕外隆凸和下颌角等。它们用于体表定位、神经血管阻滞和骨折判断。", "explanation": "列举标志并写一项临床用途。"}, {"id": "骨学-问答-18", "chapter": "骨学", "type": "问答", "number": 18, "stem": "简述上肢骨的组成及排列位置", "answerText": "上肢骨包括锁骨、肩胛骨、肱骨、桡骨、尺骨和手骨。手骨由8块腕骨、5块掌骨和14块指骨组成，腕骨分近、远两列排列。", "explanation": "按上肢带、自由上肢和手骨分层。"}, {"id": "骨学-问答-19", "chapter": "骨学", "type": "问答", "number": 19, "stem": "简述肱骨下端和尺骨上端的重要结构", "answerText": "肱骨下端有肱骨小头、滑车、内外上髁、冠突窝和鹰嘴窝；尺骨上端有滑车切迹、鹰嘴、冠突和桡切迹，共同参与肘关节构成。", "explanation": "突出关节面、突起和窝。"}, {"id": "骨学-问答-20", "chapter": "骨学", "type": "问答", "number": 20, "stem": "简述能摸到的上肢骨重要体表标志", "answerText": "可触及锁骨全长、肩胛冈、肩峰、喙突、肱骨内外上髁、鹰嘴、尺骨后缘、尺骨头、桡骨茎突和豌豆骨。", "explanation": "可按肩—臂—前臂—手顺序列举。"}, {"id": "骨学-问答-21", "chapter": "骨学", "type": "问答", "number": 21, "stem": "简述下肢骨的组成及排列位置", "answerText": "下肢骨包括髋骨、股骨、髌骨、胫骨、腓骨和足骨。足骨由7块跗骨、5块跖骨和14块趾骨组成，跗骨按近远位置排列。", "explanation": "区分下肢带骨和自由下肢骨。"}, {"id": "骨学-问答-22", "chapter": "骨学", "type": "问答", "number": 22, "stem": "简述股骨下端和胫骨上端的重要结构", "answerText": "股骨下端有内外侧髁、髁间窝、髌面和内外上髁；胫骨上端有内外侧髁、上关节面、髁间隆起和腓关节面。", "explanation": "联系膝关节构成说明。"}, {"id": "骨学-问答-23", "chapter": "骨学", "type": "问答", "number": 23, "stem": "简述能摸到的下肢骨重要体表标志", "answerText": "可触及髂嵴、髂前上棘、髂后上棘、坐骨结节、耻骨结节、大转子、髌骨、胫骨前缘、胫骨粗隆、内外踝和腓骨头。", "explanation": "体表标志可用于定位关节、神经和穿刺点。"}, {"id": "骨学-病例分析-1", "chapter": "骨学", "type": "病例分析", "number": 1, "stem": "男性，18岁，头部被钝器击伤后出现头痛、呕吐、躁动，CT显示硬膜外血肿。请分析原因。", "answerText": "最可能为翼点附近骨折撕裂脑膜中动脉。翼点内面有脑膜中动脉前支经过，血液积聚于颅骨与硬脑膜之间形成硬膜外血肿，并因颅内压升高出现头痛、呕吐和意识行为改变。", "explanation": "病例要把受伤部位、血管走行、血肿位置和症状串成一条证据链。"}, {"id": "骨学-病例分析-2", "chapter": "骨学", "type": "病例分析", "number": 2, "stem": "女性，32岁，车祸造成右侧肱骨外科颈骨折。请说明外科颈位置及可能损伤的结构和表现。", "answerText": "肱骨外科颈位于肱骨上端与骨干交界处，是骨折好发部位。骨折可损伤腋神经及旋肱后动脉，表现为三角肌瘫痪、肩部失去圆隆呈方肩、肩关节外展障碍及三角肌区皮肤感觉减退。", "explanation": "答案要同时写骨折部位、神经血管和运动感觉表现。"}, {"id": "关节学-问答-1", "chapter": "关节学", "type": "问答", "number": 1, "stem": "简述骨连结及其分类", "answerText": "骨与骨之间借纤维结缔组织、软骨或骨相连，称骨连结。按连结方式分直接连结（纤维、软骨、骨性结合）和间接连结，即滑膜关节。", "explanation": "先分类，再写每类的活动度和代表结构。"}, {"id": "关节学-问答-2", "chapter": "关节学", "type": "问答", "number": 2, "stem": "简述滑膜关节的基本结构", "answerText": "基本结构包括关节面、关节囊和关节腔。关节面覆关节软骨；关节囊有外层纤维膜和内层滑膜；关节腔为密闭、含少量滑液的间隙。", "explanation": "三项基本结构不能漏写。"}, {"id": "关节学-问答-3", "chapter": "关节学", "type": "问答", "number": 3, "stem": "简述关节的辅助结构", "answerText": "辅助结构包括韧带、关节盘、关节唇、滑膜襞和滑膜囊。它们分别加强稳定、使关节面适合、扩大接触面、填充腔隙或减少肌腱与骨的摩擦。", "explanation": "按结构—作用配对作答。"}, {"id": "关节学-问答-4", "chapter": "关节学", "type": "问答", "number": 4, "stem": "试述旋转运动和环转运动的区别", "answerText": "旋转是骨绕一个垂直轴转动，可分旋内和旋外；环转是屈、伸、收、展连续组合，骨近端相对固定，远端描绘圆锥形轨迹。", "explanation": "写明运动轴和轨迹差异。"}, {"id": "关节学-问答-5", "chapter": "关节学", "type": "问答", "number": 5, "stem": "试述椎体间连结结构的名称、位置和作用", "answerText": "椎体间有椎间盘、前纵韧带和后纵韧带。椎间盘由纤维环和髓核组成，承重并缓冲；前纵韧带限制过度后伸；后纵韧带限制过度前屈并防止髓核后突。", "explanation": "结构、位置、功能三栏式组织。"}, {"id": "关节学-问答-6", "chapter": "关节学", "type": "问答", "number": 6, "stem": "试述椎弓间的连结", "answerText": "相邻椎弓之间有黄韧带、棘间韧带、棘上韧带和关节突关节等。黄韧带连接椎弓板并参与椎管后壁，韧带共同限制脊柱过度活动。", "explanation": "重点写黄韧带和关节突关节。"}, {"id": "关节学-问答-7", "chapter": "关节学", "type": "问答", "number": 7, "stem": "试述寰枢关节的组成和运动", "answerText": "寰枢关节由两侧寰椎侧块下关节面与枢椎上关节面、以及齿突与寰椎前弓和横韧带构成。以齿突为轴作旋转，是头部左右转动的主要关节。", "explanation": "写三个关节组成和旋转功能。"}, {"id": "关节学-问答-8", "chapter": "关节学", "type": "问答", "number": 8, "stem": "试述脊柱的组成、生理弯曲和运动", "answerText": "脊柱由24块椎骨、骶骨和尾骨组成。颈曲、腰曲凸向前，胸曲、骶曲凸向后；可作屈、伸、侧屈、旋转和环转，生理弯曲有助于承重和缓冲。", "explanation": "组成、弯曲方向、运动和意义均应出现。"}, {"id": "关节学-问答-9", "chapter": "关节学", "type": "问答", "number": 9, "stem": "简述胸廓的围成、形态特点及运动", "answerText": "胸廓由12个胸椎、12对肋和胸骨及其连结围成，呈上窄下宽的圆锥形，有上、下口和前后外侧壁。肋骨和胸骨的运动改变胸腔容积，参与呼吸。", "explanation": "写组成、形态和呼吸运动。"}, {"id": "关节学-问答-10", "chapter": "关节学", "type": "问答", "number": 10, "stem": "试述颞下颌关节的组成、结构特点、运动和临床意义", "answerText": "由下颌头、下颌窝和关节结节构成，表面覆纤维软骨，腔内有纤维软骨关节盘。可作开闭口、前伸后退和侧方运动；囊前壁较薄，易发生前方脱位。", "explanation": "关节盘和脱位方向是得分点。"}, {"id": "关节学-问答-11", "chapter": "关节学", "type": "问答", "number": 11, "stem": "试述胸锁关节的组成、结构特点和运动", "answerText": "由锁骨胸骨端、胸骨柄锁切迹及第1肋软骨上面构成，腔内有关节盘，囊和韧带较强。可作锁骨抬高、下降、前后移和旋转。", "explanation": "说明其是上肢与躯干的唯一直接关节。"}, {"id": "关节学-问答-12", "chapter": "关节学", "type": "问答", "number": 12, "stem": "简述肩关节基本结构的形态特点及运动", "answerText": "肩关节由肱骨头和肩胛骨关节盂构成，球大盂浅，囊松弛，下壁最薄弱。可作屈、伸、收、展、旋内、旋外和环转。", "explanation": "“球大盂浅、囊松、下壁薄”与多轴运动相联系。"}, {"id": "关节学-问答-13", "chapter": "关节学", "type": "问答", "number": 13, "stem": "试述拇指腕掌关节的组成和运动", "answerText": "由大多角骨与第1掌骨底构成鞍状关节，可作屈伸、收展、环转和对掌。对掌使拇指尖与其他手指掌侧相接，是精细操作基础。", "explanation": "对掌是本题核心。"}, {"id": "关节学-问答-14", "chapter": "关节学", "type": "问答", "number": 14, "stem": "试述骨盆的围成及功能意义", "answerText": "骨盆由骶骨、尾骨及两侧髋骨借骶髂关节、耻骨联合和韧带连结而成，分大骨盆和小骨盆。可传递体重、保护盆腔脏器，女性小骨盆还是产道。", "explanation": "围成、分部和功能三点齐全。"}, {"id": "关节学-问答-15", "chapter": "关节学", "type": "问答", "number": 15, "stem": "简述男、女性骨盆的性别差异", "answerText": "男性骨盆狭长厚重、入口心形、下角小、骶骨长而弯；女性骨盆宽短、入口近圆、下角大、骶骨短而平，骨盆腔和下口较宽。", "explanation": "用入口、下角、骶骨和腔体比较。"}, {"id": "关节学-问答-16", "chapter": "关节学", "type": "问答", "number": 16, "stem": "试述膝关节的辅助结构及其功能", "answerText": "膝关节有髌韧带、胫侧和腓侧副韧带、斜韧带、前后交叉韧带、内外侧半月板和滑膜囊。韧带稳定并限制移位，半月板使关节面适合、缓冲压力，滑膜囊减少摩擦。", "explanation": "囊内、囊外韧带和半月板功能都要写。"}, {"id": "关节学-问答-17", "chapter": "关节学", "type": "问答", "number": 17, "stem": "试述踝关节的组成及其周围主要韧带", "answerText": "踝关节由胫、腓骨下端与距骨滑车组成。内侧为坚强三角韧带；外侧为距腓前、跟腓和距腓后韧带，外侧较弱，内翻扭伤常见。", "explanation": "组成、内外侧韧带和损伤方向是重点。"}, {"id": "关节学-病例分析-1", "chapter": "关节学", "type": "病例分析", "number": 1, "stem": "男性，20岁，踢足球扭伤膝盖，内侧压痛，强力过伸或过屈疼痛，挤压试验阳性。最可能损伤什么结构？", "answerText": "最可能为内侧半月板损伤。内侧半月板较大、呈C形，与关节囊和胫侧副韧带紧密相连，活动度小，膝关节扭转或挤压时易撕裂；它可加深关节面并缓冲压力。", "explanation": "把内侧压痛、挤压试验和半月板的形态固定联系。"}, {"id": "关节学-病例分析-2", "chapter": "关节学", "type": "病例分析", "number": 2, "stem": "女性，38岁，下楼踩空后踝痛、肿胀、不能行走，初诊为距小腿关节损伤。请简述组成、特点、运动及相关肌肉和神经。", "answerText": "距小腿关节由胫、腓骨下端与距骨滑车组成，囊前后松、两侧有韧带加强；内侧三角韧带强，外侧三条韧带较弱，常见内翻损伤。背屈由胫骨前肌、趾长伸肌等（腓深神经）完成，跖屈由小腿三头肌、胫骨后肌和屈肌群（胫神经）完成，内翻主要由胫骨前、后肌，外翻由腓骨长短肌（腓浅神经）完成。", "explanation": "病例答案应覆盖关节结构、常见损伤方向、运动肌群和神经支配。"}, {"id": "肌学-问答-1", "chapter": "肌学", "type": "问答", "number": 1, "stem": "试述骨骼肌的形态分类及各类肌的作用特点和分布", "answerText": "骨骼肌按形态分长肌、短肌、扁肌和轮匝肌。长肌收缩幅度大，多在四肢；短肌收缩幅度小，多在躯干深层；扁肌参与构成体壁，多在躯干浅层；轮匝肌环绕孔裂，收缩可关闭孔裂。", "explanation": "分类要同时写作用特点和分布。"}, {"id": "肌学-问答-2", "chapter": "肌学", "type": "问答", "number": 2, "stem": "简述骨骼肌的辅助装置及其作用", "answerText": "辅助装置包括浅筋膜、深筋膜、滑膜囊和腱鞘。筋膜包被、分隔和固定肌群；滑膜囊减少肌腱与骨面摩擦；腱鞘约束肌腱并使其顺畅滑动。", "explanation": "按装置—功能作答。"}, {"id": "肌学-问答-3", "chapter": "肌学", "type": "问答", "number": 3, "stem": "简述主要面肌及其作用", "answerText": "主要有枕额肌、眼轮匝肌、口轮匝肌、颊肌和鼻肌。枕额肌提眉，眼轮匝肌闭眼，口轮匝肌闭口，颊肌压迫面颊并助咀嚼，鼻肌调节鼻孔。", "explanation": "写代表面肌及表情或口裂作用。"}, {"id": "肌学-问答-4", "chapter": "肌学", "type": "问答", "number": 4, "stem": "试述参加咀嚼运动的骨骼肌及其作用", "answerText": "咬肌、颞肌、翼内肌共同上提下颌骨；翼外肌双侧收缩使下颌前移并张口；颊肌压迫面颊，协助食物保持在牙列间。", "explanation": "区分上提、前移和辅助作用。"}, {"id": "肌学-问答-5", "chapter": "肌学", "type": "问答", "number": 5, "stem": "试述胸锁乳突肌的位置、起止和作用", "answerText": "位于颈部两侧，起于胸骨柄前面和锁骨胸骨端，止于颞骨乳突。一侧收缩使头向同侧侧屈并转向对侧，两侧收缩使头后仰。", "explanation": "位置、起止、单侧和双侧作用齐全。"}, {"id": "肌学-问答-6", "chapter": "肌学", "type": "问答", "number": 6, "stem": "简述前、中、后斜角肌的位置及作用", "answerText": "三肌位于颈深部，起自颈椎横突；前、中斜角肌止于第1肋，后斜角肌止于第2肋。共同作用是侧屈颈并提肋助吸气，前中斜角肌与第1肋围成斜角肌间隙。", "explanation": "补充锁骨下动脉和臂丛通过间隙。"}, {"id": "肌学-问答-7", "chapter": "肌学", "type": "问答", "number": 7, "stem": "试述斜方肌的位置、起止和作用", "answerText": "位于颈部和背上部浅层，起于上项线、枕外隆凸、项韧带及颈胸椎棘突，止于锁骨外侧、肩峰和肩胛冈。上部提肩胛，下部降肩胛，中部使肩胛骨靠近脊柱。", "explanation": "按肌束分区写作用。"}, {"id": "肌学-问答-8", "chapter": "肌学", "type": "问答", "number": 8, "stem": "简述竖脊肌的位置及其作用", "answerText": "位于脊柱两侧的肌沟内，是背肌中最长、最强的一组。单侧收缩使脊柱向同侧侧屈，双侧收缩使脊柱后伸并维持直立。", "explanation": "突出单侧与双侧作用差异。"}, {"id": "肌学-问答-9", "chapter": "肌学", "type": "问答", "number": 9, "stem": "简述竖脊肌的筋膜构成和附着", "answerText": "竖脊肌筋膜由胸腰筋膜浅、中层构成。浅层位于肌浅面，内附棘上韧带、外附肋角；中层位于竖脊肌与腰方肌之间，二层外侧会合形成肌间隔。", "explanation": "说明胸腰筋膜包被和分隔作用。"}, {"id": "肌学-问答-10", "chapter": "肌学", "type": "问答", "number": 10, "stem": "试述胸大肌的位置、起止和作用", "answerText": "胸大肌位于胸前壁浅层，起于锁骨内侧半、胸骨和第1～6肋软骨，止于肱骨大结节嵴。可使肩关节内收、旋内、前屈，上肢固定时可助吸气。", "explanation": "记住起点分部和止点。"}, {"id": "肌学-问答-11", "chapter": "肌学", "type": "问答", "number": 11, "stem": "简述参与呼吸的主要骨骼肌及其作用", "answerText": "吸气主要靠膈和肋间外肌；膈收缩下降、肋骨外展使胸腔扩大。呼气时肋间内肌、肋间最内肌、胸横肌等收缩使肋骨下降，膈松弛上升。", "explanation": "用吸气—呼气分组。"}, {"id": "肌学-问答-12", "chapter": "肌学", "type": "问答", "number": 12, "stem": "试述膈的位置和形态", "answerText": "膈位于胸腹腔之间，是穹隆形扁肌，周围为肌性部，中央为中心腱。它构成胸腔底和腹腔顶，是主要吸气肌。", "explanation": "位置、形态和呼吸作用。"}, {"id": "肌学-问答-13", "chapter": "肌学", "type": "问答", "number": 13, "stem": "试述膈的三个裂孔的位置", "answerText": "主动脉裂孔约平第12胸椎，位于两膈脚之间，通主动脉和胸导管；食管裂孔约平第10胸椎，通食管和迷走神经；腔静脉孔约平第8胸椎，通下腔静脉。", "explanation": "用水平和通过结构定位。"}, {"id": "肌学-问答-14", "chapter": "肌学", "type": "问答", "number": 14, "stem": "试述腹前壁肌的位置及形态结构", "answerText": "腹前壁主要为腹直肌，位于正中线两侧，呈带形，上宽下窄，有腱划并包在腹直肌鞘内。", "explanation": "答题不要混入腹侧壁三层肌。"}, {"id": "肌学-问答-15", "chapter": "肌学", "type": "问答", "number": 15, "stem": "试述腹侧壁肌的位置、层次及形态结构", "answerText": "由浅入深为腹外斜肌、腹内斜肌和腹横肌。三者肌纤维方向不同，腱膜参与腹直肌鞘和腹白线；下部肌束参与提睾肌和腹股沟管构成。", "explanation": "层次、纤维方向和腱膜作用是重点。"}, {"id": "肌学-问答-16", "chapter": "肌学", "type": "问答", "number": 16, "stem": "试述腹直肌鞘的构成", "answerText": "腹直肌鞘由腹外斜肌腱膜、腹内斜肌腱膜和腹横肌腱膜构成，分前、后层包裹腹直肌。脐下约4～5 cm以下后层缺如，形成弓状线。", "explanation": "说明前后层来源和弓状线。"}, {"id": "肌学-问答-17", "chapter": "肌学", "type": "问答", "number": 17, "stem": "试述腹股沟管的位置、四壁和两口", "answerText": "腹股沟管位于腹股沟韧带内侧半上方，长约4～5 cm。前壁为腹外斜肌腱膜，后壁为腹横筋膜及联合腱，上壁为腹内斜肌和腹横肌下缘，下壁为腹股沟韧带；内口为深环，外口为浅环。", "explanation": "四壁、两口必须完整。"}, {"id": "肌学-问答-18", "chapter": "肌学", "type": "问答", "number": 18, "stem": "试述腹股沟三角的位置及临床意义", "answerText": "腹股沟三角位于腹直肌外侧缘、腹股沟韧带和腹壁下动脉之间。腹腔内容物经其内侧突出形成腹股沟直疝，经腹壁下动脉外侧深环进入腹股沟管形成斜疝。", "explanation": "用腹壁下动脉区分直疝和斜疝。"}, {"id": "肌学-问答-19", "chapter": "肌学", "type": "问答", "number": 19, "stem": "试述上肢肌的配布特点及其作用", "answerText": "上肢肌分上肢带肌、臂肌、前臂肌和手肌。臂肌前群屈、后群伸；前臂前群屈腕屈指并旋前，后群伸腕伸指并旋后；手肌完成精细运动。", "explanation": "按部位和功能分组。"}, {"id": "肌学-问答-20", "chapter": "肌学", "type": "问答", "number": 20, "stem": "试述三角肌的位置、起止及作用", "answerText": "三角肌覆盖肩关节，起于锁骨外侧、肩峰和肩胛冈，止于肱骨三角肌粗隆。中部外展肩关节，前部屈和旋内，后部伸和旋外。", "explanation": "分束写作用最清楚。"}, {"id": "肌学-问答-21", "chapter": "肌学", "type": "问答", "number": 21, "stem": "试述肱二头肌的位置、起止和作用", "answerText": "位于臂前群，长头起盂上结节，短头起喙突，合成肌腹后止于桡骨粗隆。可屈肘、屈肩并使前臂旋后。", "explanation": "长短头起点和桡骨粗隆止点。"}, {"id": "肌学-问答-22", "chapter": "肌学", "type": "问答", "number": 22, "stem": "试述肱三头肌的位置、起止和作用", "answerText": "位于臂后群，长头起盂下结节，外侧头和内侧头起肱骨后面，三头合成后止于尺骨鹰嘴。主要伸肘，长头还可伸和内收肩关节。", "explanation": "写三头起点和鹰嘴止点。"}, {"id": "肌学-问答-23", "chapter": "肌学", "type": "问答", "number": 23, "stem": "简述参与肩关节屈、伸运动的骨骼肌", "answerText": "屈肩主要有三角肌前部、胸大肌锁骨部、喙肱肌和肱二头肌；伸肩主要有三角肌后部、背阔肌、大圆肌和肱三头肌长头。", "explanation": "按屈、伸两组列举。"}, {"id": "肌学-问答-24", "chapter": "肌学", "type": "问答", "number": 24, "stem": "试述前臂前群肌的层次和各肌位置", "answerText": "前臂前群由浅入深分四层：浅层为旋前圆肌、桡侧腕屈肌、掌长肌、尺侧腕屈肌等；第二层为指浅屈肌；深层有指深屈肌、拇长屈肌和旋前方肌。", "explanation": "层次和代表肌即可。"}, {"id": "肌学-问答-25", "chapter": "肌学", "type": "问答", "number": 25, "stem": "简述使肘屈伸和前臂旋前、旋后的骨骼肌", "answerText": "屈肘有肱二头肌、肱肌和肱桡肌，伸肘为肱三头肌和肘肌；旋前为旋前圆肌和旋前方肌，旋后为旋后肌和肱二头肌。", "explanation": "按动作分组。"}, {"id": "肌学-问答-26", "chapter": "肌学", "type": "问答", "number": 26, "stem": "试述腋窝的位置及各壁构成", "answerText": "腋窝位于肩关节下方、胸壁外侧和上臂上端之间。前壁为胸大肌、胸小肌，后壁为肩胛下肌、大圆肌和背阔肌，上壁通颈部，内侧壁为胸壁，外侧壁为肱骨及邻近肌。", "explanation": "写腋窝四壁和尖、底。"}, {"id": "肌学-问答-27", "chapter": "肌学", "type": "问答", "number": 27, "stem": "试述三边孔和四边孔的围成", "answerText": "三边孔由肩胛下肌、大圆肌和肱三头肌长头围成，旋肩胛动脉通过；四边孔由小圆肌、大圆肌、肱三头肌长头和肱骨外科颈围成，腋神经和旋肱后动脉通过。", "explanation": "边界和通过结构成对记忆。"}, {"id": "肌学-问答-28", "chapter": "肌学", "type": "问答", "number": 28, "stem": "试述下肢肌的配布特点及其作用", "answerText": "下肢肌分髋肌、大腿肌、小腿肌和足肌，较上肢粗壮，承担直立、负重和行走。大腿前群屈髋伸膝，后群伸髋屈膝，内侧群内收髋；小腿前群背屈、后群跖屈、外侧群外翻。", "explanation": "先总述功能，再按部位分组。"}, {"id": "肌学-问答-29", "chapter": "肌学", "type": "问答", "number": 29, "stem": "简述髂腰肌的起止及作用", "answerText": "髂腰肌由髂肌和腰大肌组成，起于髂窝、腰椎体和横突，经髋关节前方止于股骨小转子。可屈髋并旋外，固定下肢时可使躯干前屈。", "explanation": "起点分部和小转子止点。"}, {"id": "肌学-问答-30", "chapter": "肌学", "type": "问答", "number": 30, "stem": "试述臀大肌的位置、起止和作用", "answerText": "臀大肌位于臀部浅层，起于髂骨翼外面、骶骨和尾骨背面，止于臀肌粗隆和髂胫束。可伸髋、旋外，固定下肢时可使躯干后伸。", "explanation": "写清髂胫束附着。"}, {"id": "肌学-问答-31", "chapter": "肌学", "type": "问答", "number": 31, "stem": "简述髋关节的骨骼肌", "answerText": "屈髋有髂腰肌、缝匠肌、股直肌和阔筋膜张肌；伸髋有臀大肌和大腿后群；外展有臀中、小肌；内收有收肌群和股薄肌；旋内主要为臀中、小肌前束，旋外有臀大肌、梨状肌、闭孔肌和股方肌。", "explanation": "按动作分类最便于得分。"}, {"id": "肌学-问答-32", "chapter": "肌学", "type": "问答", "number": 32, "stem": "试述大腿内侧肌群的层次和作用", "answerText": "浅层由耻骨肌、长收肌、股薄肌组成，中层为短收肌，深层为大收肌。共同作用是内收髋关节，并可协助旋外。", "explanation": "层次顺序要写完整。"}, {"id": "肌学-问答-33", "chapter": "肌学", "type": "问答", "number": 33, "stem": "试述小腿三头肌的位置、起止和作用", "answerText": "由腓肠肌和比目鱼肌组成，三头合并为跟腱止于跟骨结节。可跖屈踝关节，腓肠肌还可屈膝并维持站立。", "explanation": "写两个组成肌和跟腱。"}, {"id": "肌学-问答-34", "chapter": "肌学", "type": "问答", "number": 34, "stem": "简述使膝关节屈、伸、旋内和旋外的骨骼肌", "answerText": "屈膝有大腿后群、缝匠肌、腓肠肌和腘肌；伸膝为股四头肌；旋内有半腱肌、半膜肌、缝匠肌和腘肌；旋外主要为股二头肌。", "explanation": "按四种动作列代表肌。"}, {"id": "肌学-问答-35", "chapter": "肌学", "type": "问答", "number": 35, "stem": "试述胫骨前肌的起止和作用", "answerText": "起于胫骨外侧面和骨间膜，肌腱经踝前方绕至内侧，止于内侧楔骨和第1跖骨底。可背屈踝关节并内翻足。", "explanation": "起止和两项作用。"}, {"id": "肌学-问答-36", "chapter": "肌学", "type": "问答", "number": 36, "stem": "试述胫骨后肌的起止和作用", "answerText": "起于胫、腓骨后面及骨间膜，肌腱绕内踝后方止于足舟骨粗隆及楔骨等。可跖屈踝关节并内翻足，维持足弓。", "explanation": "突出绕内踝和足弓作用。"}, {"id": "肌学-问答-37", "chapter": "肌学", "type": "问答", "number": 37, "stem": "简述距小腿关节的组成、运动相关肌及神经支配", "answerText": "关节由胫、腓骨下端和距骨滑车组成。背屈由胫骨前肌、趾长伸肌等（腓深神经）完成；跖屈由小腿三头肌、胫骨后肌等（胫神经）完成；内翻主要由胫骨前、后肌，外翻由腓骨长、短肌（腓浅神经）完成。", "explanation": "按运动—肌—神经三项对应。"}, {"id": "肌学-问答-38", "chapter": "肌学", "type": "问答", "number": 38, "stem": "简述髂胫束及其形态特点", "answerText": "髂胫束是阔筋膜外侧部因阔筋膜张肌和臀大肌腱纤维加强形成的扁带，向下止于胫骨外侧髁，能稳定髋、膝关节。", "explanation": "说明它是阔筋膜增厚部。"}, {"id": "肌学-问答-39", "chapter": "肌学", "type": "问答", "number": 39, "stem": "试述收肌管的位置、构成及内容物", "answerText": "收肌管位于大腿中部缝匠肌深面，前壁为大收肌腱板，后壁为大收肌，外侧壁为股内侧肌。管内有股动脉、股静脉和隐神经，下端经收肌腱裂孔通腘窝。", "explanation": "写三壁、上下口及内容物。"}, {"id": "肌学-问答-40", "chapter": "肌学", "type": "问答", "number": 40, "stem": "试述踝关节周围的支持带", "answerText": "小腿深筋膜在踝部增厚形成伸肌上、下支持带、屈肌支持带和腓骨上、下支持带，分别约束踝前、内踝后和外踝后的肌腱，防止肌腱滑脱。", "explanation": "按位置说明各支持带作用。"}, {"id": "肌学-病例分析-1", "chapter": "肌学", "type": "病例分析", "number": 1, "stem": "男孩，6岁，剧烈运动后在腹股沟附近发现肿块，休息一晚后自行消失。可能患哪些疾病？涉及什么结构？如何鉴别？", "answerText": "考虑腹股沟斜疝或直疝。腹股沟管位于腹股沟韧带内侧半上方，内有精索（女性为子宫圆韧带）；斜疝经深环进入腹股沟管，位于腹壁下动脉外侧，可进入阴囊；直疝从腹股沟三角突出，位于腹壁下动脉内侧，不经过深环。可结合肿块与腹壁下动脉的关系、是否进入阴囊和指压深环试验鉴别。", "explanation": "把病史的“运动后出现、休息后消失”与疝内容物回纳联系，并用腹壁下动脉区分直疝和斜疝。"}];const state={type:'全部',chapter:'全部',q:''};const grid=document.querySelector('#grid');const typeBtns=[...document.querySelectorAll('[data-type]')];const chapter=document.querySelector('#chapter');const search=document.querySelector('#search');const count=document.querySelector('#count');
const chapters=['全部',...new Set(DATA.map(x=>x.chapter))];chapter.innerHTML=chapters.map(x=>`<option>${x}</option>`).join('');
function letter(i){return String.fromCharCode(65+i)}
function render(){let arr=DATA.filter(x=>(state.type==='全部'||x.type===state.type)&&(state.chapter==='全部'||x.chapter===state.chapter)&&(!state.q||x.stem.includes(state.q)||((x.answerText||'').includes(state.q))));count.textContent=`显示 ${arr.length} / ${DATA.length} 题`;
if(!arr.length){grid.innerHTML='<div class="empty">没有匹配题目，请调整筛选条件。</div>';return}
grid.innerHTML=arr.map((x,idx)=>{if(x.options){return `<article class="item" data-id="${x.id}"><div class="meta"><span class="pill">${x.type}</span><span>${x.chapter} · 原题 ${x.number}</span></div><h2>${idx+1}. ${x.stem}</h2><div class="options">${x.options.map((o,i)=>`<button class="opt" data-i="${i}"><span class="letter">${letter(i)}.</span><span>${o}</span></button>`).join('')}</div><div class="feedback"><strong></strong><span></span><div class="source">参考答案：${letter(x.answer)} · ${x.options[x.answer]}</div></div><div class="source">知识点：${x.keyPoint}</div></article>`}return `<article class="item"><div class="meta"><span class="pill ${x.type==='病例分析'?'case':'written'}">${x.type}</span><span>${x.chapter} · 原题 ${x.number}</span></div><h2>${idx+1}. ${x.stem}</h2><details class="answer"><summary>展开答案和解析</summary><p><b>答案：</b>${x.answerText}</p><p><b>解析：</b>${x.explanation}</p></details><div class="source">题目来源：用户提供的《人体解剖学应试指南（OCR）》第一篇“运动系统”</div></article>`}).join('');
grid.querySelectorAll('.item[data-id]').forEach(card=>{const x=DATA.find(y=>y.id===card.dataset.id);card.querySelectorAll('.opt').forEach(btn=>btn.onclick=()=>{const chosen=Number(btn.dataset.i);card.querySelectorAll('.opt').forEach((b,i)=>{b.disabled=true;if(i===x.answer)b.classList.add('correct');if(i===chosen&&chosen!==x.answer)b.classList.add('wrong')});const fb=card.querySelector('.feedback');fb.classList.add('show');fb.querySelector('strong').textContent=chosen===x.answer?'回答正确':'需要复盘';fb.querySelector('span').textContent=x.explanation})})}
typeBtns.forEach(b=>b.onclick=()=>{typeBtns.forEach(x=>x.classList.remove('active'));b.classList.add('active');state.type=b.dataset.type;render()});chapter.onchange=()=>{state.chapter=chapter.value;render()};search.oninput=()=>{state.q=search.value.trim();render()};render();</script></body></html>
