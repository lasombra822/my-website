<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="北医系统解剖学第一篇运动系统完整题库：A1、A2、问答题和病例分析，含答案与解析"><title>运动系统完整题库 · 北医系统解剖学</title><style>*{box-sizing:border-box}body{margin:0;background:#f4f7fb;color:#152238;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Helvetica Neue",Arial,sans-serif;line-height:1.6}.wrap{max-width:1180px;margin:auto;padding:0 20px}.top{position:sticky;top:0;z-index:3;background:rgba(255,255,255,.9);backdrop-filter:blur(18px);border-bottom:1px solid #dce5ef}.top .wrap{height:68px;display:flex;align-items:center;justify-content:space-between}.brand{font-weight:800}.brand small{display:block;color:#64748b;font-size:11px;font-weight:500}.back{color:#2563eb;text-decoration:none;font-size:14px}.hero{padding:46px 0 24px}.eyebrow{color:#2563eb;font-size:12px;font-weight:800;letter-spacing:.12em;text-transform:uppercase}.hero h1{font-size:clamp(34px,5vw,64px);letter-spacing:-.06em;line-height:1.08;margin:12px 0}.hero p{max-width:820px;color:#64748b;margin:0}.notice{margin-top:14px;padding:12px 15px;background:#fff8e8;border:1px solid #f0d897;border-radius:14px;color:#7b5b00;font-size:13px}.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin:18px 0}.select,.search,.filter{border:1px solid #d7e1eb;background:#fff;border-radius:12px;padding:10px 12px;font:inherit;color:#203047}.search{min-width:240px;flex:1}.filter{cursor:pointer}.filter.active{background:#17263d;color:#fff;border-color:#17263d}.count{margin-left:auto;color:#64748b;font-size:13px;align-self:center}.grid{display:grid;gap:14px;padding-bottom:70px}.item{background:#fff;border:1px solid #dce5ef;border-radius:18px;padding:20px;box-shadow:0 10px 30px rgba(36,61,90,.06)}.meta{display:flex;gap:8px;align-items:center;flex-wrap:wrap;color:#64748b;font-size:12px}.pill{background:#eaf1ff;color:#1d4ed8;border-radius:999px;padding:4px 9px;font-weight:800}.pill.written{background:#eaf8f2;color:#087f5b}.pill.case{background:#fff0f0;color:#bd3b3b}.item h2{font-size:18px;line-height:1.45;margin:10px 0 13px}.options{display:grid;gap:8px}.opt{border:1px solid #d7e1eb;background:#fff;border-radius:12px;padding:10px 12px;text-align:left;cursor:pointer;display:flex;gap:10px;font:inherit;color:#1f2f45}.opt:hover{border-color:#86aef9;background:#f7faff}.opt .letter{font-weight:800;color:#64748b;width:22px}.opt.correct{border-color:#51b991;background:#eaf8f2}.opt.wrong{border-color:#df8d8d;background:#fff0f0}.feedback{margin-top:13px;padding:13px 14px;border-radius:13px;background:#f3f7fb;display:none;font-size:14px}.feedback.show{display:block}.feedback strong{display:block;margin-bottom:5px}.answer{margin-top:12px;border-top:1px solid #e7edf3;padding-top:12px}.answer summary{cursor:pointer;font-weight:800;color:#1d4ed8}.answer p{margin:10px 0 0;color:#334155;font-size:14px}.source{color:#94a3b8;font-size:12px;margin-top:9px}.empty{padding:48px;text-align:center;color:#64748b;background:#fff;border:1px dashed #cbd5e1;border-radius:18px}.footer{border-top:1px solid #dce5ef;padding:22px 0 40px;color:#64748b;font-size:12px}@media(max-width:650px){.count{width:100%;margin-left:0}.hero{padding-top:30px}.item{padding:16px}.search{min-width:0;width:100%}}</style></head><body><header class="top"><div class="wrap"><div class="brand">北医系统解剖学 · 运动系统<small>完整题库与解析</small></div><a class="back" href="./anatomy.html">返回解剖学复习站</a></div></header><main class="wrap"><section class="hero"><div class="eyebrow">Movement system · source-grounded</div><h1>第一篇运动系统</h1><p>已整理骨学、关节学、肌学的 A1、A2 型单选题、问答题和病例分析题。单选题点击选项查看即时解析；问答与病例题展开后查看答案和解析。</p><div class="notice">题目、参考答案和解析依据用户提供的《人体解剖学应试指南（OCR）》第一篇“运动系统”整理。个别 OCR 或原书答案存在歧义时，页面保留原书参考答案并在解析中提示，复习时请以任课教师和指定教材为准。</div></section><section class="toolbar"><input id="search" class="search" placeholder="搜索题干、答案或知识点"><select id="chapter" class="select"></select><button class="filter active" data-type="全部">全部</button><button class="filter" data-type="A1">A1</button><button class="filter" data-type="A2">A2</button><button class="filter" data-type="问答">问答</button><button class="filter" data-type="病例分析">病例分析</button><span id="count" class="count"></span></section><section id="grid" class="grid"></section></main><footer class="wrap footer">题库来源：人体解剖学应试指南（第3版）· 第一篇运动系统 · 个人复习工具</footer><script>const DATA=[{"id": "骨学-A1-1", "chapter": "骨学", "type": "A1", "number": 1, "stem": "相邻椎骨的椎上切迹和椎下切迹共同围成的结构是", "options": ["椎孔", "横突", "钩突", "椎间孔", "椎间盘"], "answer": 3, "explanation": "相邻椎骨的切迹在椎弓根上下方相对，围成椎间孔，脊神经和血管由此通过。", "keyPoint": "椎间孔"}, {"id": "骨学-A1-2", "chapter": "骨学", "type": "A1", "number": 2, "stem": "属于运动中能够改变肌肉牵拉方向的籽骨是", "options": ["股骨", "髌骨", "肋骨", "骶骨", "腕骨"], "answer": 1, "explanation": "髌骨位于股四头肌腱内，能改变肌腱牵拉方向并保护膝关节前方。", "keyPoint": "籽骨"}, {"id": "骨学-A1-3", "chapter": "骨学", "type": "A1", "number": 3, "stem": "通过横突孔的结构是", "options": ["椎动脉", "颈内动脉", "颈外动脉", "基底动脉", "锁骨下动脉"], "answer": 0, "explanation": "颈椎横突孔内主要有椎动脉、椎静脉及交感神经丛通过。", "keyPoint": "颈椎"}, {"id": "骨学-A1-4", "chapter": "骨学", "type": "A1", "number": 4, "stem": "胸骨角平对", "options": ["第1肋", "第2肋", "第3肋", "第4肋", "第5肋"], "answer": 1, "explanation": "胸骨柄与胸骨体连接处为胸骨角，两侧与第2肋软骨相连，是计数肋骨的标志。", "keyPoint": "胸骨"}, {"id": "骨学-A1-5", "chapter": "骨学", "type": "A1", "number": 5, "stem": "颈静脉切迹位于", "options": ["胸骨", "颅后窝", "锁骨", "颈椎", "第1肋"], "answer": 0, "explanation": "颈静脉切迹位于胸骨柄上缘的中部。", "keyPoint": "胸骨柄"}, {"id": "骨学-A1-6", "chapter": "骨学", "type": "A1", "number": 6, "stem": "肋软骨前端参与形成肋弓的是", "options": ["第6～10对", "第7～10对", "第8～10对", "第9～12对", "第7～12对"], "answer": 2, "explanation": "第8～10对肋软骨依次与上位肋软骨相连，形成肋弓。", "keyPoint": "肋弓"}, {"id": "骨学-A1-7", "chapter": "骨学", "type": "A1", "number": 7, "stem": "开口于蝶筛隐窝的是", "options": ["蝶窦", "筛窦", "额窦", "蝶腭孔", "上颌窦"], "answer": 0, "explanation": "蝶窦开口于蝶筛隐窝；额窦、上颌窦和前、中筛窦多开口于中鼻道。", "keyPoint": "鼻旁窦"}, {"id": "骨学-A1-8", "chapter": "骨学", "type": "A1", "number": 8, "stem": "与脑膜中动脉沟相连续的结构是", "options": ["圆孔", "棘孔", "卵圆孔", "茎乳孔", "破裂孔"], "answer": 1, "explanation": "脑膜中动脉经棘孔进入颅中窝，并在颅骨内面形成相应的动脉沟。", "keyPoint": "颅底孔"}, {"id": "骨学-A1-9", "chapter": "骨学", "type": "A1", "number": 9, "stem": "锁骨骨折多发生在", "options": ["中、内1/3交界处", "中、外1/3交界处", "内侧1/3", "外侧1/3", "肩峰端"], "answer": 1, "explanation": "锁骨中、外1/3交界处较薄弱，是骨折常见部位。", "keyPoint": "锁骨"}, {"id": "骨学-A1-10", "chapter": "骨学", "type": "A1", "number": 10, "stem": "肩胛骨下角平对", "options": ["第6肋", "第7肋", "第8肋", "第9肋", "第10肋"], "answer": 1, "explanation": "肩胛骨下角在上肢下垂时约平第7肋或第7肋间隙。", "keyPoint": "肩胛骨"}, {"id": "骨学-A1-11", "chapter": "骨学", "type": "A1", "number": 11, "stem": "成人骨髓穿刺最常用的部位是", "options": ["胸骨柄", "髂前上棘", "椎弓", "骶正中嵴", "肋骨"], "answer": 1, "explanation": "髂前上棘骨质较薄且松质骨丰富，临床常用于骨髓穿刺。", "keyPoint": "骨髓穿刺"}, {"id": "骨学-A1-12", "chapter": "骨学", "type": "A1", "number": 12, "stem": "正行于肱骨后方中部的神经是", "options": ["腋神经", "正中神经", "桡神经", "尺神经", "肌皮神经"], "answer": 2, "explanation": "桡神经沿肱骨桡神经沟行于肱骨体后方中部，骨折时易受损。", "keyPoint": "肱骨"}, {"id": "骨学-A1-13", "chapter": "骨学", "type": "A1", "number": 13, "stem": "股骨颈与股骨体长轴之间向内的夹角（颈干角）约为", "options": ["95～105°", "105～115°", "115～125°", "125～130°", "130～135°"], "answer": 3, "explanation": "成人股骨颈干角约125°～130°，使下肢承重和髋关节活动更有效。", "keyPoint": "股骨"}, {"id": "骨学-A1-14", "chapter": "骨学", "type": "A1", "number": 14, "stem": "女性肱骨轴与前臂轴延长线相交形成的携角约为", "options": ["0～5°", "5～10°", "10～15°", "15～20°", "20～25°"], "answer": 2, "explanation": "携角是肱骨与前臂轴线形成的外翻角，女性通常约10°～15°。", "keyPoint": "肘部"}, {"id": "骨学-A2-1", "chapter": "骨学", "type": "A2", "number": 1, "stem": "男性，28岁，因头部外伤出血，医生用手指压迫颈动脉结节止血。相关结构是", "options": ["棘突", "齿突", "椎体钩", "上关节突", "颈动脉结节"], "answer": 4, "explanation": "颈动脉结节是第6颈椎横突前结节，颈总动脉可在此处被压向椎体止血。", "keyPoint": "颈动脉结节"}, {"id": "骨学-A2-2", "chapter": "骨学", "type": "A2", "number": 2, "stem": "女性，45岁，行骶管麻醉，常作为操作标志的结构是", "options": ["骶岬", "骶正中嵴", "骶管裂孔", "骶角", "骶后孔"], "answer": 3, "explanation": "骶角位于骶管裂孔两侧，可在体表触及，用于定位骶管裂孔。", "keyPoint": "骶管麻醉"}, {"id": "骨学-A2-3", "chapter": "骨学", "type": "A2", "number": 3, "stem": "女性，13岁，头前部外伤后脑脊液鼻漏、嗅觉减退，最可能损伤的结构是", "options": ["额鳞", "筛板", "颞鳞", "蝶鞍", "鼻骨"], "answer": 1, "explanation": "筛板有嗅丝通过，骨折可使嗅觉受损并形成脑脊液鼻漏。", "keyPoint": "筛骨"}, {"id": "骨学-A2-4", "chapter": "骨学", "type": "A2", "number": 4, "stem": "男性，24岁，头部撞击后出现Battle征，最可能损伤的结构是", "options": ["额骨", "蝶骨大翼", "颞骨岩部", "鞍结节", "枕外隆凸"], "answer": 2, "explanation": "Battle征提示颅底骨折，颞骨岩部骨折可造成乳突区皮下淤血。", "keyPoint": "颅底骨折"}, {"id": "骨学-A2-5", "chapter": "骨学", "type": "A2", "number": 5, "stem": "女性因面部疼痛行卵圆孔穿刺麻醉，术后面部歪斜并出现下部感觉障碍，最可能损伤", "options": ["上颌神经", "下颌神经", "脑膜中动脉", "眼动脉", "颈内动脉"], "answer": 1, "explanation": "卵圆孔是下颌神经出颅的通道，损伤可导致咀嚼运动及面下部感觉异常。", "keyPoint": "卵圆孔"}, {"id": "骨学-A2-6", "chapter": "骨学", "type": "A2", "number": 6, "stem": "男性，15岁，头侧部被击伤，CT提示硬膜外血肿，最可能受伤的血管是", "options": ["浅颞动脉", "板障脉", "面深动脉", "脑膜中动脉", "大脑中动脉"], "answer": 3, "explanation": "翼点内面有脑膜中动脉前支经过，骨折可撕裂该血管形成硬膜外血肿。", "keyPoint": "翼点"}, {"id": "骨学-A2-7", "chapter": "骨学", "type": "A2", "number": 7, "stem": "男性，30岁，头侧部撞击后脑脊液耳漏、听力下降，最可能损伤", "options": ["额骨眶部", "蝶骨大翼", "颞骨岩部", "顶骨结节", "枕外隆凸"], "answer": 2, "explanation": "颞骨岩部含内耳及内耳道，骨折可累及面神经、前庭蜗神经和听觉结构。", "keyPoint": "颞骨岩部"}, {"id": "骨学-A2-8", "chapter": "骨学", "type": "A2", "number": 8, "stem": "男性，5岁，行下颌孔阻滞麻醉治疗下颌乳磨牙，阻滞的神经是", "options": ["面神经", "舌神经", "舌下神经", "上牙槽神经", "下牙槽神经"], "answer": 4, "explanation": "下牙槽神经经下颌孔进入下颌管，是下颌牙齿麻醉的主要靶神经。", "keyPoint": "下颌管"}, {"id": "骨学-A2-9", "chapter": "骨学", "type": "A2", "number": 9, "stem": "男性，22岁，腰穿抽取脑脊液，双侧髂嵴最高点连线约平对", "options": ["第2腰椎棘突", "第3腰椎棘突", "第4腰椎棘突", "第5腰椎棘突", "骶骨"], "answer": 2, "explanation": "髂嵴最高点连线通常平第4腰椎棘突，可作为腰穿定位标志。", "keyPoint": "腰穿定位"}, {"id": "骨学-A2-10", "chapter": "骨学", "type": "A2", "number": 10, "stem": "女性，67岁，骨质疏松后股骨颈骨折，供应股骨颈的动脉主要是", "options": ["闭孔动脉", "滋养动脉", "干骺端动脉", "旋股内侧动脉", "旋股外侧动脉"], "answer": 3, "explanation": "成人股骨头和股骨颈血供主要来自旋股内、外侧动脉的分支，其中旋股内侧动脉更重要。", "keyPoint": "股骨颈血供"}, {"id": "关节学-A1-1", "chapter": "关节学", "type": "A1", "number": 1, "stem": "属于相邻两椎骨间的连结方式是", "options": ["透明软骨结合", "韧带连结", "骨性结合", "纤维连结", "纤维软骨结合"], "answer": 4, "explanation": "相邻椎体之间以椎间盘相连，椎间盘属于纤维软骨结合。", "keyPoint": "椎间盘"}, {"id": "关节学-A1-2", "chapter": "关节学", "type": "A1", "number": 2, "stem": "椎间盘最厚的位置是", "options": ["颈部", "胸部", "腰部", "骶部", "尾部"], "answer": 2, "explanation": "腰椎承受躯干重量最大，椎间盘通常在腰部最厚。", "keyPoint": "椎间盘"}, {"id": "关节学-A1-3", "chapter": "关节学", "type": "A1", "number": 3, "stem": "属于椎弓间的连结是", "options": ["股骨头韧带", "黄韧带", "膝交叉韧带", "棘间韧带", "覆膜"], "answer": 3, "explanation": "相邻椎弓板之间以黄韧带相连，棘间韧带和棘上韧带也属于椎弓间韧带。", "keyPoint": "椎弓间韧带"}, {"id": "关节学-A1-4", "chapter": "关节学", "type": "A1", "number": 4, "stem": "脊柱中旋转运动度最大的部分是", "options": ["颈椎", "胸椎", "腰椎", "骶骨", "尾骨"], "answer": 0, "explanation": "胸椎旋转受肋骨限制，腰椎关节面偏矢状；颈椎旋转范围相对最大。", "keyPoint": "脊柱运动"}, {"id": "关节学-A1-5", "chapter": "关节学", "type": "A1", "number": 5, "stem": "脊柱中屈伸运动度最大的部分是", "options": ["颈椎", "胸椎", "腰椎", "骶骨", "尾骨"], "answer": 2, "explanation": "腰椎关节面适于屈伸，腰段屈伸运动范围较大。", "keyPoint": "脊柱运动"}, {"id": "关节学-A1-6", "chapter": "关节学", "type": "A1", "number": 6, "stem": "位于椎管前壁的韧带是", "options": ["前纵韧带", "后纵韧带", "项韧带", "黄韧带", "棘上韧带"], "answer": 1, "explanation": "后纵韧带贴附椎体和椎间盘后面，构成椎管前壁的一部分。", "keyPoint": "椎管"}, {"id": "关节学-A1-7", "chapter": "关节学", "type": "A1", "number": 7, "stem": "脊柱后伸时最紧张的韧带是", "options": ["前纵韧带", "后纵韧带", "棘间韧带", "棘上韧带", "项韧带"], "answer": 0, "explanation": "脊柱后伸会牵张位于椎体前面的前纵韧带。", "keyPoint": "脊柱运动"}, {"id": "关节学-A1-8", "chapter": "关节学", "type": "A1", "number": 8, "stem": "具有纤维软骨关节盘的关节是", "options": ["寰枕关节", "颞下颌关节", "肩关节", "桡尺近侧关节", "髋关节"], "answer": 1, "explanation": "颞下颌关节内有纤维软骨关节盘，将关节腔分为上下两部。", "keyPoint": "颞下颌关节"}, {"id": "关节学-A1-9", "chapter": "关节学", "type": "A1", "number": 9, "stem": "具有囊内韧带的关节是", "options": ["寰枢关节", "颞下颌关节", "肘关节", "髋关节", "桡腕关节"], "answer": 3, "explanation": "髋关节内有股骨头韧带；膝关节也有前、后交叉韧带。", "keyPoint": "髋关节"}, {"id": "关节学-A1-10", "chapter": "关节学", "type": "A1", "number": 10, "stem": "形成肋弓结构的肋软骨是", "options": ["第2～7对", "第7～8对", "第8～10对", "第8～12对", "每对肋骨前端"], "answer": 2, "explanation": "第8～10对肋软骨依次连接形成肋弓。", "keyPoint": "肋弓"}, {"id": "关节学-A1-11", , "stem": "腱纤维未编入肩关节囊的肌是", "options": ["冈上肌", "冈下肌", "大圆肌", "小圆肌", "肩胛下肌"], "answer": 2, "explanation": "大圆肌不属于肩袖，腱纤维不编入肩关节囊；冈上、冈下、小圆和肩胛下肌构成肩袖。", "keyPoint": "肩袖"}, {"id": "肌学-A1-13", "chapter": "肌学", "type": "A1", "number": 13, "stem": "能够屈肘关节的肌是", "options": ["三角肌", "背阔肌", "肱三头肌", "肱肌", "喙肱肌"], "answer": 3, "explanation": "肱肌是强有力的屈肘肌，作用不受前臂旋前旋后影响。", "keyPoint": "屈肘肌"}, {"id": "肌学-A1-14", "chapter": "肌学", "type": "A1", "number": 14, "stem": "肱三头肌的长头起自", "options": ["肩胛骨盂上结节", "肩胛骨盂下结节", "桡神经沟下方骨面", "桡神经沟上方骨面", "肩胛骨喙突"], "answer": 1, "explanation": "肱三头肌长头起于肩胛骨盂下结节，跨越肩关节和肘关节。", "keyPoint": "肱三头肌"}, {"id": "肌学-A1-15", "chapter": "肌学", "type": "A1", "number": 15, "stem": "肱桡肌止于", "options": ["腕豆骨", "掌腱膜", "桡骨茎突", "第2掌骨底", "桡骨远端掌面"], "answer": 2, "explanation": "肱桡肌止于桡骨茎突附近，主要屈肘并帮助前臂回到中立位。", "keyPoint": "前臂肌"}, {"id": "肌学-A1-16", "chapter": "肌学", "type": "A1", "number": 16, "stem": "旋前圆肌的作用是", "options": ["紧张掌腱膜", "屈腕", "屈肘", "腕关节内收", "前臂旋前"], "answer": 2, "explanation": "按本书参考答案，旋前圆肌可辅助屈肘；其主要作用还包括前臂旋前。", "keyPoint": "前臂肌"}, {"id": "肌学-A1-17", "chapter": "肌学", "type": "A1", "number": 17, "stem": "指深屈肌的起点位于", "options": ["桡骨及骨间膜前面", "尺骨及骨间膜前面", "肱骨外上髁", "肱骨内上髁", "尺骨远端前面"], "answer": 1, "explanation": "指深屈肌起于尺骨前面上部和骨间膜，肌腱止于远节指骨底。", "keyPoint": "前臂肌"}, {"id": "肌学-A1-18", "chapter": "肌学", "type": "A1", "number": 18, "stem": "肌腱止于第2～5指中节指骨底的肌肉是", "options": ["指深屈肌", "指浅屈肌", "肱桡肌", "掌长肌", "尺侧腕屈肌"], "answer": 1, "explanation": "指浅屈肌肌腱在中节指骨底分叉，指深屈肌腱继续至远节指骨。", "keyPoint": "手指屈肌"}, {"id": "肌学-A1-19", "chapter": "肌学", "type": "A1", "number": 19, "stem": "指深屈肌的肌腱止于", "options": ["掌腱膜", "豌豆骨", "第2掌骨底", "中节指骨底", "远节指骨体两侧"], "answer": 4, "explanation": "指深屈肌腱穿过指浅屈肌腱分叉，止于远节指骨底。", "keyPoint": "手指屈肌"}, {"id": "肌学-A1-20", "chapter": "肌学", "type": "A1", "number": 20, "stem": "拇长屈肌的起点位于", "options": ["肱骨外上髁", "尺骨及骨间膜前面", "桡骨及骨间膜前面", "肱骨内上髁", "尺骨远端前面"], "answer": 2, "explanation": "拇长屈肌起于桡骨前面中部和骨间膜，止于拇指远节指骨底。", "keyPoint": "拇长屈肌"}, {"id": "肌学-A1-21", "chapter": "肌学", "type": "A1", "number": 21, "stem": "屈手指近侧指骨间关节的是", "options": ["指浅屈肌", "指深屈肌", "蚓状肌", "指深屈肌和指浅屈肌", "骨间肌"], "answer": 0, "explanation": "指浅屈肌止于中节指骨底，主要屈曲近侧指骨间关节。", "keyPoint": "手指屈曲"}, {"id": "肌学-A1-22", "chapter": "肌学", "type": "A1", "number": 22, "stem": "构成三边孔上界的骨骼肌是", "options": ["小圆肌和冈上肌", "小圆肌和肩胛下肌", "大圆肌和肱三头肌长头", "小圆肌和肱三头肌长头", "大圆肌和背阔肌"], "answer": 1, "explanation": "按本书题解，三边孔上界由小圆肌和肩胛下肌相关肌缘构成；实际辨认还需结合三边孔的四壁。", "keyPoint": "三边孔"}, {"id": "肌学-A1-23", "chapter": "肌学", "type": "A1", "number": 23, "stem": "既可屈髋关节又可屈膝关节的肌是", "options": ["缝匠肌", "股二头肌", "股直肌", "髂腰肌", "半腱肌"], "answer": 0, "explanation": "缝匠肌跨髋、膝两关节，可屈髋并屈膝，同时使大腿外展、外旋。", "keyPoint": "缝匠肌"}, {"id": "肌学-A1-24", "chapter": "肌学", "type": "A1", "number": 24, "stem": "不能屈髋关节的肌是", "options": ["髂腰肌和阔筋膜张肌", "髂腰肌和股直肌", "髂腰肌和耻骨肌", "股直肌和股薄肌", "股二头肌和股外侧肌"], "answer": 4, "explanation": "股二头肌和股外侧肌不是髋关节屈肌；髂腰肌、股直肌和耻骨肌均可屈髋。", "keyPoint": "髋关节肌"}, {"id": "肌学-A1-25", "chapter": "肌学", "type": "A1", "number": 25, "stem": "伸髋关节并可使其旋外的肌是", "options": ["臀大肌", "臀中肌和臀小肌", "股二头肌", "半腱肌和半膜肌", "梨状肌"], "answer": 0, "explanation": "臀大肌是强力伸髋肌，并可使髋关节旋外。", "keyPoint": "臀大肌"}, {"id": "肌学-A1-26", "chapter": "肌学", "type": "A1", "number": 26, "stem": "可伸髋关节、屈膝关节的肌是", "options": ["股薄肌", "缝匠肌", "股四头肌", "股二头肌", "髂腰肌"], "answer": 3, "explanation": "股二头肌跨髋和膝关节，可伸髋并屈膝。", "keyPoint": "大腿后群"}, {"id": "肌学-A1-27", "chapter": "肌学", "type": "A1", "number": 27, "stem": "可使髋关节旋内的肌是", "options": ["长收肌", "梨状肌", "臀中肌", "臀大肌", "大收肌"], "answer": 2, "explanation": "臀中肌前部肌束可使髋关节旋内并参与外展。", "keyPoint": "臀中肌"}, {"id": "肌学-A1-28", "chapter": "肌学", "type": "A1", "number": 28, "stem": "可使髋关节旋外的肌是", "options": ["股二头肌", "臀小肌", "阔筋膜张肌", "半膜肌", "半腱肌"], "answer": 1, "explanation": "按本书参考答案，臀小肌列入该题选项；临床判断应结合肌束部位和具体运动。", "keyPoint": "髋关节肌"}, {"id": "肌学-A1-29", "chapter": "肌学", "type": "A1", "number": 29, "stem": "止于股骨大转子的肌是", "options": ["臀大肌", "臀中肌", "股方肌", "闭孔内肌", "闭孔外肌"], "answer": 1, "explanation": "臀中肌止于股骨大转子外侧面，是髋关节外展和稳定骨盆的重要肌肉。", "keyPoint": "臀中肌"}, {"id": "肌学-A1-30", "chapter": "肌学", "type": "A1", "number": 30, "stem": "参与屈膝关节的肌是", "options": ["股四头肌", "比目鱼肌", "胫骨后肌", "腓肠肌", "大收肌"], "answer": 3, "explanation": "腓肠肌跨过膝关节后方，可辅助屈膝；其主要作用是跖屈踝关节。", "keyPoint": "腓肠肌"}, {"id": "肌学-A1-31", "chapter": "肌学", "type": "A1", "number": 31, "stem": "构成股三角内侧界的骨骼肌是", "options": ["腹股沟韧带", "长收肌外侧缘", "长收肌内侧缘", "缝匠肌外侧缘", "缝匠肌内侧缘"], "answer": 2, "explanation": "股三角上界为腹股沟韧带，外侧界为缝匠肌内侧缘，内侧界为长收肌内侧缘。", "keyPoint": "股三角"}, {"id": "肌学-A1-32", "chapter": "肌学", "type": "A1", "number": 32, "stem": "收肌管内通过的结构有", "options": ["大隐静脉", "股血管", "小隐静脉", "股深动脉", "闭孔神经"], "answer": 1, "explanation": "收肌管内有股动脉、股静脉和隐神经等，股血管由此通向腘窝。", "keyPoint": "收肌管"}, {"id": "肌学-A2-1", "chapter": "肌学", "type": "A2", "number": 1, "stem": "男性，32岁，颈部外伤出现“翼肩”，最可能瘫痪的骨骼肌是", "options": ["背阔肌", "肩胛提肌", "菱形肌", "斜方肌", "肩胛下肌"], "answer": 3, "explanation": "斜方肌受副神经支配，损伤可使肩胛骨内侧缘和下角突出，出现翼肩。", "keyPoint": "斜方肌"}, {"id": "肌学-A2-2", "chapter": "肌学", "type": "A2", "number": 2, "stem": "男性，42岁，因车祸需行肌瓣修复大面积缺损区，最常选取的骨骼肌是", "options": ["背阔肌", "肩胛提肌", "菱形肌", "斜方肌", "臀大肌"], "answer": 0, "explanation": "背阔肌面积大、血供和血管蒂明确，常用于肌皮瓣移植。", "keyPoint": "背阔肌"}, {"id": "肌学-A2-3", "chapter": "肌学", "type": "A2", "number": 3, "stem": "女性，45岁，乳腺癌术后出现肩胛骨内侧缘和下角突出形成翼状肩，可能瘫痪的肌肉是", "options": ["背阔肌", "肩胛提肌", "前锯肌", "斜方肌", "肩胛下肌"], "answer": 2, "explanation": "前锯肌瘫痪时肩胛骨失去胸壁贴附，长胸神经损伤是常见原因。", "keyPoint": "前锯肌"}, {"id": "肌学-A2-4", "chapter": "肌学", "type": "A2", "number": 4, "stem": "女性，26岁，肱骨上部骨折出现“方肩”，可能发生萎缩的肌肉是", "options": ["冈上肌", "三角肌", "冈下肌", "小圆肌", "大圆肌"], "answer": 1, "explanation": "腋神经损伤或三角肌萎缩可使肩部圆隆消失，形成方肩。", "keyPoint": "三角肌"}, {"id": "肌学-A2-5", "chapter": "肌学", "type": "A2", "number": 5, "stem": "女性，50岁，肩关节不能上举、梳头困难，与症状最相关的骨骼肌是", "options": ["三角肌和冈上肌", "三角肌和冈下肌", "冈下肌和胸大肌", "冈上肌和大圆肌", "大圆肌和肩胛下肌"], "answer": 0, "explanation": "肩关节外展起始依赖冈上肌，继续外展主要依赖三角肌。", "keyPoint": "肩关节外展"}, {"id": "肌学-A2-6", "chapter": "肌学", "type": "A2", "number": 6, "stem": "女性，3岁，计划免疫行肌内注射，最常选用的注射部位是", "options": ["胸大肌", "背阔肌", "臀大肌", "三角肌", "股四头肌"], "answer": 3, "explanation": "儿童常选三角肌进行肌内注射，避开大血管和神经。", "keyPoint": "肌内注射"}, {"id": "肌学-A2-7", "chapter": "肌学", "type": "A2", "number": 7, "stem": "男性，43岁，狗咬伤后行狂犬病疫苗注射，最常用的骨骼肌是", "options": ["肩胛下肌下部", "肱二头肌长头", "三角肌下部", "股四头肌", "大腿内收肌群"], "answer": 2, "explanation": "成人疫苗常在三角肌中部进行肌内注射。", "keyPoint": "三角肌"}, {"id": "肌学-A2-8", "chapter": "肌学", "type": "A2", "number": 8, "stem": "女性，25岁，腕管综合征，不在腕管内穿行的结构是", "options": ["正中神经", "掌长肌腱", "指浅屈肌腱", "指深屈肌腱", "拇长屈肌腱"], "answer": 1, "explanation": "掌长肌腱位于腕管浅面，不通过腕管；腕管内有正中神经及屈肌腱。", "keyPoint": "腕管"}, {"id": "肌学-A2-9", "chapter": "肌学", "type": "A2", "number": 9, "stem": "男性，35岁，肱骨外上髁骨折并桡神经深支损伤，可能瘫痪的肌是", "options": ["肱肌", "肱桡肌", "肱三头肌", "桡侧腕长伸肌", "桡侧腕短伸肌"], "answer": 4, "explanation": "桡神经深支（骨间后神经）支配前臂伸肌群，桡侧腕短伸肌可受累。", "keyPoint": "桡神经"}, {"id": "肌学-A2-10", "chapter": "肌学", "type": "A2", "number": 10, "stem": "男性，23岁，左手腕内侧刀伤后手指不能相互靠拢，可能瘫痪的骨骼肌是", "options": ["指伸肌", "掌长肌", "拇收肌", "蚓状肌", "骨间肌"], "answer": 4, "explanation": "手指相互靠拢主要依赖掌侧骨间肌，尺神经损伤可导致其瘫痪。", "keyPoint": "手内在肌"}, {"id": "肌学-A2-11", "chapter": "肌学", "type": "A2", "number": 11, "stem": "男性，8岁，行肌内注射，最常选用的注射部位是", "options": ["斜方肌", "背阔肌", "臀大肌", "肱三头肌", "胸大肌"], "answer": 2, "explanation": "臀大肌肌肉厚大，是常用肌内注射部位，但应避开坐骨神经。", "keyPoint": "肌内注射"}, {"id": "肌学-A2-12", "chapter": "肌学", "type": "A2", "number": 12, "stem": "男性，18岁，叩击髌韧带观察深反射，形成髌韧带的肌是", "options": ["股四头肌", "比目鱼肌", "胫骨后肌", "腓肠肌", "大收肌"], "answer": 0, "explanation": "髌韧带是股四头肌腱包绕髌骨后的延续，膝反射反映股神经通路。", "keyPoint": "股四头肌"}, {"id": "肌学-A2-13", "chapter": "肌学", "type": "A2", "number": 13, "stem": "女性，55岁，盆腔手术造成闭孔神经损伤，不会出现瘫痪的骨骼肌是", "options": ["股薄肌", "缝匠肌", "耻骨肌", "长收肌", "大收肌"], "answer": 1, "explanation": "缝匠肌由股神经支配，不属于闭孔神经支配的大腿内收肌群。", "keyPoint": "闭孔神经"}, {"id": "肌学-A2-14", "chapter": "肌学", "type": "A2", "number": 14, "stem": "男性，72岁，坐骨部外伤需转移肌瓣修补缺损，最常选取的骨骼肌是", "options": ["髂腰肌", "股薄肌", "缝匠肌", "半腱肌", "半膜肌"], "answer": 3, "explanation": "半腱肌位于大腿后群，血供和肌腹长度适合肌瓣转移。", "keyPoint": "大腿后群"}, {"id": "肌学-A2-15", "chapter": "肌学", "type": "A2", "number": 15, "stem": "男性，45岁，踝管狭窄，不在踝管内穿行的结构是", "options": ["跟腱", "胫神经", "胫后动脉", "胫骨后肌腱", "拇长屈肌腱"], "answer": 0, "explanation": "跟腱位于踝关节后方但不通过内踝后方的踝管；踝管内有屈肌腱、胫后血管和胫神经。", "keyPoint": "踝管"}, {"id": "肌学-A2-16", "chapter": "肌学", "type": "A2", "number": 16, "stem": "男性，25岁，跳跃后不能屈踝关节，最可能损伤的结构是", "options": ["比目鱼肌", "腘肌", "跟腱", "半腱肌", "耻骨肌"], "answer": 2, "explanation": "跟腱连接小腿三头肌与跟骨，断裂会显著影响踝关节跖屈。", "keyPoint": "跟腱"}, {"id": "肌学-A2-17", "chapter": "肌学", "type": "A2", "number": 17, "stem": "女性，13岁，小腿骨折后足内翻障碍，可能瘫痪的肌是", "options": ["腓肠肌", "胫骨前肌", "腓骨长肌", "腓骨短肌", "比目鱼肌"], "answer": 1, "explanation": "胫骨前肌可使足背屈和内翻，损伤会导致足内翻减弱。", "keyPoint": "小腿前群"}, {"id": "肌学-A2-18", "chapter": "肌学", "type": "A2", "number": 18, "stem": "男性，32岁，腓骨上段骨折后出现足外翻障碍，可能瘫痪的肌是", "options": ["半腱肌和半膜肌", "腓肠肌和比目鱼肌", "趾长屈肌和趾长伸肌", "胫骨前肌和胫骨后肌", "腓骨长肌和腓骨短肌"], "answer": 4, "explanation": "腓骨长、短肌位于小腿外侧群，主要完成足外翻，腓骨上段损伤可累及其神经支配。", "keyPoint": "小腿外侧群"}, {"id": "骨学-问答-1", "chapter": "骨学", "type": "问答", "number": 1, "stem": "简述运动系统的组成及其功能", "answerText": "运动系统由骨、骨连接（关节）和骨骼肌组成。全身骨借骨连接相互连结构成骨骼，形成坚硬支架，支持体重、保护脏器；骨骼肌附着于骨，在神经支配下收缩，以关节为支点牵拉骨改变位置产生运动。骨起杠杆作用，关节是运动枢纽，骨骼肌是动力器官；骨骼肌是运动的主动部分，骨和骨连接是被动部分。", "explanation": "答案应同时说明组成、整体功能和三者在运动中的分工，不能只列出三个名词。"}, {"id": "骨学-问答-2", "chapter": "骨学", "type": "问答", "number": 2, "stem": "简述全身骨的形态学分类及各类骨的特点和分布", "answerText": "骨按形态分为长骨、短骨、扁骨和不规则骨。长骨呈管状，分骨干和两端，骨干内有髓腔，两端膨大为骺，成年后骺软骨骨化遗留骺线，主要分布于四肢；短骨近似立方体，多见于腕骨和跗骨；扁骨薄而宽，常构成颅盖、胸廓和骨盆壁；不规则骨形态复杂，如椎骨。", "explanation": "分类、形态、主要分布和代表骨要成套作答；长骨的骨干—骺—骺线是本题的关键细节。"}, {"id": "骨学-问答-3", "chapter": "骨学", "type": "问答", "number": 3, "stem": "简述骨的构造及其功能", "answerText": "骨的构造主要包括骨质、骨膜和骨髓，此外还有血管、淋巴管和神经。骨质分骨密质和骨松质：骨密质致密坚固，骨松质由骨小梁构成，按受力方向排列并承重。骨膜由外层致密纤维层和内层疏松成骨层组成，具有营养、感觉、再生和修复作用。骨髓位于髓腔和骨松质间，红骨髓有造血功能，成年长骨骨干的红骨髓多被脂肪替代为黄骨髓，严重失血时黄骨髓可重新转为红骨髓。", "explanation": "解析应把骨质、骨膜和骨髓分别写出结构与功能，尤其不能漏掉骨膜的成骨修复作用以及红、黄骨髓的变化。"}, {"id": "骨学-问答-4", "chapter": "骨学", "type": "问答", "number": 4, "stem": "简述vertebrae的一般形态", "answerText": "椎骨由前方的椎体和后方的椎弓组成，椎体与椎弓围成椎孔，连续的椎孔构成椎管。椎弓由椎弓根和椎弓板组成，椎弓根上、下缘有切迹，相邻椎骨的切迹共同围成椎间孔。每个椎骨通常发出7个突起：1个棘突、1对横突和1对上、下关节突；相邻关节突构成关节突关节。", "explanation": "按椎体、椎弓、椎孔/椎管、椎间孔和7个突起的顺序作答，能覆盖一般椎骨的完整形态。"}, {"id": "骨学-问答-5", "chapter": "骨学", "type": "问答", "number": 5, "stem": "简述颈椎、胸椎、腰椎的主要形态学特点", "answerText": "颈椎椎体较小、椎孔较大且多呈三角形，横突有横突孔，关节突关节面近水平；第1颈椎无椎体和棘突，由前弓、后弓和侧块构成，第2颈椎有齿突，第7颈椎棘突长。胸椎椎体侧面和横突末端有肋凹，棘突长并向后下方倾斜，关节面多呈冠状位。腰椎椎体粗大，椎孔相对较小，棘突宽而呈板状，关节面多呈矢状位。", "explanation": "比较三段椎骨时要同时写椎体、椎孔、棘突/关节突和特有结构；颈椎横突孔、胸椎肋凹、腰椎粗大椎体是辨认要点。"}, {"id": "骨学-问答-6", "chapter": "骨学", "type": "问答", "number": 6, "stem": "简述胸骨角的位置及临床意义", "answerText": "胸骨角位于胸骨柄与胸骨体连接处，向前微凸，后方约平第4胸椎体下缘，两侧与第2肋软骨相连。它是计数肋骨和肋间隙的重要体表标志，也可用于定位气管分叉、主动脉弓起止等胸内结构，并作为胸骨柄与胸骨体分界的标志。", "explanation": "位置、平面、第2肋连接和体表定位意义都要写，不能只答“胸骨柄与体连接处”。"}, {"id": "骨学-问答-7", "chapter": "骨学", "type": "问答", "number": 7, "stem": "简述躯干骨的重要体表标志", "answerText": "躯干骨的重要体表标志包括第7颈椎棘突、胸椎和腰椎棘突、颈静脉切迹、胸骨角、剑突、第2～12对肋及肋弓、骶骨岬和骶角等。它们可用于计数肋骨、判断脊柱节段、定位胸腹部器官和穿刺点。", "explanation": "列举标志后要说明用途，例如胸骨角计数肋骨、腰椎棘突定位腰穿、骶角定位骶管裂孔。"}, {"id": "骨学-问答-8", "chapter": "骨学", "type": "问答", "number": 8, "stem": "简述与颅中窝和颅后窝相关的重要孔、裂和沟", "answerText": "颅中窝的重要结构包括视神经管、眶上裂、圆孔、卵圆孔、棘孔、破裂孔和颈动脉沟，脑膜中动脉经棘孔进入颅腔，三叉神经各分支分别经圆孔、卵圆孔等出颅。颅后窝包括枕骨大孔、舌下神经管、内耳门、颈静脉孔、横窦沟和乙状窦沟，分别与延髓、舌下神经、面听神经、颈静脉及相关血管神经通路有关。", "explanation": "按颅中窝和颅后窝分组，并至少补充代表性通过结构，才能体现孔、裂、沟的临床意义。"}, {"id": "骨学-问答-9", "chapter": "骨学", "type": "问答", "number": 9, "stem": "简述颅底外面可见的重要孔、裂及其位置", "answerText": "颅底外面可见枕骨大孔、舌下神经管外口、颈静脉孔、颈动脉管外口、茎乳孔、乳突、茎突、枕骨髁及腭大孔等。枕骨大孔位于中央，舌下神经管外口位于枕骨髁附近；颈静脉孔和颈动脉管外口位于颞骨岩部与枕骨交界区域；茎乳孔位于乳突和茎突之间。", "explanation": "本题限定为颅底外面观，应把孔的位置关系写清，避免把棘孔、圆孔等颅底内面结构混入。"}, {"id": "骨学-问答-10", "chapter": "骨学", "type": "问答", "number": 10, "stem": "简述颞下窝的位置、各壁构成及交通", "answerText": "颞下窝位于颧弓下方、上颌骨体和蝶骨翼突后方，是不规则的深部间隙。其上界与颞窝相邻，前方为上颌骨体，内侧为翼突，外侧开放于颧弓深面，后方邻颞骨和茎突。它可经翼上颌裂通翼腭窝，经眶下裂通眶，并与颞窝等相连续。", "explanation": "应按位置、主要边界和交通三部分作答；翼上颌裂和眶下裂是本题的主要交通。"}, {"id": "骨学-问答-11", "chapter": "骨学", "type": "问答", "number": 11, "stem": "简述翼腭窝的位置及交通", "answerText": "翼腭窝位于上颌骨体、蝶骨翼突和腭骨之间。向前经眶下裂通眶，向内经蝶腭孔通鼻腔，向后经圆孔通颅中窝，向外经翼上颌裂通颞下窝，向下经翼腭管和腭大孔通口腔。", "explanation": "至少写出前、内、后、外、下五个方向的交通，体现翼腭窝作为面部深部交通枢纽的特点。"}, {"id": "骨学-问答-12", "chapter": "骨学", "type": "问答", "number": 12, "stem": "简述眶各壁的构成及交通", "answerText": "眶为四壁构成的锥形腔。上壁主要由额骨眶部和蝶骨小翼构成，邻颅前窝；内侧壁由上颌骨额突、泪骨、筛骨眶板和蝶骨体等构成，邻筛窦和鼻腔；下壁主要由上颌骨眶面、颧骨和腭骨构成，后部有眶下裂；外侧壁由蝶骨大翼和颧骨构成，后方有眶上裂。眶尖有视神经管，内侧壁前下方有泪囊窝和鼻泪管。", "explanation": "按四壁逐一写构成、邻接和裂孔/管道，不能只列“上、下、内、外壁”。"}, {"id": "骨学-问答-13", "chapter": "骨学", "type": "问答", "number": 13, "stem": "简述眶的交通", "answerText": "视神经管向后内通颅中窝，视神经和眼动脉通过；眶上裂通颅中窝，动眼、滑车、展神经、眼神经和眼静脉等通过；眶下裂通翼腭窝和颞下窝；眶下沟、眶下管和眶下孔通面部；鼻泪管向下开口于下鼻道；眶内侧壁还与筛窦和鼻腔相邻。", "explanation": "按通向颅腔、翼腭窝/颞下窝、面部和鼻腔四组整理，可完整覆盖眶的主要交通。"}, {"id": "骨学-问答-14", "chapter": "骨学", "type": "问答", "number": 14, "stem": "简述骨性鼻腔外侧壁上的重要结构", "answerText": "骨性鼻腔外侧壁由上、中、下鼻甲及其下方的上、中、下鼻道组成。上鼻道开口于后筛窦，中鼻道有筛漏斗、半月裂和筛泡，额窦、上颌窦及前、中筛窦开口于此；蝶筛隐窝位于上鼻甲后上方，蝶窦开口于此；鼻泪管开口于下鼻道。", "explanation": "鼻甲—鼻道—窦口要对应书写，这是本题的核心结构关系。"}, {"id": "骨学-问答-15", "chapter": "骨学", "type": "问答", "number": 15, "stem": "简述paranasal sinuses的位置和开口", "answerText": "额窦位于额骨内，开口于中鼻道；上颌窦位于上颌骨体内，开口于中鼻道；前、中筛窦位于筛骨迷路内，开口于中鼻道；后筛窦开口于上鼻道；蝶窦位于蝶骨体内，开口于蝶筛隐窝。各鼻旁窦都与鼻腔相通。", "explanation": "按窦名、所在骨和开口部位逐项作答，不能只写“都与鼻腔相通”。"}, {"id": "骨学-问答-16", "chapter": "骨学", "type": "问答", "number": 16, "stem": "简述各cranial fontanelles的位置及闭合时间", "answerText": "前囟位于矢状缝与冠状缝交界处，呈菱形，约在出生后1～2岁闭合；后囟位于矢状缝与人字缝交界处，呈三角形，出生后不久闭合；蝶囟位于额、顶、蝶和颞骨交界处，乳突囟位于顶、颞、枕骨交界处，均在出生后较早闭合。", "explanation": "前、后囟的位置和闭合时间是主干，蝶囟和乳突囟要作为侧囟补充。"}, {"id": "骨学-问答-17", "chapter": "骨学", "type": "问答", "number": 17, "stem": "简述能摸到的颅骨重要骨性标志", "answerText": "可触及的颅骨标志包括眉弓、眶上缘、鼻根、颧弓、乳突、茎突、枕外隆凸、下颌角、下颌头和颞线等。它们可用于体表定位、判断颅骨骨折、定位神经血管和进行局部阻滞。", "explanation": "列举标志后补充临床用途，答案比单纯罗列名称更完整。"}, {"id": "骨学-问答-18", "chapter": "骨学", "type": "问答", "number": 18, "stem": "简述上肢骨的组成及排列位置", "answerText": "上肢骨包括上肢带骨锁骨和肩胛骨，以及自由上肢骨肱骨、桡骨、尺骨和手骨。手骨由8块腕骨、5块掌骨和14块指骨组成；腕骨分近侧列（舟骨、月骨、三角骨、豌豆骨）和远侧列（大多角骨、小多角骨、头状骨、钩骨）。", "explanation": "按上肢带、自由上肢和手骨分层，并写出腕骨两列排列，可覆盖组成和排列位置。"}, {"id": "骨学-问答-19", "chapter": "骨学", "type": "问答", "number": 19, "stem": "简述肱骨下端和尺骨上端的重要结构", "answerText": "肱骨下端外侧有肱骨小头，内侧有肱骨滑车，外侧和内侧分别为外上髁、内上髁；前方有桡窝和冠突窝，后方有鹰嘴窝。尺骨上端有滑车切迹、鹰嘴、冠突和桡切迹，冠突下方有尺骨粗隆。肱骨滑车与尺骨滑车切迹、肱骨小头与桡骨头共同构成肘关节。", "explanation": "先写肱骨下端，再写尺骨上端，最后联系肘关节的关节面和窝。"}, {"id": "骨学-问答-20", "chapter": "骨学", "type": "问答", "number": 20, "stem": "简述能摸到的上肢骨重要体表标志", "answerText": "上肢可触及的骨性标志包括锁骨全长、肩胛冈、肩峰、喙突、肩胛骨下角、肱骨大结节、内上髁和外上髁、鹰嘴、尺骨后缘和尺骨头、桡骨茎突、桡骨头以及豌豆骨。", "explanation": "可按肩带、臂、前臂和手的顺序列举，避免只写肩部标志。"}, {"id": "骨学-问答-21", "chapter": "骨学", "type": "问答", "number": 21, "stem": "简述下肢骨的组成及排列位置", "answerText": "下肢骨包括下肢带骨髋骨和自由下肢骨股骨、髌骨、胫骨、腓骨及足骨。足骨由7块跗骨、5块跖骨和14块趾骨组成；跗骨包括距骨、跟骨、舟骨、骰骨和三块楔骨。", "explanation": "区分下肢带骨与自由下肢骨，并补齐足骨的7—5—14排列和跗骨名称。"}, {"id": "骨学-问答-22", "chapter": "骨学", "type": "问答", "number": 22, "stem": "简述股骨下端和胫骨上端的重要结构", "answerText": "股骨下端有内侧髁、外侧髁、髁间窝、髌面、内上髁和外上髁，内上髁上方有收肌结节。胫骨上端有内侧髁、外侧髁、上关节面、髁间隆起及外侧髁后下方的腓关节面；股骨髁与胫骨上关节面构成膝关节，髌面与髌骨相接。", "explanation": "应把股骨下端与胫骨上端分别列出，再说明它们如何参与膝关节构成。"}, {"id": "骨学-问答-23", "chapter": "骨学", "type": "问答", "number": 23, "stem": "简述能摸到的下肢骨重要体表标志", "answerText": "下肢可触及的骨性标志包括髂嵴、髂前上棘、髂后上棘、坐骨结节、耻骨结节、大转子、髌骨、胫骨粗隆、胫骨前缘、内踝、外踝、腓骨头和跟骨结节。它们可用于定位髋、膝、踝关节、神经血管和穿刺点。", "explanation": "按骨盆、股部、膝部和小腿足部列举，补充体表定位用途。"}, {"id": "骨学-病例分析-1", "chapter": "骨学", "type": "病例分析", "number": 1, "stem": "男性，18岁，头部被钝器击伤后出现头痛、呕吐、躁动，CT显示硬膜外血肿。请分析原因。", "answerText": "最可能为翼点附近骨折，撕裂脑膜中动脉前支，形成硬膜外血肿。翼点由额骨、顶骨、颞骨和蝶骨大翼相交形成，位于颅侧部，内面有脑膜中动脉前支经过，是颅骨较薄弱的部位。受伤后脑膜中动脉破裂，血液积聚在颅骨与硬脑膜之间形成硬膜外血肿；血肿增大导致颅内压升高，所以出现头痛、呕吐、躁动不安等表现。", "explanation": "把临床表现与解剖证据链完整对应：击伤颅侧部→翼点骨折→脑膜中动脉前支受损→血液积聚于颅骨与硬脑膜之间→颅内压升高并出现头痛、呕吐和精神行为改变。"}, {"id": "骨学-病例分析-2", "chapter": "骨学", "type": "病例分析", "number": 2, "stem": "女性，32岁，车祸造成右侧肱骨外科颈骨折。请说明外科颈位置及可能损伤的结构和表现。", "answerText": "①肱骨外科颈位于肱骨上端与骨干交界处，是肱骨骨折的好发部位。②该处骨折可能损伤腋神经及旋肱后动脉。腋神经绕肱骨外科颈后方行走，运动支支配三角肌和小圆肌，感觉支分布于肩部和臂外侧上部的皮肤；旋肱后动脉伴随腋神经绕行外科颈。③腋神经损伤时，三角肌瘫痪，肩部失去圆隆外形而呈“方肩”，肩关节外展障碍（尤其不能完成外展起始后的主要阶段），三角肌区皮肤感觉减退或丧失；同时可有旋肱后动脉损伤所致的局部血供问题。", "explanation": "按指南从骨折部位、邻近神经血管、运动表现和感觉表现四层作答，不能只写“腋神经损伤”。"}, {"id": "关节学-问答-1", "chapter": "关节学", "type": "问答", "number": 1, "stem": "简述骨连结及其分类", "answerText": "骨与骨之间借纤维结缔组织、软骨或骨相连，称为骨连结。按连结方式分直接连结和间接连结。直接连结包括纤维连结、软骨连结和骨性结合，活动范围由小到无；间接连结即滑膜关节，具有较大的活动度。", "explanation": "先给总定义，再按直接/间接两大类展开，并补充活动度和代表性结构。"}, {"id": "关节学-问答-2", "chapter": "关节学", "type": "问答", "number": 2, "stem": "简述滑膜关节的基本结构", "answerText": "滑膜关节的基本结构包括关节面、关节囊和关节腔。关节面表面覆有关节软骨，能减少摩擦、缓冲震荡；关节囊外层为纤维膜，附着于关节周缘并限制过度运动，内层为滑膜，可分泌滑液；关节腔是关节囊内密闭、含少量滑液的间隙。", "explanation": "三项基本结构、关节软骨、关节囊两层和滑液功能都应写出。"}, {"id": "关节学-问答-3", "chapter": "关节学", "type": "问答", "number": 3, "stem": "简述关节的辅助结构", "answerText": "关节辅助结构包括韧带、关节盘、关节唇、滑膜襞和滑膜囊。韧带连接相邻骨、增强稳固并限制过度运动；关节盘为纤维软骨板，可使关节面适合、缓冲并把关节腔分成两部；关节唇为附着于关节窝周缘的纤维软骨环，可加深关节窝；滑膜襞可填充腔隙并调节关节腔；滑膜囊位于肌腱与骨面之间，减少摩擦。", "explanation": "本题要按“结构—位置/形态—作用”配对，不要只列名称。"}, {"id": "关节学-问答-4", "chapter": "关节学", "type": "问答", "number": 4, "stem": "试述旋转运动和环转运动的区别", "answerText": "旋转是骨绕一个垂直轴转动，可分旋内和旋外；前臂还可绕纵轴作旋前、旋后。环转是屈、伸、收、展依次连续组合，骨的近端相对固定、远端作圆周运动，整个肢体运动轨迹呈圆锥形。", "explanation": "写清运动轴、运动组合和轨迹，才能区分旋转与环转。"}, {"id": "关节学-问答-5", "chapter": "关节学", "type": "问答", "number": 5, "stem": "试述椎体间连结结构的名称、位置和作用", "answerText": "椎体间连结包括椎间盘、前纵韧带和后纵韧带。椎间盘位于相邻椎体之间，由外周纤维环和中央髓核组成，承受压力、缓冲震荡并允许脊柱活动；前纵韧带位于椎体和椎间盘前面，上至枕骨大孔前缘附近，下达骶骨，限制脊柱过度后伸；后纵韧带位于椎体和椎间盘后面，限制过度前屈并防止髓核向后突出。", "explanation": "结构、位置和作用要分开写，尤其不能漏掉椎间盘的纤维环和髓核。"}, {"id": "关节学-问答-6", "chapter": "关节学", "type": "问答", "number": 6, "stem": "试述椎弓间的连结", "answerText": "椎弓间连结包括黄韧带、棘间韧带、棘上韧带、横突间韧带和关节突关节。黄韧带连接相邻椎弓板，由弹性纤维构成，参与椎管后壁并限制过度前屈；棘间、棘上和横突间韧带分别连接相邻棘突、棘突尖和横突，限制脊柱过度活动；关节突关节由相邻椎骨的上、下关节突构成。", "explanation": "指南不仅列出黄韧带，还包括各突起间韧带和关节突关节，答案应完整覆盖。"}, {"id": "关节学-问答-7", "chapter": "关节学", "type": "问答", "number": 7, "stem": "试述寰枢关节的组成和运动", "answerText": "寰枢关节包括三个关节：两侧寰椎侧块下关节面与枢椎上关节面构成寰枢外侧关节；枢椎齿突与寰椎前弓后面的齿突凹构成寰枢正中关节，齿突后方由寰椎横韧带固定。该关节以齿突为轴作旋转，是头部左右旋转的主要关节。", "explanation": "要写两个外侧关节、一个正中关节以及齿突—横韧带关系。"}, {"id": "关节学-问答-8", "chapter": "关节学", "type": "问答", "number": 8, "stem": "试述脊柱的组成、生理弯曲和运动", "answerText": "脊柱由24块椎骨、1块骶骨和1块尾骨借椎间盘、韧带和关节连结而成。成人脊柱有颈曲、胸曲、腰曲和骶曲，颈曲和腰曲凸向前，胸曲和骶曲凸向后；生理弯曲可增加弹性、缓冲震荡并维持重心。脊柱可作前屈、后伸、侧屈、旋转和环转，各段活动范围不同。", "explanation": "组成、四个生理弯曲、弯曲意义和运动类型四部分都要写。"}, {"id": "关节学-问答-9", "chapter": "关节学", "type": "问答", "number": 9, "stem": "简述胸廓的围成、形态特点及运动", "answerText": "胸廓由12个胸椎、12对肋、胸骨及其连结围成，近似圆锥形，上口小、下口大，有前壁、后壁和两侧壁。胸廓上口由第1胸椎、第1肋和胸骨柄上缘围成；下口由第12胸椎、第11、12对肋、肋弓和剑突围成。吸气时膈收缩下降、肋骨上提外展，胸廓前后径和横径增大；呼气时作相反运动。", "explanation": "指南同时要求围成、形态和运动，不能只写“参与呼吸”。"}, {"id": "关节学-问答-10", "chapter": "关节学", "type": "问答", "number": 10, "stem": "试述颞下颌关节的组成、结构特点、运动和临床意义", "answerText": "颞下颌关节由下颌头、颞骨下颌窝和关节结节构成，关节面覆纤维软骨，关节囊较松，囊内有纤维软骨关节盘，把关节腔分成上、下两部。可作开口、闭口、前伸、后退和侧方运动；关节囊前壁较薄，张口过度时下颌头可越过关节结节向前脱位。", "explanation": "关节盘的分隔作用、运动方向和前方脱位的临床意义必须写全。"}, {"id": "关节学-问答-11", "chapter": "关节学", "type": "问答", "number": 11, "stem": "试述胸锁关节的组成、结构特点和运动", "answerText": "胸锁关节是上肢骨与躯干骨连接的唯一直接关节，由锁骨胸骨端、胸骨柄锁切迹和第1肋软骨上面构成，关节面覆纤维软骨，囊内有纤维软骨关节盘，关节囊和韧带较强。可作锁骨抬高、下降、前移、后移和旋转。", "explanation": "写出组成、关节盘、稳定性和多方向运动，并指出其“唯一直接关节”的意义。"}, {"id": "关节学-问答-12", "chapter": "关节学", "type": "问答", "number": 12, "stem": "简述肩关节基本结构的形态特点及运动", "answerText": "肩关节由肱骨头和肩胛骨关节盂构成，是典型球窝关节。肱骨头大而圆，关节盂浅，盂周有关节唇使其略加深；关节囊薄而松，上、前、后方有韧带和肌腱加强，下壁最薄弱，因此肩关节活动范围大但易脱位。可作屈、伸、收、展、旋内、旋外和环转。", "explanation": "“球大盂浅、囊松、下壁薄”要和活动范围大、易脱位联系起来。"}, {"id": "关节学-问答-13", "chapter": "关节学", "type": "问答", "number": 13, "stem": "试述拇指腕掌关节的组成和运动", "answerText": "拇指腕掌关节由大多角骨与第1掌骨底构成，是典型鞍状关节。可作屈、伸、收、展、环转、旋外和对掌；对掌时拇指向掌心移动，拇指尖可与其他手指尖的掌侧相接，是人类握持和精细操作所必需的动作。", "explanation": "组成、鞍状形态、一般运动和对掌的定义及功能都要写出。"}, {"id": "关节学-问答-14", "chapter": "关节学", "type": "问答", "number": 14, "stem": "试述骨盆的围成及功能意义", "answerText": "骨盆由骶骨、尾骨和两侧髋骨借骶髂关节、耻骨联合及韧带连结而成，分为大骨盆和小骨盆。骨盆上承脊柱、下接下肢，传递体重，保护盆腔脏器；女性小骨盆还构成产道。", "explanation": "围成、分部和承重/保护/产道功能三点齐全。"}, {"id": "关节学-问答-15", "chapter": "关节学", "type": "问答", "number": 15, "stem": "简述男、女性骨盆的性别差异", "answerText": "男性骨盆骨质较厚重、狭长，骨盆入口近心形，耻骨下角较小，骶骨长而弯，骨盆腔和下口较窄；女性骨盆宽而短，骨质较薄，入口近圆形，耻骨下角较大，骶骨短而平，骨盆腔和下口较宽。", "explanation": "用入口、下角、骶骨、骨盆腔和骨质五个方面作比较，符合指南的完整要点。"}, {"id": "关节学-问答-16", "chapter": "关节学", "type": "问答", "number": 16, "stem": "试述膝关节的辅助结构及其功能", "answerText": "膝关节的囊外辅助结构有髌韧带、胫侧副韧带、腓侧副韧带和斜韧带，能加强关节囊并限制过度运动；囊内有前、后交叉韧带，分别限制胫骨前、后移位；内、外侧半月板位于股骨髁和胫骨髁之间，使关节面适合、增加稳定、缓冲压力和吸收震荡；滑膜襞和滑膜囊可填充腔隙并减少摩擦，髌上囊是最大的滑膜囊。", "explanation": "膝关节辅助结构很多，应分囊外韧带、囊内韧带、半月板和滑膜结构作答。"}, {"id": "关节学-问答-17", "chapter": "关节学", "type": "问答", "number": 17, "stem": "试述踝关节的组成及其周围主要韧带", "answerText": "踝关节又称距小腿关节，由胫骨下端、腓骨下端和距骨滑车构成。关节囊前后壁薄而松，两侧有韧带加强；内侧为坚强的三角韧带，起自内踝，止于距骨、舟骨和跟骨；外侧有距腓前、跟腓和距腓后韧带，较薄弱，因此踝关节在跖屈位易发生内翻扭伤。", "explanation": "组成、关节囊、内外侧韧带和常见损伤方向要全部写出。"}, {"id": "关节学-病例分析-1", "chapter": "关节学", "type": "病例分析", "number": 1, "stem": "男性，20岁，踢足球扭伤膝盖，内侧压痛，强力过伸或过屈疼痛，挤压试验阳性。最可能损伤什么结构？", "answerText": "最可能损伤内侧半月板。膝关节腔内，股骨内、外侧髁与胫骨内、外侧髁相对的关节面之间各有一块纤维软骨板，分别称内侧半月板和外侧半月板。内侧半月板较大，呈C形，与关节囊及胫侧副韧带紧密相连，活动度较小；外侧半月板较小，近似O形，活动度较大。半月板外缘厚、内缘薄而游离，上面凹陷，分别与股骨髁和胫骨髁的关节面相适应。半月板可加深关节面、增强膝关节稳定性，并缓冲压力、吸收震荡，起弹性垫作用。病例中的膝关节内侧压痛、强力过伸或过屈疼痛明显及挤压试验阳性，支持内侧半月板损伤。", "explanation": "症状定位在膝关节内侧，挤压和过伸/过屈使半月板受压，结合内侧半月板较大、呈C形且与关节囊和胫侧副韧带紧密相连、活动度小，因此更易在扭转和挤压中撕裂。"}, {"id": "关节学-病例分析-2", "chapter": "关节学", "type": "病例分析", "number": 2, "stem": "女性，38岁，下楼踩空后踝痛、肿胀、不能行走，初诊为距小腿关节损伤。请简述组成、特点、运动及相关肌肉和神经。", "answerText": "距小腿关节（踝关节）由胫骨下端、腓骨下端和距骨滑车组成。关节囊前、后壁薄而松弛，两侧有韧带加强；内侧韧带又称三角韧带，坚强，起自内踝，呈三角形向下扇形展开，止于距骨、舟骨和跟骨；外侧有三条较薄弱的独立韧带，前方为距腓前韧带，中间为跟腓韧带，后方为距腓后韧带，均起自外踝，分别止于距骨或跟骨。外侧韧带较弱，踝关节常在跖屈位发生内翻扭伤。运动及神经支配如下：背屈由胫骨前肌、拇长伸肌、趾长伸肌完成，主要由腓深神经支配；跖屈由小腿三头肌、趾长屈肌、胫骨后肌和拇长屈肌完成，主要由胫神经支配；内翻由胫骨前肌（腓深神经）和胫骨后肌（胫神经）完成；外翻由腓骨长肌、腓骨短肌（腓浅神经）和第三腓骨肌（腓深神经）完成。", "explanation": "完整覆盖组成、关节囊和内外侧韧带、常见内翻损伤机制，以及背屈、跖屈、内翻、外翻各自的主要肌群和神经支配。"}, {"id": "肌学-问答-1", "chapter": "肌学", "type": "问答", "number": 1, "stem": "试述骨骼肌的形态分类及各类肌的作用特点和分布", "answerText": "骨骼肌按形态分长肌、短肌、扁肌和轮匝肌。长肌呈梭形或带形，收缩幅度大，主要分布于四肢；短肌收缩幅度小，多位于躯干深层、参与稳定；扁肌宽而薄，腱膜发达，多构成躯干壁；轮匝肌环绕孔裂，收缩可关闭孔裂。", "explanation": "分类、形态、作用特点和分布必须一一对应。"}, {"id": "肌学-问答-2", "chapter": "肌学", "type": "问答", "number": 2, "stem": "简述骨骼肌的辅助装置及其作用", "answerText": "骨骼肌辅助装置包括筋膜、滑膜囊和腱鞘。浅筋膜位于皮下，深筋膜包被、分隔并固定肌群；深筋膜增厚可形成支持带或纤维性腱鞘；滑膜囊位于肌腱与骨面之间，减少摩擦；腱鞘由纤维层和滑膜层构成，约束肌腱并使其顺畅滑动。", "explanation": "指南中的辅助装置不只包括名称，还要写筋膜的包被分隔、滑膜囊的减摩和腱鞘的约束滑动。"}, {"id": "肌学-问答-3", "chapter": "肌学", "type": "问答", "number": 3, "stem": "简述主要面肌及其作用", "answerText": "主要面肌有枕额肌、眼轮匝肌、口轮匝肌、颊肌和鼻肌。枕额肌提眉、形成额部皱纹；眼轮匝肌闭合眼裂；口轮匝肌闭合口裂并参与唇的运动；颊肌压迫面颊、使食物保持在牙列之间并协助吹气和咀嚼；鼻肌可调节鼻孔。", "explanation": "按面部区域和作用列举代表面肌，至少覆盖眼裂、口裂、面颊和鼻孔。"}, {"id": "肌学-问答-4", "chapter": "肌学", "type": "问答", "number": 4, "stem": "试述参加咀嚼运动的骨骼肌及其作用", "answerText": "咬肌、颞肌和翼内肌收缩可上提下颌；翼外肌双侧收缩使下颌前移并协助张口，单侧收缩使下颌向对侧移动；颊肌压迫面颊，使食物保持在牙列之间并协助咀嚼。", "explanation": "要区分上提、前移、张口、侧方运动和颊肌辅助作用。"}, {"id": "肌学-问答-5", "chapter": "肌学", "type": "问答", "number": 5, "stem": "试述胸锁乳突肌的位置、起止和作用", "answerText": "胸锁乳突肌位于颈部两侧，起部有胸骨头和锁骨头，分别起于胸骨柄前面和锁骨胸骨端，合成后止于颞骨乳突和枕骨上项线。一侧收缩使头向同侧侧屈并转向对侧；两侧同时收缩使头后仰，并可在头固定时协助吸气。", "explanation": "位置、两头起点、止点以及单侧/双侧作用均要写。"}, {"id": "肌学-问答-6", "chapter": "肌学", "type": "问答", "number": 6, "stem": "简述前、中、后斜角肌的位置及作用", "answerText": "前、中、后斜角肌位于颈深部，起自第3～6颈椎横突；前、中斜角肌止于第1肋，后斜角肌止于第2肋。共同作用是使颈部侧屈并提肋助吸气；前、中斜角肌与第1肋围成斜角肌间隙，锁骨下动脉和臂丛通过，膈神经行于前斜角肌前面。", "explanation": "除位置和作用外，补充斜角肌间隙及其通过结构。"}, {"id": "肌学-问答-7", "chapter": "肌学", "type": "问答", "number": 7, "stem": "试述斜方肌的位置、起止和作用", "answerText": "斜方肌位于颈部和背上部浅层，起于上项线、枕外隆凸、项韧带以及全部颈椎和胸椎棘突，止于锁骨外侧1/3、肩峰和肩胛冈。上部肌束提肩胛骨，中部肌束使肩胛骨靠近脊柱，下部肌束降肩胛骨；上下部协同可使肩胛骨旋转。", "explanation": "起止要完整，作用按上、中、下部肌束分区说明。"}, {"id": "肌学-问答-8", "chapter": "肌学", "type": "问答", "number": 8, "stem": "简述竖脊肌的位置及其作用", "answerText": "竖脊肌位于脊柱两侧的肌沟内，由髂肋肌、最长肌和棘肌组成，是背肌中最长、最强的一组。双侧收缩使脊柱后伸、维持直立；单侧收缩使脊柱向同侧侧屈，并可协助维持脊柱稳定。", "explanation": "补出三部分组成以及单侧、双侧作用。"}, {"id": "肌学-问答-9", "chapter": "肌学", "type": "问答", "number": 9, "stem": "简述竖脊肌的筋膜构成和附着", "answerText": "竖脊肌被胸腰筋膜包被。胸腰筋膜在腰部增厚，分浅、中、深三层：浅层位于竖脊肌浅面，内侧附于棘上韧带、外侧附于肋角；中层位于竖脊肌和腰方肌之间；深层覆盖腰方肌前面。浅、中层在外侧会合形成肌间隔，并与腹内斜肌、腹横肌腱膜相连续。", "explanation": "指南强调胸腰筋膜三层、附着和分隔竖脊肌/腰方肌的关系。"}, {"id": "肌学-问答-10", "chapter": "肌学", "type": "问答", "number": 10, "stem": "试述胸大肌的位置、起止和作用", "answerText": "胸大肌位于胸前壁浅层，起部包括锁骨部、胸肋部和腹部，分别起于锁骨内侧半、胸骨和第1～6肋软骨及腹直肌鞘前层，止于肱骨大结节嵴。可使肩关节内收、旋内和前屈；锁骨部可屈肩，胸肋部可伸肩过度前屈位；上肢固定时可协助吸气。", "explanation": "起点分部、止点和不同部位的运动作用都要写。"}, {"id": "肌学-问答-11", "chapter": "肌学", "type": "问答", "number": 11, "stem": "简述参与呼吸的主要骨骼肌及其作用", "answerText": "吸气肌主要是膈和肋间外肌，膈收缩下降、肋间外肌提肋，使胸腔上下径和横径增大；辅助吸气肌包括胸锁乳突肌、斜角肌等。平静呼气主要依靠肌肉松弛，深呼气时肋间内肌、肋间最内肌、胸横肌和腹肌收缩使肋骨下降、膈上升，胸腔容积减小。", "explanation": "按吸气、辅助吸气和呼气分组，写出胸腔容积变化。"}, {"id": "肌学-问答-12", "chapter": "肌学", "type": "问答", "number": 12, "stem": "试述膈的位置和形态", "answerText": "膈位于胸腔和腹腔之间，构成胸腔底和腹腔顶，是穹隆形的扁肌。周围为肌性部，中央为中心腱；肌性部按起点分胸骨部、肋部和腰部。膈是主要吸气肌，收缩时穹隆下降、胸腔容积增大，舒张时恢复穹隆形。", "explanation": "位置、穹隆形态、肌性部/中心腱和呼吸作用要完整。"}, {"id": "肌学-问答-13", "chapter": "肌学", "type": "问答", "number": 13, "stem": "试述膈的三个裂孔的位置", "answerText": "主动脉裂孔约平第12胸椎，位于两膈脚之间，内有主动脉和胸导管通过；食管裂孔约平第10胸椎，位于膈右脚肌束内，内有食管和迷走神经通过；腔静脉孔约平第8胸椎，位于中心腱内，内有下腔静脉通过。", "explanation": "用“由上到下/第8、10、12胸椎—结构—通过内容”记忆。"}, {"id": "肌学-问答-14", "chapter": "肌学", "type": "问答", "number": 14, "stem": "试述腹前壁肌的位置及形态结构", "answerText": "腹前壁主要为腹直肌，位于腹前壁正中线两侧，呈带形，上宽下窄，起于耻骨联合和耻骨嵴，止于剑突和第5～7肋软骨。肌腹有3～4条腱划，外包腹直肌鞘；腹直肌收缩可使脊柱前屈、压缩腹腔并协助呼气。", "explanation": "指南要求位置、形态、腱划、腹直肌鞘和主要作用。"}, {"id": "肌学-问答-15", "chapter": "肌学", "type": "问答", "number": 15, "stem": "试述腹侧壁肌的位置、层次及形态结构", "answerText": "腹侧壁肌由浅入深为腹外斜肌、腹内斜肌和腹横肌。腹外斜肌肌纤维由外上斜向内下，腱膜形成腹股沟韧带和腹直肌鞘前层；腹内斜肌纤维大致向内上，腱膜参与腹直肌鞘；腹横肌纤维横行，腱膜参与腹直肌鞘后层和腹白线。三肌腱膜共同构成腹白线，下部肌束还参与提睾肌和腹股沟管构成。", "explanation": "层次、纤维方向、腱膜去向和腹股沟管关系都应写出。"}, {"id": "肌学-问答-16", "chapter": "肌学", "type": "问答", "number": 16, "stem": "试述腹直肌鞘的构成", "answerText": "腹直肌鞘由腹外斜肌腱膜、腹内斜肌腱膜和腹横肌腱膜构成。弓状线以上，腹内斜肌腱膜分前、后两层，分别与腹外斜肌腱膜和腹横肌腱膜共同包裹腹直肌；弓状线以下三层腱膜均转至腹直肌前方，后方仅有腹横筋膜。鞘内还有腹直肌、锥状肌和腹壁血管神经。", "explanation": "说明弓状线上下前后层差异，是本题最容易漏掉的得分点。"}, {"id": "肌学-问答-17", "chapter": "肌学", "type": "问答", "number": 17, "stem": "试述腹股沟管的位置、四壁和两口", "answerText": "腹股沟管位于腹股沟韧带内侧半的上方，长约4～5 cm，男性内有精索，女性内有子宫圆韧带。前壁主要为腹外斜肌腱膜，外侧部有腹内斜肌肌纤维加强；后壁为腹横筋膜，内侧部有联合腱加强；上壁为腹内斜肌和腹横肌形成的弓状下缘；下壁为腹股沟韧带形成的凹槽。内口为腹股沟深环，位于腹壁下动脉外侧；外口为腹股沟浅环，位于耻骨结节外上方的腹外斜肌腱膜裂孔。", "explanation": "四壁、两口、内容物、深环与腹壁下动脉的关系要全部写出。"}, {"id": "肌学-问答-18", "chapter": "肌学", "type": "问答", "number": 18, "stem": "试述腹股沟三角的位置及临床意义", "answerText": "腹股沟三角（Hesselbach三角）由腹直肌外侧缘、腹股沟韧带内侧半和腹壁下动脉围成，是腹前壁下部的薄弱区。腹腔内容物从腹壁下动脉内侧经三角突出形成腹股沟直疝；从腹壁下动脉外侧经深环进入腹股沟管形成腹股沟斜疝。", "explanation": "位置边界和直疝/斜疝的解剖鉴别必须同时出现。"}, {"id": "肌学-问答-19", "chapter": "肌学", "type": "问答", "number": 19, "stem": "试述上肢肌的配布特点及其作用", "answerText": "上肢肌分上肢带肌、臂肌、前臂肌和手肌。上肢带肌运动肩胛骨和肩关节；臂肌前群主要屈肘，后群主要伸肘；前臂前群位于前面，主要屈腕、屈指和旋前，后群主要伸腕、伸指和旋后；手肌位于掌侧和背侧，完成拇指对掌及手指的精细运动。", "explanation": "按上肢带、臂、前臂、手四个部位分别写分群和作用。"}, {"id": "肌学-问答-20", "chapter": "肌学", "type": "问答", "number": 20, "stem": "试述三角肌的位置、起止及作用", "answerText": "三角肌覆盖肩关节，起于锁骨外侧1/3、肩峰和肩胛冈，止于肱骨三角肌粗隆。前部肌束使肩关节屈曲和旋内，中部肌束外展肩关节，后部肌束使肩关节伸展和旋外；三角肌麻痹可出现方肩和外展障碍。", "explanation": "起止、三束作用和外科临床联系均要写。"}, {"id": "肌学-问答-21", "chapter": "肌学", "type": "问答", "number": 21, "stem": "试述肱二头肌的位置、起止和作用", "answerText": "肱二头肌位于臂前群，有长、短两个头。长头起于肩胛骨盂上结节，腱穿过肩关节囊和结节间沟；短头起于喙突。两头合成肌腹，止于桡骨粗隆和前臂筋膜。可屈肘、屈肩并使前臂旋后，当前臂旋后时屈肘力量最大。", "explanation": "补充长头穿过肩关节囊和桡骨粗隆止点，并写三项作用。"}, {"id": "肌学-问答-22", "chapter": "肌学", "type": "问答", "number": 22, "stem": "试述肱三头肌的位置、起止和作用", "answerText": "肱三头肌位于臂后群。长头起于肩胛骨盂下结节，外侧头起于桡神经沟外上方肱骨后面，内侧头起于桡神经沟下方肱骨后面；三头合成肌腹，经肘关节后方止于尺骨鹰嘴。主要伸肘，长头还可使肩关节后伸和内收。", "explanation": "三头起点、鹰嘴止点和长头跨越肩关节的作用要写。"}, {"id": "肌学-问答-23", "chapter": "肌学", "type": "问答", "number": 23, "stem": "简述参与肩关节屈、伸运动的骨骼肌", "answerText": "屈肩主要有三角肌前部、胸大肌锁骨部、喙肱肌和肱二头肌；伸肩主要有三角肌后部、背阔肌、大圆肌和肱三头肌长头，胸大肌胸肋部在肩关节由屈曲位回到中立位时也可参与伸展。", "explanation": "按屈肩和伸肩两组列出主要肌，并注明跨越肩关节的肌束。"}, {"id": "肌学-问答-24", "chapter": "肌学", "type": "问答", "number": 24, "stem": "试述前臂前群肌的层次和各肌位置", "answerText": "前臂前群肌由浅至深可分四层。第一层由肱桡肌、旋前圆肌、桡侧腕屈肌、掌长肌和尺侧腕屈肌等组成；第二层为指浅屈肌；第三层为拇长屈肌和指深屈肌；第四层为旋前方肌。它们总体位于前臂前面，主要完成屈腕、屈指和旋前。", "explanation": "指南要求层次和各层代表肌，不能只写“屈肌群”。"}, {"id": "肌学-问答-25", "chapter": "肌学", "type": "问答", "number": 25, "stem": "简述使肘屈伸和前臂旋前、旋后的骨骼肌", "answerText": "屈肘肌包括肱二头肌、肱肌、肱桡肌、旋前圆肌和桡侧腕屈肌；伸肘肌主要为肱三头肌和肘肌；旋前肌为旋前圆肌和旋前方肌；旋后肌为旋后肌和肱二头肌。", "explanation": "按屈肘、伸肘、旋前、旋后四组列举，并区分主要肌和辅助肌。"}, {"id": "肌学-问答-26", "chapter": "肌学", "type": "问答", "number": 26, "stem": "试述腋窝的位置及各壁构成", "answerText": "腋窝位于肩关节下方、胸壁外侧和上臂上端之间，呈锥体形，有尖、底和四壁。前壁由胸大肌、胸小肌及锁胸筋膜构成；后壁由肩胛下肌、大圆肌、背阔肌构成；内侧壁为上位肋骨和胸壁；外侧壁为肱骨结节间沟及邻近肌。尖端通颈部，底由腋筋膜和皮肤封闭，腋动静脉、臂丛及淋巴结位于其中。", "explanation": "位置、尖/底和前后内外四壁要写，内容物可作为完整答案的补充。"}, {"id": "肌学-问答-27", "chapter": "肌学", "type": "问答", "number": 27, "stem": "试述三边孔和四边孔的围成", "answerText": "三边孔位于肩胛下肌、大圆肌和肱三头肌长头之间，旋肩胛动脉通过；四边孔位于小圆肌、大圆肌、肱三头肌长头和肱骨外科颈之间，腋神经和旋肱后动脉通过。", "explanation": "边界和通过结构必须一一对应，尤其不能漏写腋神经。"}, {"id": "肌学-问答-28", "chapter": "肌学", "type": "问答", "number": 28, "stem": "试述下肢肌的配布特点及其作用", "answerText": "下肢肌可分髋肌、大腿肌、小腿肌和足肌，较上肢粗壮，主要承担维持直立、支持体重和行走。大腿前群屈髋、伸膝，后群伸髋、屈膝，内侧群内收髋；小腿前群伸踝（背屈）并内翻，后群屈踝（跖屈）并可屈膝，外侧群屈踝并外翻；足肌维持足弓并参与足趾运动。", "explanation": "先总述下肢肌功能，再按髋、大腿、小腿、足分组。"}, {"id": "肌学-问答-29", "chapter": "肌学", "type": "问答", "number": 29, "stem": "简述髂腰肌的起止及作用", "answerText": "髂腰肌由髂肌和腰大肌组成。髂肌起于髂窝，腰大肌起于腰椎体侧面和横突，两部分会合后经腹股沟韧带深方、髋关节前方，止于股骨小转子。可屈髋并旋外；下肢固定时可使躯干和骨盆前屈。", "explanation": "起点要分髂肌和腰大肌，止点和屈髋/旋外作用不能漏。"}, {"id": "肌学-问答-30", "chapter": "肌学", "type": "问答", "number": 30, "stem": "试述臀大肌的位置、起止和作用", "answerText": "臀大肌位于臀部浅层，起于髂骨翼外面、骶骨和尾骨背面及骶结节韧带，止于股骨臀肌粗隆和髂胫束。可伸髋、旋外并稳定髋关节；下肢固定时可使躯干后伸，维持直立和上楼、起立等动作。", "explanation": "指南强调起点广泛、髂胫束附着和维持直立的作用。"}, {"id": "肌学-问答-31", "chapter": "肌学", "type": "问答", "number": 31, "stem": "简述髋关节的骨骼肌", "answerText": "屈髋肌有髂腰肌、阔筋膜张肌、缝匠肌和股直肌；伸髋肌有臀大肌和大腿后群；外展肌有臀中肌、臀小肌和阔筋膜张肌；内收肌有长、短、大收肌、耻骨肌和股薄肌；旋内主要为臀中、小肌前部，旋外有髂腰肌、臀大肌、臀中小肌后部、梨状肌、闭孔内外肌、股方肌和大腿内侧肌群。", "explanation": "按屈、伸、外展、内收、旋内、旋外六组作答，覆盖指南列举的主要肌。"}, {"id": "肌学-问答-32", "chapter": "肌学", "type": "问答", "number": 32, "stem": "试述大腿内侧肌群的层次和作用", "answerText": "大腿内侧肌群分三层：浅层由耻骨肌、长收肌和股薄肌组成，中层为短收肌，深层为大收肌。它们共同内收髋关节，部分肌还可协助髋关节旋外和屈曲。", "explanation": "层次顺序和内收/旋外作用要写清。"}, {"id": "肌学-问答-33", "chapter": "肌学", "type": "问答", "number": 33, "stem": "试述小腿三头肌的位置、起止和作用", "answerText": "小腿三头肌位于小腿后面，由浅层腓肠肌和深层比目鱼肌组成。腓肠肌两个头分别起于股骨内、外侧髁后面，比目鱼肌起于胫骨和腓骨上端后面；三头合成跟腱，止于跟骨结节。可跖屈踝关节，腓肠肌还可屈膝；站立时可固定踝、膝关节，防止身体前倾。", "explanation": "组成、起止、跟腱和跖屈/屈膝/维持站立作用都要写。"}, {"id": "肌学-问答-34", "chapter": "肌学", "type": "问答", "number": 34, "stem": "简述使膝关节屈、伸、旋内和旋外的骨骼肌", "answerText": "屈膝肌包括股二头肌、半腱肌、半膜肌、缝匠肌、腘肌和腓肠肌；伸膝主要是股四头肌；旋内肌包括半腱肌、半膜肌、缝匠肌、腘肌和腓肠肌内侧头；旋外主要是股二头肌。", "explanation": "按屈、伸、旋内、旋外四组列举并标出主要肌。"}, {"id": "肌学-问答-35", "chapter": "肌学", "type": "问答", "number": 35, "stem": "试述胫骨前肌的起止和作用", "answerText": "胫骨前肌起于胫骨外侧面和骨间膜，肌腱经踝关节前方绕至内侧，止于内侧楔骨和第1跖骨底。收缩时背屈踝关节并使足内翻，同时维持足弓。", "explanation": "起点、绕踝走行、止点和两项作用完整对应。"}, {"id": "肌学-问答-36", "chapter": "肌学", "type": "问答", "number": 36, "stem": "试述胫骨后肌的起止和作用", "answerText": "胫骨后肌起于胫、腓骨后面及骨间膜，肌腱经内踝后方转向前下方，止于足舟骨粗隆，并分支止于楔骨、骰骨和第2～4跖骨底等。收缩时跖屈踝关节、内翻足并支持足弓。", "explanation": "补充经内踝后方的走行和足弓支持作用。"}, {"id": "肌学-问答-37", "chapter": "肌学", "type": "问答", "number": 37, "stem": "简述距小腿关节的组成、运动相关肌及神经支配", "answerText": "距小腿关节由胫、腓骨下端和距骨滑车组成。背屈由胫骨前肌、趾长伸肌和拇长伸肌（腓深神经）完成；跖屈由小腿三头肌、趾长屈肌、胫骨后肌和拇长屈肌（胫神经）完成；内翻由胫骨前肌（腓深神经）和胫骨后肌（胫神经）完成；外翻由腓骨长、短肌（腓浅神经）和第三腓骨肌（腓深神经）完成。", "explanation": "按组成、运动、肌肉和神经四层对应作答。"}, {"id": "肌学-问答-38", "chapter": "肌学", "type": "问答", "number": 38, "stem": "简述髂胫束及其形态特点", "answerText": "髂胫束是阔筋膜外侧部因阔筋膜张肌和臀大肌腱纤维加强形成的厚而坚韧的扁带，向下止于胫骨外侧髁。它可约束大腿外侧肌群并稳定髋、膝关节。", "explanation": "指出它是阔筋膜增厚部，并写加强来源、止点和稳定作用。"}, {"id": "肌学-问答-39", "chapter": "肌学", "type": "问答", "number": 39, "stem": "试述收肌管的位置、构成及内容物", "answerText": "收肌管位于大腿中部、缝匠肌深面，前壁为收肌腱板，后壁为大收肌，外侧壁为股内侧肌。上口接股三角尖，下口为收肌腱裂孔，通向腘窝；管内有股动脉、股静脉和隐神经通过。", "explanation": "位置、三壁、上下口和内容物要全部列出。"}, {"id": "肌学-问答-40", "chapter": "肌学", "type": "问答", "number": 40, "stem": "试述踝关节周围的支持带", "answerText": "小腿深筋膜在踝部增厚形成支持带：踝前有伸肌上、下支持带，内踝后方有屈肌支持带，外踝后方有腓骨上、下支持带。它们分别约束经过踝关节前方、内踝后方和外踝后方的肌腱，防止肌腱滑脱并维持肌腱的运动方向。", "explanation": "按踝前、内踝后、外踝后三个位置分组，写出约束肌腱的作用。"}, {"id": "肌学-病例分析-1", "chapter": "肌学", "type": "病例分析", "number": 1, "stem": "男孩，6岁，剧烈运动后在腹股沟附近发现肿块，休息一晚后自行消失。可能患哪些疾病？涉及什么结构？如何鉴别？", "answerText": "该患儿可能患有腹股沟直疝或腹股沟斜疝。腹股沟三角（Hesselbach三角）由腹壁下动脉、腹直肌外侧缘和腹股沟韧带内侧半围成。腹股沟管位于腹股沟韧带内侧半的上方，是腹前壁下部肌和腱膜之间的潜在裂隙；男性长约4～5 cm，内有精索，女性内有子宫圆韧带。腹股沟管有前、后、上、下四壁和内、外两个口。前壁浅层为腹外斜肌腱膜，外侧约1/3处有腹内斜肌起自腹股沟韧带的肌纤维加强；后壁为腹横筋膜，内侧约1/3处有发育程度不一的联合腱加强；上壁为腹内斜肌和腹横肌形成的弓状下缘；下壁为腹股沟韧带形成的凹槽。内口为腹股沟深环，位于腹股沟韧带中点上方约一横指、腹壁下动脉外侧，是腹横筋膜向外突形成的卵圆形孔；外口为腹股沟浅环，是腹外斜肌腱膜在耻骨结节外上方形成的三角形裂孔。疝是器官或结构经先天或后天形成的裂口、薄弱区脱离原来生理位置。腹股沟疝多发生在腹股沟韧带上方，常见内容物为肠管或大网膜。斜疝从腹壁下动脉外侧经深环进入腹股沟管，可通过全程进入阴囊，疝囊位于精索两层被膜内；直疝从腹壁下动脉内侧、腹股沟管后壁突出，经腹股沟三角而出，不经过深环，疝囊位于精索被膜之外。剧烈运动后出现、休息后自行消失，提示疝内容物可回纳；可结合肿块与腹壁下动脉的关系、是否进入阴囊及指压深环试验进行鉴别。", "explanation": "先用“运动后出现、休息后消失”判断可回纳的腹股沟疝，再完整说明腹股沟三角、腹股沟管四壁和两口，最后以腹壁下动脉位置、是否经过深环和是否进入阴囊区分斜疝与直疝。"}];const state={type:'全部',chapter:'全部',q:''};const grid=document.querySelector('#grid');const typeBtns=[...document.querySelectorAll('[data-type]')];const chapter=document.querySelector('#chapter');const search=document.querySelector('#search');const count=document.querySelector('#count');
const chapters=['全部',...new Set(DATA.map(x=>x.chapter))];chapter.innerHTML=chapters.map(x=>`<option>${x}</option>`).join('');
function letter(i){return String.fromCharCode(65+i)}
function render(){let arr=DATA.filter(x=>(state.type==='全部'||x.type===state.type)&&(state.chapter==='全部'||x.chapter===state.chapter)&&(!state.q||x.stem.includes(state.q)||((x.answerText||'').includes(state.q))));count.textContent=`显示 ${arr.length} / ${DATA.length} 题`;
if(!arr.length){grid.innerHTML='<div class="empty">没有匹配题目，请调整筛选条件。</div>';return}
grid.innerHTML=arr.map((x,idx)=>{if(x.options){return `<article class="item" data-id="${x.id}"><div class="meta"><span class="pill">${x.type}</span><span>${x.chapter} · 原题 ${x.number}</span></div><h2>${idx+1}. ${x.stem}</h2><div class="options">${x.options.map((o,i)=>`<button class="opt" data-i="${i}"><span class="letter">${letter(i)}.</span><span>${o}</span></button>`).join('')}</div><div class="feedback"><strong></strong><span></span><div class="source">参考答案：${letter(x.answer)} · ${x.options[x.answer]}</div></div><div class="source">知识点：${x.keyPoint}</div></article>`}return `<article class="item"><div class="meta"><span class="pill ${x.type==='病例分析'?'case':'written'}">${x.type}</span><span>${x.chapter} · 原题 ${x.number}</span></div><h2>${idx+1}. ${x.stem}</h2><details class="answer"><summary>展开答案和解析</summary><p><b>答案：</b>${x.answerText}</p><p><b>解析：</b>${x.explanation}</p></details><div class="source">题目来源：用户提供的《人体解剖学应试指南（OCR）》第一篇“运动系统”</div></article>`}).join('');
grid.querySelectorAll('.item[data-id]').forEach(card=>{const x=DATA.find(y=>y.id===card.dataset.id);card.querySelectorAll('.opt').forEach(btn=>btn.onclick=()=>{const chosen=Number(btn.dataset.i);card.querySelectorAll('.opt').forEach((b,i)=>{b.disabled=true;if(i===x.answer)b.classList.add('correct');if(i===chosen&&chosen!==x.answer)b.classList.add('wrong')});const fb=card.querySelector('.feedback');fb.classList.add('show');fb.querySelector('strong').textContent=chosen===x.answer?'回答正确':'需要复盘';fb.querySelector('span').textContent=x.explanation})})}
typeBtns.forEach(b=>b.onclick=()=>{typeBtns.forEach(x=>x.classList.remove('active'));b.classList.add('active');state.type=b.dataset.type;render()});chapter.onchange=()=>{state.chapter=chapter.value;render()};search.oninput=()=>{state.q=search.value.trim();render()};render();</script></body></html>
